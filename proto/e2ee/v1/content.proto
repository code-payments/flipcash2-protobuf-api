syntax = "proto3";

package flipcash.e2ee.v1;

option go_package = "github.com/code-payments/flipcash2-protobuf-api/generated/go/e2ee/v1;e2eepb";
option java_package = "com.codeinc.flipcash.gen.e2ee.v1";
option objc_class_prefix = "FPBE2eeV1";

import "common/v1/common.proto";
import "e2ee/v1/model.proto";
import "google/protobuf/timestamp.proto";
import "messaging/v1/model.proto";
import "validate/validate.proto";

// This file is the contract BETWEEN CLIENTS. Nothing in it is ever seen by
// the server: a Content is serialized, padded, encrypted under a Double
// Ratchet session or a sender key, and carried as Envelope.content. It is
// the E2EE counterpart of messaging.v1's Content, reactions, pointers and
// typing notifications, restated as things one device says to another
// rather than things the server records, in the shape of Signal's own
// Content message.
//
// Because the server cannot validate any of it, the validate rules here are
// what a RECEIVING client enforces on what it decrypts, and a client that
// receives a Content violating them drops it.

// MessageId is the client-generated identity of a message: the value every
// later reference to it (an edit, a deletion, a reaction, a read receipt)
// names. Generated by the sending device, typically a random UUID,
// and unique across everything that device ever sends. It replaces the
// plaintext system's server-assigned, per-chat sequence number, which an
// encrypted system cannot have: the server does not know a message from a
// receipt. It also replaces Signal's convention of naming a message by its
// sent timestamp.
//
// A message's full identity is (Envelope.source.user_id, MessageId): two
// users could in principle generate the same value, so a client keys its
// store by both. A DataMessage arriving under an identity the client
// already holds is an idempotent upsert, not a second message: a resend
// after a DecryptionErrorMessage reaches every device of the reporter's
// user, not only the one that failed, and a retried send can deliver an
// envelope twice, since the server does not deduplicate (see
// Mailbox.SendEnvelopes).
message MessageId {
    bytes value = 1 [(validate.rules).bytes = {
        min_len: 16
        max_len: 16
    }];
}

// Content is the plaintext of an envelope. Exactly one variant is set. A
// receiving client that finds a variant it does not know, or none, drops the
// content without error: a newer sender may use a variant this build
// predates.
message Content {
    oneof type {
        option (validate.required) = true;

        DataMessage             data                    = 1;
        EditMessage             edit                    = 2;
        DeleteMessage           delete                  = 3;
        ReactionMessage         reaction                = 4;
        ReceiptMessage          receipt                 = 5;
        TypingMessage           typing                  = 6;
        SenderKeyDistribution   sender_key_distribution = 7;
        DecryptionErrorMessage  decryption_error        = 8;
        EndSession              end_session             = 9;
        NullMessage             null                    = 10;
    }

    // Random bytes the sender appends so that the ciphertext's length does
    // not reveal the variant or the text's length. Senders size this so the
    // serialized Content, including this field's tag and length prefix, is
    // a multiple of 80 bytes, the block size Signal settled on from its own
    // traffic. Signal pads the serialized bytes below the protobuf layer
    // instead, with a 0x80 terminator and zeros; this contract keeps it
    // inside the message so no framing is needed.
    //
    // The block size is a sender-side parameter, not a compatibility one:
    // receivers ignore the field, so it can change in any client release.
    // The cap below is deliberately larger than the block, so a move to a
    // larger block later needs no contract change; it bounds abuse only.
    bytes padding = 20 [(validate.rules).bytes = {
        max_len: 160
    }];
}

// DataMessage is a new message in the chat: the counterpart of
// messaging.v1.SendMessage. Sent to every device of every member, including
// the sender's own other devices, which record it as sent rather than
// received (see Envelope.source).
message DataMessage {
    MessageId id = 1 [(validate.rules).message.required = true];

    // Message content, which is currently guaranteed to have exactly one
    // item.
    repeated MessageContent content = 2 [(validate.rules).repeated = {
        min_items: 1
        max_items: 1
    }];

    // When the sender composed the message. Ordering within a chat is by
    // this value with (sender, id) as the tie-break; a client displaying a
    // message it received far out of order shows it where this places it.
    google.protobuf.Timestamp sent_ts = 3 [(validate.rules).timestamp.required = true];
}

// MessageContent is one item of a message's content: the counterpart of
// messaging.v1.Content. Every kind is defined here rather than borrowed
// from messaging.v1, even where the shapes coincide today, because the two
// systems' content diverges in what it may reference: a plaintext kind may
// name server state (a server-assigned MessageId, a server-derived
// rendition) that has no meaning inside ciphertext, and a plaintext kind
// may grow such a reference later without regard for this file. Keeping
// the types apart keeps that from leaking in. Text and replies for now;
// further kinds are added as new variants. There is no SystemContent,
// because there is no server to author one, and no DeletedContent, because
// a deletion is a DeleteMessage the client applies to its own store.
message MessageContent {
    oneof type {
        option (validate.required) = true;

        TextContent  text  = 1;
    }
}

// TextContent is a plain text body: the counterpart of
// messaging.v1.TextContent, with the same bound. Rendering (links, mentions,
// formatting) is the client's; nothing here is interpreted by anything
// else.
message TextContent {
    string text = 1 [(validate.rules).string = {
        min_len: 1
        max_len: 4096
    }];
}

// EditMessage replaces the content of a message the sender previously sent:
// the counterpart of messaging.v1.EditMessage. A receiver applies it only to
// a message whose author is the envelope's source user, and ignores an edit
// of a message it does not hold, or that a DeleteMessage already tombstoned.
// Edits to the same message apply in edited_ts order, latest wins. Whether
// an edit is still allowed (the plaintext system's message_edit_window) is
// the sender's policy; a receiver applies what it is sent.
message EditMessage {
    // The message being edited
    MessageId target = 1 [(validate.rules).message.required = true];

    // The new content for the message. Allowed content types match
    // DataMessage.
    repeated MessageContent content = 2 [(validate.rules).repeated = {
        min_items: 1
        max_items: 1
    }];

    // When the sender made the edit; drives the "edited" affordance and
    // orders edits to the same message.
    google.protobuf.Timestamp edited_ts = 3 [(validate.rules).timestamp.required = true];
}

// DeleteMessage tombstones a message the sender previously sent: the
// counterpart of messaging.v1.DeleteMessage. A receiver applies it only to
// a message whose author is the envelope's source user, replaces the content
// with a deleted placeholder, and ignores any later edit of it. A receiver
// that gets the deletion before the message remembers the deletion and
// tombstones the message on arrival.
message DeleteMessage {
    // The message being deleted
    MessageId target = 1 [(validate.rules).message.required = true];

    // When the sender deleted it.
    google.protobuf.Timestamp deleted_ts = 2 [(validate.rules).timestamp.required = true];
}

// ReactionMessage adds or removes the sender's reaction with an emoji on a
// message: the counterpart of messaging.v1.AddReaction and RemoveReaction.
// Reactions are per (message, emoji, reactor): a user may react with several
// emojis, and a remove names the one to take back. Idempotent: adding what is
// already there, or removing what is not, is a no-op. Reactions to the same
// (message, emoji) from the same reactor apply in reacted_ts order.
//
// Every aggregate the plaintext system serves (counts, reactor lists, the
// viewer's own reaction) is computed by the client from the reactions it has
// received; there is no server-side summary.
message ReactionMessage {
    // The message being reacted to
    MessageId target = 1 [(validate.rules).message.required = true];

    // The emoji to react with, or to take back.
    messaging.v1.Emoji emoji = 2 [(validate.rules).message.required = true];

    // True to remove the sender's reaction with this emoji; false to add it.
    bool remove = 3;

    // When the sender reacted.
    google.protobuf.Timestamp reacted_ts = 4 [(validate.rules).timestamp.required = true];
}

// ReceiptMessage tells messages' authors that the sender has reached a
// state with them: the counterpart of messaging.v1.AdvancePointer, restated
// per message because client-generated ids have no order the server could
// hold a pointer against. It covers messages by any number of authors, so
// that one send reports a whole screen.
//
// Who receives it depends on the chat. In a DM it is sent pairwise to every
// device of the author and of the sender's own user. In a group it is sent
// under the sender key to the whole group, one send for every author on
// the screen, rather than one pairwise send per author: reading a screen
// with 50 authors would otherwise be 50 sends of up to 10 envelopes each.
// The trade is that every member, not only the author, learns what the
// sender has read, which is how the plaintext system's pointers already
// behave for a group's members, and how WhatsApp's group read receipts
// behave. A client may make group READ receipts a user setting; a member
// that receives a receipt for messages it did not author simply records
// it. In both cases the sender's siblings receive it, because a pointer in
// the plaintext system is server state every device of the reader sees,
// and here nothing but this message tells them: a READ that reached only
// the author would leave the reader's other devices showing the message
// unread. (Signal covers the same need with SyncMessage.Read; here the
// ordinary send path does it, since a device names its siblings as
// recipients like anyone else.)
//
// DELIVERED is normally not sent: the server issues a DeliveryReceipt on
// the author's behalf when a device acknowledges the envelope, and a client
// sends DELIVERED itself only for a message it received some other way.
// READ is sent when the user has seen the message.
//
// A client derives the plaintext system's pointer semantics from these: the
// author's "read up to" for a recipient is the latest sent_ts among messages
// that recipient has sent READ for.
message ReceiptMessage {
    Type type = 1 [(validate.rules).enum = {
        not_in: [0]
    }];
    enum Type {
        UNKNOWN   = 0;
        DELIVERED = 1;
        READ      = 2;
    }

    // The messages the receipt covers, grouped by author, one entry per
    // author. In a DM there is one entry, the peer.
    repeated AuthorMessages messages = 2 [(validate.rules).repeated = {
        min_items: 1
        max_items: 50
    }];

    // When the sender reached the state.
    google.protobuf.Timestamp ts = 3 [(validate.rules).timestamp.required = true];

    message AuthorMessages {
        // The author of the messages in message_ids.
        common.v1.UserId author = 1 [(validate.rules).message.required = true];

        repeated MessageId message_ids = 2 [(validate.rules).repeated = {
            min_items: 1
            max_items: 100
        }];
    }
}

// TypingMessage notifies the chat that the sender is typing: the counterpart
// of messaging.v1.NotifyIsTyping, with Signal's two states. Always sent with
// SendEnvelopesRequest.online set, so the server delivers it only to
// connected devices and never queues it, and with content hint IMPLICIT.
// In a group it is sent under the sender key, as a SENDER_KEY_MESSAGE, as
// Signal sends group typing: one encryption per burst, not one ratchet
// step per member device. In a DM it is pairwise like everything else.
// There is no STILL_TYPING or TYPING_TIMED_OUT: a sender that is still
// typing sends STARTED again, and a receiver times a STARTED out itself if
// no STOPPED follows.
message TypingMessage {
    State state = 1 [(validate.rules).enum = {
        not_in: [0]
    }];
    enum State {
        UNKNOWN_TYPING_STATE = 0;
        STARTED_TYPING       = 1;
        STOPPED_TYPING       = 2;
    }

    google.protobuf.Timestamp ts = 2 [(validate.rules).timestamp.required = true];
}

// SenderKeyDistribution gives the receiver the sender's current sender key
// for the chat, so it can decrypt the sender's SENDER_KEY_MESSAGE envelopes
// there. This is how a group message is encrypted once and read by every
// member: each member device first distributes its sender key to every other
// member device pairwise, under their Double Ratchet sessions, then encrypts
// group messages under it. The distribution is per (sending device, chat).
//
// Sender keys are for groups only; a DM is always pairwise. libsignal keys
// a sender key by a UUID distribution id the sender chooses per group, and
// a group's common.v1.ChatId is a 16-byte UUID, so clients use the chat id
// itself as the distribution id. A "new key" below is a fresh sender key
// state under that same distribution id, which yields a new chain id.
//
// A distribution is addressed to users, never to a subset of a user's
// devices: Mailbox.SendEnvelopes holds every send to a named user's full
// device set, so a member whose one new device lacks the key is sent it on
// all of their devices, and the others discard the repeat. A sender
// distributes:
//   - to every member before its first group send, and, for a device that
//     has just joined, at once on joining, whether or not it means to
//     speak: that distribution is what opens its pairwise sessions with
//     every member device, and every member device replies with its own
//     distribution INSIDE the session so opened, as an ordinary CIPHERTEXT,
//     rather than fetching the joiner's prekey bundle. A PQXDH initial
//     message gives its recipient a working session at once, so the reply
//     needs no bundle; fetching one anyway would spend a one-time prekey
//     of the joiner's per member device, up to the whole pool on one join.
//     A member fetches the joiner's bundle only if it must send before the
//     joiner's distribution has arrived;
//   - to a new member once a roster change reveals them, and to a member
//     again once a DeviceMismatch reveals a device of theirs it has not
//     reached;
//   - to every remaining member, with a NEW key, after a member leaves,
//     before its next group send, so the leaver cannot read what follows;
//   - to every member, with a NEW key, once the current key is older than
//     a maximum age the client fixes (Signal rotates after 14 days), so a
//     key that leaks does not expose the group's traffic indefinitely;
//   - on request, when a DecryptionErrorMessage says a member could not
//     decrypt a sender key message.
//
// Ordering: a recipient must hold the distribution before the first
// SENDER_KEY_MESSAGE under it, or decryption fails with no sender key state
// and the recipient falls back to a DecryptionErrorMessage. A mailbox
// orders envelopes by the server's acceptance, so a sender waits for OK
// from the distribution's SendEnvelopes call before making the group send.
// It does not wait for delivery receipts.
//
// A receiver keeps the sender keys it holds per (source device, chat), and
// discards them all when it leaves the chat.
message SenderKeyDistribution {
    // A libsignal SenderKeyDistributionMessage: the distribution id, chain
    // id, iteration, chain key and signing key.
    bytes message = 1 [(validate.rules).bytes = {
        min_len: 1
        max_len: 4096
    }];
}

// DecryptionErrorMessage tells the source of an envelope that the sender
// could not decrypt it, so the source can repair the session: Sesame's
// recovery from a lost or corrupted session, with the fields and meaning of
// libsignal's message of the same name. It is the only Content sent as a
// PLAINTEXT_CONTENT envelope, since by definition the sender may have no
// working session to encrypt it under.
//
// It is sent to every device of the source user, because
// Mailbox.SendEnvelopes holds every send to a named user's full device set,
// and each of those devices compares device_id to its own: the one it
// names acts, the rest drop it. The reporting device is Envelope.source on
// the envelope that carries it.
//
// The source device, on receipt, archives its session with the reporter
// (if ratchet_key names its current one), starts a new one from a fresh
// prekey bundle, resends the failed message if its content hint was
// RESENDABLE, and sends a new SenderKeyDistribution if the failed envelope
// was a SENDER_KEY_MESSAGE. A resend is a new send under a fresh
// client_ts with the original MessageId inside, never a repeat of the
// failed client_ts, so that a receipt or a further error report names one
// attempt unambiguously.
message DecryptionErrorMessage {
    // The client_ts of the envelope that failed to decrypt, at millisecond
    // precision as it was sent, so it maps onto libsignal's u64 millisecond
    // timestamp without loss.
    google.protobuf.Timestamp client_ts = 1 [(validate.rules).timestamp.required = true];

    // The ratchet public key from the failed message's header: for a
    // CIPHERTEXT, the SignalMessage's own; for a PREKEY_MESSAGE, that of the
    // SignalMessage carried inside it. It lets the source confirm the failure
    // was against its current session before discarding it. Absent only when
    // the envelope was a SENDER_KEY_MESSAGE, which has no session.
    EcPublicKey ratchet_key = 2;

    // The device that sent the envelope that failed to decrypt: its
    // Envelope.source.device_id. Every device of the source user receives
    // this message, and only the one this names acts on it.
    DeviceId device_id = 3 [(validate.rules).message.required = true];
}

// EndSession asks the receiver to archive its session with the sender, after
// which the sender's next message will be a PREKEY_MESSAGE that starts a new
// one. Sent when a client believes its session state is unrecoverable.
//
// Signal-Android has retired this: it reserves the DataMessage END_SESSION
// flag and no longer sends it, recovering a broken session through
// DecryptionErrorMessage, or, when it knows its own state is gone, by
// archiving the session and sending a NullMessage as a fresh
// PREKEY_MESSAGE, which this contract also supports and which achieves
// the same reset without a dedicated variant. Signal-Desktop still declares
// the flag and honours it on receipt. EndSession is kept as the explicit
// form of that reset; a client may use either, and a client that can use
// the decryption error flow instead should.
message EndSession {
}

// NullMessage carries nothing. Sent to advance a ratchet, or to keep a
// session exercised, without saying anything.
message NullMessage {
}

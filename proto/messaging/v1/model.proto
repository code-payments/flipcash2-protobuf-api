syntax = "proto3";

package flipcash.messaging.v1;

option go_package = "github.com/code-payments/flipcash2-protobuf-api/generated/go/messaging/v1;messagingpb";
option java_package = "com.codeinc.flipcash.gen.messaging.v1";
option objc_class_prefix = "FPBMessagingV1";

import "blob/v1/model.proto";
import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

message MessageId {
    // Per-chat, server-assigned, gapless sequence number. Together with the
    // chat ID this is the message's canonical identity, sort key, and
    // pagination cursor. Gapless ordering lets clients trivially detect missing
    // messages: a complete history has no gaps between consecutive numbers.
    uint64 value = 1 [(validate.rules).uint64.gte = 1];
}

// ClientMessageId is a client-generated identifier for a message send.
//
// It serves two purposes:
//  - Idempotency: the server dedups on this value, so a retried SendMessage
//    (e.g. after a network failure) returns the originally created message
//    instead of assigning a new sequence number and creating a duplicate.
//  - Correlation: clients use it to match an optimistic local echo to the
//    server-assigned Message returned in the response.
//
// Unlike MessageId, this is owned by the client and is not the message's
// canonical identity; it is typically a randomly generated UUID.
message ClientMessageId {
    bytes value = 1 [(validate.rules).bytes = {
        min_len: 16
        max_len: 16
    }];
}

// A message in a chat
message Message {
    // Per-chat sequence number identifying this message
    MessageId message_id = 1 [(validate.rules).message.required = true];

    // The chat member that sent the message. For system-level messages,
    // this will be ommitted.
    common.v1.UserId sender_id = 2;

    // Message content, which is currently guaranteed to have exactly one item.
    repeated Content content = 3 [(validate.rules).repeated = {
        min_items: 1
        max_items: 1
    }];

    // Timestamp this message was generated at.
    google.protobuf.Timestamp ts = 4 [(validate.rules).timestamp.required = true];

    // The number of unread-eligible messages in this chat up to and including
    // this message. This is a SEPARATE sequence from message_id: messages that
    // don't count toward unread keep their message_id but do NOT advance this
    // value — they  carry the previous count forward, so every message reports
    // the running total. A member's unread count is computed entirely on the
    // client as the difference between the latest message's unread_seq and the
    // unread_seq of the message at their READ pointer.
    uint64 unread_seq = 5;

    // If set, the timestamp this message was last edited at. Absent on messages
    // that have never been edited. The content above always reflects the
    // current (materialized) state, so clients render it directly; this field
    // only drives an "edited" affordance. Deletions are represented in content
    // via DeletedContent, not here.
    google.protobuf.Timestamp last_edited_ts = 6;

    // The event-log sequence at which this message reached its current state:
    // the point of the most recent mutation (send, edit, or delete) affecting
    // it. A per-message VERSION stamp — distinct from message_id (fixed
    // identity/order) and unread_seq (unread accounting) — that advances on
    // every edit/delete while message_id stays fixed.
    //
    // It makes a Message self-locating regardless of how it was obtained (event
    // stream, GetMessages, SendMessage echo, last_message, push). Clients apply
    // last-writer-wins by this value: ignore a copy whose event_sequence is <=
    // the version already held, otherwise insert/replace. Cross-message gap
    // detection is separate, via the live event log's Event.sequence/count and
    // GetDelta catch-up.
    uint64 event_sequence = 7 [(validate.rules).uint64.gte = 1];

    // Aggregate reaction state for this message, current as of the time it was
    // read. This is a convergent overlay, NOT part of the content versioned by
    // event_sequence: reactions change without advancing event_sequence, so
    // clients refresh it on view and via live reaction updates rather than
    // through the event log.
    ReactionSummary reactions = 8;

    // Set when this copy of the message was redacted for the viewer: the
    // viewer sees that the message exists and its shape, never what it says.
    // The content keeps its kind and structure but holds placeholders — text
    // of the same script, length and line structure; media with its
    // dimensions and blurhash but no download_url; a reply to the same
    // message with a placeholder body. Cash, system and deleted content are
    // not redacted.
    //
    // A copy is redacted for one of two reasons, and the client cannot tell
    // which from the message alone (see ViewMode on the read request):
    //  - The viewer asked for FULL_OR_REDACTED and is a non-member of a group
    //    whose listener rules they do not satisfy. Full content would have
    //    been DENIED.
    //  - The viewer asked for REDACTED, whatever their standing.
    //
    // Clients render a redacted message blurred, the way they render a
    // blurhash, and must not offer to copy, quote, download or otherwise
    // surface its content. The placeholder is a pure function of the
    // message's identity and shape, so it is stable across pages, devices and
    // view modes. A redacted copy is not a version of the message:
    // event_sequence still describes the underlying message, and a client
    // that later reads the same message unredacted replaces the placeholder
    // because the read was unredacted, not because of a higher
    // event_sequence. Clients should keep redacted and unredacted copies of a
    // chat apart (keyed by the ViewMode the read was made under) rather than
    // merging them into one history.
    //
    // Per-viewer, like EmojiReaction.self_reactor. Absent on every message
    // from a server that does not redact.
    bool redacted = 9;
}

// ViewMode is what a client intends to render from a read of a chat's
// messages, and so how much of them the server may return. It is set on
// every read that returns a Message (GetMessage, GetMessages, GetDelta,
// chat.v1.GetChat, for last_message, and event.v1.StreamEvents when
// previewing a chat) and is combined with the viewer's standing in the chat:
//
//   - A member, or a non-member of a group who satisfies its listener rules,
//     may read the chat in full.
//   - A non-member of a group who does not satisfy its listener rules may
//     read it redacted, provided the group has at least one listener rule.
//   - Anyone else — a non-member of a DM, or of a group with no listener
//     rules — may not read it at all.
//
// The mode never widens what the standing allows: it can turn a full read
// into a redacted one, or a refusal into a redacted read, but never a
// redacted read into a full one. Redaction is the server's, not the
// client's; blurring full content on the device is not a substitute, since
// the content is still on the device.
//
// The default, FULL, is the contract that predates redaction, so a client
// that does not set the field behaves exactly as before.
enum ViewMode {
    // Full content or nothing. A viewer who may read the chat in full gets
    // it; every other viewer is DENIED. Never returns a redacted message, so
    // a client that does not understand Message.redacted is never handed one.
    FULL             = 0;

    // The most the viewer's standing allows. A viewer who may read the chat
    // in full gets it; a viewer who may only read it redacted gets it
    // redacted, with Message.redacted set on every message; every other
    // viewer is DENIED. The server evaluates the group's listener rules to
    // decide which, so this mode costs what a full read costs.
    FULL_OR_REDACTED = 1;

    // Redacted content, always. Every viewer who may read the chat at all —
    // in full or redacted — gets it redacted, with Message.redacted set on
    // every message; every other viewer is DENIED. A member asking for
    // REDACTED gets placeholders too. The server does not evaluate the
    // group's listener rules, only that it carries one, so this is the cheap
    // way to render a group blurred, and the mode to use whenever the client
    // intends to render it blurred regardless of whether the viewer could
    // read it in full.
    REDACTED         = 2;
}

// Content for a chat message
message Content {
    oneof type {
        option (validate.required) = true;

        TextContent      text      = 1;
        CashContent      cash      = 2;
        ReplyContent     reply     = 3;
        MediaContent     media     = 4;
        SystemContent    system    = 5;
        DeletedContent   deleted   = 6;
        EncryptedContent encrypted = 7;
    }
}

// Raw text content
message TextContent {
    string text = 1 [(validate.rules).string = {
        min_len: 1
        max_len: 4096
    }];
}

// Cash content
message CashContent {
    // Intent ID identifying the cash transaction at the OCP layer
    common.v1.IntentId intent_id = 1 [(validate.rules).message.required = true];

    // The amount of cash that was sent
    common.v1.CryptoPaymentAmount amount = 2 [(validate.rules).message.required = true];

    // Reserved for receiver, which will is required for group chats
    reserved 3;

    // Verb for how the cash was sent. Clietns should always show SENT as a
    // fallback.
    enum Verb {
        SENT   = 0;
        TIPPED = 1;
    }
    Verb verb = 4;
}

// Reply content
message ReplyContent {
    // ID of the message being replied to
    MessageId replied_message_id = 1 [(validate.rules).message.required = true];

    // Reply message content. Allowed content types are:
    //  - TextContent
    //  - MediaContent
    repeated Content content = 2 [(validate.rules).repeated = {
        min_items: 1
        max_items: 1
    }];
}

// Media content from blobs the user has already uploaded. The following media
// types are supported:
//  - Images
message MediaContent {
    // The media items attached to this message. A single item today; raising
    // this cap later enables albums (each item self-describes its kind).
    //
    // On SendMessage the client supplies exactly one ORIGINAL rendition per
    // item; the server fills its metadata and appends the derived renditions.
    // Inside EncryptedContent, the sender sets the ORIGINAL's metadata itself
    // and there are no derived renditions; see EncryptedContent.
    repeated blob.v1.Media items = 1 [(validate.rules).repeated = {
        min_items: 1
        max_items: 1
    }];

    // Optional caption rendered alongside the media
    TextContent caption = 2;
}

// System message content
message SystemContent {
    // Best-effort, server-rendered text in the user's locale setting. Today this
    // is the only way to display a system message; once the structured `event`
    // oneof exists it becomes a fallback, rendered ONLY when the client does not
    // recognize the variant (old client, new server). It is not localized per
    // viewer — clients that know a variant render their own localized string.
    string fallback_text = 1 [(validate.rules).string = {
        min_len: 1
        max_len: 256
    }];

    // todo: Define events once we have them
}

// Deleted message content
message DeletedContent {
    // Timestamp the message was deleted. Set whenever a message is tombstoned;
    // clients can surface it as a "deleted" affordance. This is the deletion
    // analog of Message.last_edited_ts, kept here so all deletion state lives in
    // the content rather than as a separate flag on Message.
    google.protobuf.Timestamp deleted_ts = 1 [(validate.rules).timestamp.required = true];

    // When present, the user that deleted the message. If not present, a it is
    // a system-level deletion (eg. moderation check).
    common.v1.UserId deleted_by = 2;
}

// End-to-end encrypted content, sent only in DMs (chat.v1.ChatType
// CONTACT_DM or TIP_DM). SendMessage and EditMessage reject it in a group
// chat. The server stores and relays the ciphertext as-is and cannot read it,
// so it cannot moderate it, render a push preview from it, or produce a
// placeholder for it.
//
// The plaintext is a serialized Content message. The allowed plaintext types
// are:
//  - TextContent
//  - MediaContent, as described under "Media" below
//  - ReplyContent, whose own content is a TextContent or a MediaContent
// The server cannot enforce this. A client that decrypts any other type, or
// cannot decrypt the payload at all, renders the message as unsupported. A
// decrypted Content never itself holds EncryptedContent.
//
// Encryption is between the Ed25519 public keys the two DM members registered
// their accounts with, which each member already knows. Neither key is carried
// in the message: the sender is Message.sender_id and the recipient is the
// other member. For scheme X25519_XCHACHA20POLY1305:
//
//  1. Convert keys to X25519. The sender converts its Ed25519 private key to
//     an X25519 private key, and the recipient's Ed25519 public key to an
//     X25519 public key, using the standard birational map (libsodium's
//     crypto_sign_ed25519_sk_to_curve25519 and
//     crypto_sign_ed25519_pk_to_curve25519). The recipient does the same with
//     the roles reversed. Reject a public key that is not a valid point, or
//     that converts to a low-order X25519 point.
//
//  2. Compute the shared secret: ss = X25519(own_x25519_priv, peer_x25519_pub).
//     Abort if ss is all zeros.
//
//  3. Derive the chat key with HKDF-SHA256 (RFC 5869):
//       salt = min(pk_a, pk_b) || max(pk_a, pk_b)
//       ikm  = ss
//       info = "flipcash-dm-e2ee-v1" || chat_id
//       L    = 32
//     pk_a and pk_b are the two members' 32-byte Ed25519 public keys, ordered
//     bytewise so that both members derive the same key, and chat_id is the
//     raw bytes of common.v1.ChatId.value. The key depends only on the two
//     keys and the chat, so it can be derived once per chat and cached.
//
//  4. Encrypt with XChaCha20-Poly1305 (the IETF construction in libsodium's
//     crypto_aead_xchacha20poly1305_ietf_encrypt):
//       key       = the chat key from step 3
//       nonce     = 24 fresh random bytes, set in `nonce` below
//       plaintext = the serialized Content
//       aad       = "flipcash-dm-e2ee-v1" || chat_id
//                   || sender_pk || recipient_pk
//     The ciphertext, with its 16-byte Poly1305 tag appended, is set in
//     `ciphertext` below. Both directions use the same key, which is safe
//     because the nonce is random and 24 bytes long. Never reuse a nonce, and
//     do not substitute a 12-byte-nonce AEAD.
//
// sender_pk and recipient_pk are the 32-byte Ed25519 public keys of
// Message.sender_id and of the other member. The recipient decrypts with the
// key from step 3 and the same aad. Both keys are bound into the aad in
// sender-then-recipient order, so a ciphertext cannot be replayed as if the
// other member sent it, or moved to another chat.
//
// Because both members derive the same key, the sender can also decrypt its
// own messages, including on its other devices. Nothing binds the ciphertext
// to its MessageId, so a ciphertext re-posted in the same chat by the server
// decrypts as a valid message there.
//
// This scheme has no forward secrecy: anyone who later obtains either
// member's private key can decrypt every message in the chat, past and
// future. A scheme with ephemeral keys or a ratchet can be added as a new
// Scheme value without changing this message.
//
// Media
//
// A MediaContent plaintext references blobs the sender uploaded for this chat
// with blob.v1.InitiateExternalUploadRequest.end_to_end_encrypted_for. The
// scheme also determines the format of every blob the plaintext references.
// Clients never take the format from the blob's server-side metadata, which
// the server could alter. For scheme X25519_XCHACHA20POLY1305, each blob is
// encrypted with the chat key from step 3, using its own aad so that a blob
// can never be passed off as a message ciphertext, or the reverse:
//   nonce = 24 fresh random bytes
//   aad   = "flipcash-dm-e2ee-blob-v1" || chat_id
//           || sender_pk || recipient_pk || blob_id
//   blob  = nonce || XChaCha20-Poly1305(chat key, nonce, image bytes, aad)
// blob_id is the raw bytes of blob.v1.BlobId.value, which is known from
// InitiateExternalUpload before the bytes are uploaded. Binding it stops the
// server from serving one blob's bytes in place of another's. sender_pk is the
// key of the member who uploaded the blob, which is always Message.sender_id.
//
// The server never sees the image, so it cannot derive renditions or
// metadata, strip privacy metadata, or moderate. Before encrypting, the sender
// downscales the image, strips privacy metadata such as EXIF and location,
// and computes its dimensions and blurhash. It waits for the blob to be READY
// before sending the message.
//
// Each Media item carries exactly one ORIGINAL rendition. Its blob_id is set,
// and its BlobMetadata is set by the sender to describe the plaintext image:
// mime_type, the plaintext size_bytes, and ImageMetadata. download_url is left
// unset. Only image MIME types are allowed; a recipient renders any other as
// unsupported.
//
// Decrypting proves the sender wrote this metadata, but nothing checks it
// against the image. A recipient validates it with the blob.v1.BlobMetadata
// rules after decrypting, renders the message as unsupported if it is invalid,
// and treats the decoded image as authoritative: it uses the image's actual
// dimensions, and renders an image that fails to decode or whose decrypted
// length differs from size_bytes as unsupported.
//
// To display the image, the recipient:
//  1. Calls blob.v1.GetBlobs with AccessContext.chat to mint a download_url.
//     The metadata GetBlobs returns describes the ciphertext, so it is used
//     only for the URL. A blob still PROCESSING is retried later.
//  2. Downloads the blob, splits off the 24-byte nonce, and decrypts it with
//     the chat key and the aad above.
//  3. Renders the image using the metadata from the plaintext, showing the
//     blurhash until the download completes.
// A blob that is missing or fails to decrypt is rendered as unsupported.
message EncryptedContent {
    // The encryption scheme used, which determines how every other field, and
    // every blob the plaintext references, is interpreted. Clients render an
    // unrecognized scheme as unsupported.
    Scheme scheme = 1 [(validate.rules).enum = {
        in: [1] // X25519_XCHACHA20POLY1305
    }];
    enum Scheme {
        UNKNOWN                  = 0;
        X25519_XCHACHA20POLY1305 = 1;
    }

    // The random XChaCha20-Poly1305 nonce, unique per encryption.
    bytes nonce = 2 [(validate.rules).bytes = {
        min_len: 24
        max_len: 24
    }];

    // The encrypted, serialized Content with the 16-byte Poly1305 tag
    // appended. The upper bound fits a MediaContent with a maximum-length
    // caption (4096 characters of up to 4 bytes each) wrapped in a
    // ReplyContent, plus the tag.
    bytes ciphertext = 3 [(validate.rules).bytes = {
        min_len: 17
        max_len: 17408
    }];
}

// Emoji identifies an emoji used in a reaction. The value is a unicode emoji
// sequence — a single grapheme cluster, which may include modifiers such as a
// skin-tone selector or ZWJ joins — or a custom emoji identifier where
// supported.
message Emoji {
    // Structural bounds only — these bound size as defense-in-depth (min_len/
    // max_len count code points, max_bytes counts bytes; a complex ZWJ or
    // tag-flag sequence is ~8 code points but ~32 bytes, so both earn their
    // keep). True emoji validity (a real grapheme, normalization, any supported
    // set) is enforced in server code, not here.
    string value = 1 [(validate.rules).string = {
        min_len: 1
        max_len: 32
        max_bytes: 128
    }];
}

// Reactor identifies a user who reacted to a message with a given emoji, and
// when they did so.
message Reactor {
    common.v1.UserId user_id = 1 [(validate.rules).message.required = true];

    // Timestamp the user added this reaction. Display only: reactors are never
    // ordered by it (see version).
    google.protobuf.Timestamp reacted_ts = 2 [(validate.rules).timestamp.required = true];

    // The emoji aggregate's version at which this reaction was added — the
    // EmojiReaction.version the add produced. Unique among an emoji's reactors,
    // so it is the reactor list's order: descending version is reaction order,
    // newest first, with no clock involved. A reactor who removes and re-adds
    // comes back under a fresh, higher version, at the top. A client slotting a
    // ReactionUpdate's actor into sample_reactors records the update's version
    // here.
    uint64 version = 3 [(validate.rules).uint64.gte = 1];
}

// ReactionSummary is the aggregate reaction state attached to a message. It is
// bounded: the number of distinct reaction types per message is capped, so the
// summary stays small no matter how many users reacted. The full reactor list
// for any emoji is fetched on demand (paged), never inlined here.
message ReactionSummary {
    // The message these reactions belong to.
    MessageId message_id = 1 [(validate.rules).message.required = true];

    // One entry per distinct emoji reacted to this message
    repeated EmojiReaction reactions = 2;
}

// EmojiReaction aggregates all reactions of a single emoji on a message.
message EmojiReaction {
    // The emoji reacted with.
    Emoji emoji = 1 [(validate.rules).message.required = true];

    // Total number of users who reacted with this emoji. Authoritative and may
    // be arbitrarily large; the individual reactor identities are not all
    // returned here.
    uint64 count = 2;

    // The requesting user's own Reactor entry for this emoji: set exactly when
    // they currently react with it, absent when they do not. Per-viewer: count
    // and sample_reactors are shareable across users, but this is computed for
    // the caller. It is the same entry the reactor list carries, whether or
    // not the viewer still sits in sample_reactors, so a client can render
    // itself among the reactors, or place itself in a partially loaded reactor
    // list by its version, without paging GetReactors to find its own row.
    //
    // Its presence answers "did I react"; its version is NOT the watermark for
    // that toggle. An EmojiReaction is a snapshot at `version`, and every
    // transition of the viewer's at or below it is already reflected here, so
    // live ReactionUpdates for the viewer are applied against `version` as for
    // any other actor. In an AddReactionResponse the entry's version equals
    // `version`. In a summary read it is normally at most `version`, but can
    // exceed it by one: the viewer's own add landing between the server's
    // aggregate read and its per-viewer read. Then this entry is the newer
    // truth and the aggregate is one transition behind, which the add's own
    // ReactionUpdate or the next refresh reconciles.
    Reactor self_reactor = 3;

    // A small sample of reactors (e.g. for rendering a few avatars), capped
    // well below count: the most recent reactors by Reactor.version, newest
    // first. The complete, paged reactor list is fetched on demand via
    // GetReactors, in the same order.
    repeated Reactor sample_reactors = 4 [(validate.rules).repeated = {
        max_items: 8 // Sample only; not the full list
    }];

    // Version of this emoji's aggregate on the message: assigned by the server
    // and advanced by one on every change to it — a reactor added or removed.
    //
    // Opaque to clients, and for ordering only. Apply reaction updates
    // last-writer-wins by this value per (message, emoji) — and per actor for
    // self_reactor — and treat a loaded summary as stale when a higher
    // version arrives. It is compared the same way as chat.v1.RosterSummary.
    // version. It is NOT the chat event sequence (reactions never advance
    // that), and it is NOT gapless: a skipped value means nothing, and there is
    // no delta to fetch against it — a missed update is reconciled by
    // refreshing the summary on view.
    //
    // Keep the watermark after the emoji empties. The server retains the
    // version across an emoji's count reaching 0 and being re-added, so a
    // re-add always arrives with a higher version than the removal; a client
    // that forgets the (message, emoji) version when it stops rendering the
    // emoji has no way to reject a delayed, lower-versioned ADDED for it, and
    // would resurrect an emoji the server has already emptied. Hide the entry,
    // keep its version, at least for the session. A summary omits emptied
    // emoji entirely — their versions are not surfaced — so a refresh cannot
    // restore a watermark once forgotten.
    uint64 version = 5 [(validate.rules).uint64.gte = 1];
}

// ReactionUpdate is a best-effort, real-time reaction change for a single
// (message, emoji) cell. Reactions are a convergent overlay, so these ride the
// event stream OUTSIDE the gap-detected event log — a missed update is not
// caught up via GetDelta but reconciled by refreshing the message's
// ReactionSummary on view.
message ReactionUpdate {
    // The message whose reactions changed.
    MessageId message_id = 1 [(validate.rules).message.required = true];

    // The emoji that was added or removed.
    Emoji emoji = 2 [(validate.rules).message.required = true];

    // The user who added or removed the reaction. A client maintains its own
    // EmojiReaction.self_reactor by comparing this to itself (ADDED sets it
    // from this actor, `version` and `reacted_ts` below; REMOVED clears it),
    // so a reaction made on the user's other device is reflected.
    common.v1.UserId actor = 3 [(validate.rules).message.required = true];

    Action action = 4 [(validate.rules).enum = {
        not_in: [0]
    }];
    enum Action {
        UNKNOWN = 0;
        ADDED   = 1;
        REMOVED = 2;
    }

    // The emoji's total reactor count after this change. 0 means no reactors
    // remain: stop rendering the emoji, but keep its version watermark (see
    // EmojiReaction.version) so a delayed, lower-versioned ADDED for it is
    // still ignored rather than resurrecting it.
    uint64 count = 5;

    // The emoji aggregate's version after this change. Clients apply
    // last-writer-wins by this value: ignore the count if version <= the count
    // watermark held, and ignore the actor's self_reactor toggle if
    // version <= the per-actor watermark held. Matches EmojiReaction.version.
    uint64 version = 6 [(validate.rules).uint64.gte = 1];

    // When the actor reacted. On ADDED, clients record this as the actor's
    // Reactor.reacted_ts, and `version` above as their Reactor.version, when
    // slotting them into sample_reactors or an open reactor list; ignored for
    // REMOVED. This is a display timestamp, distinct from `version`, which is
    // the ordering key.
    google.protobuf.Timestamp reacted_ts = 7 [(validate.rules).timestamp.required = true];
}

message ReactionUpdateBatch {
    repeated ReactionUpdate reaction_updates = 1 [(validate.rules).repeated = {
        min_items: 1
        max_items: 100
    }];
}

// Pointer in a chat indicating a user's message history state in a chat.
message Pointer {
    // The type of pointer indicates which user's message history state can be
    // inferred from the pointer value. It is also possible to infer cross-pointer
    // state. For example, if a chat member has a READ pointer for a message with
    // ID N, then the DELIVERED pointer must be at least N.
    Type type = 1 [(validate.rules).enum = {
        not_in: [0]
    }];
    enum Type {
        UNKNOWN   = 0;
        SENT      = 1; // Always inferred by OK result in SendMessageResponse or message presence in a chat
        DELIVERED = 2;
        READ      = 3;
    }

    // The user ID associated with the pointer
    common.v1.UserId user_id = 2 [(validate.rules).message.required = true];

    // Everything at or before this message ID is considered to have the state
    // inferred by the type of pointer.
    MessageId value = 3 [(validate.rules).message.required = true];

    // Timestamp the pointer was last advanced at
    google.protobuf.Timestamp ts = 4 [(validate.rules).timestamp.required = true];
}

message MessageIdBatch {
    repeated MessageId message_ids = 1 [(validate.rules).repeated = {
        min_items: 1
        max_items: 100
    }];
}

message MessageBatch {
    repeated Message messages = 1 [(validate.rules).repeated = {
        min_items: 1
        max_items: 100
    }];
}

message PointerBatch {
    repeated Pointer pointers = 1 [(validate.rules).repeated = {
        min_items: 1
        max_items: 100
    }];
}

// Event is a contiguous run of one or more durable mutations to a chat, delivered
// atomically — the unit of the chat's event log. Newly sent messages, edits,
// and deletions are all mutations within an event.
//
// Only content-bearing, non-idempotent mutations live in the log, because that is
// what gap detection protects: missing one means missing data. Convergent state
// such as pointer advances (last-writer-wins, monotonic) and transient signals
// such as typing notifications are delivered out-of-band and fetched as current
// state, NOT replayed through this log.
//
// Clients apply events in ascending sequence order and use the sequence/count
// pair to detect gaps; on a gap they catch up via GetDelta.
message Event {
    // Per-chat event sequence valued AFTER this event applies: the END of the
    // half-open range (sequence - count, sequence] this event occupies. This is
    // a SEPARATE sequence from MessageId — edits and deletions advance it
    // without minting a new MessageId.
    uint64 sequence = 1 [(validate.rules).uint64.gte = 1];

    // The number of points this event consumes, equal to the number of
    // mutations it carries — each mutation is one point. The mutation at index
    // i sits at point (sequence - count + 1 + i). Clients gap-detect with
    // local + count == sequence, so a server that begins emitting count > 1
    // (e.g. a bulk delete) needs no client change.
    uint32 count = 2 [(validate.rules).uint32.gte = 1];

    // Timestamp this event occurred at.
    google.protobuf.Timestamp ts = 3 [(validate.rules).timestamp.required = true];

    // The mutations in this event, ascending by point. Length must equal count.
    repeated Mutation mutations = 4 [(validate.rules).repeated = {
        min_items: 1
        max_items: 100
    }];
}

// Mutation is a single point in the event log: one message sent, edited, or
// deleted. Each carries the full materialized state of the affected message, so
// clients apply it by inserting or replacing their cached copy without a
// refetch.
message Mutation {
    oneof type {
        option (validate.required) = true;

        // A newly sent message. Inserts a new message_id at the tail of the
        // chat. This is the only mutation that advances the MessageId sequence.
        Message message_sent = 1;

        // An edit to an existing message (same message_id, updated content,
        // last_edited_ts set).
        Message message_edited = 2;

        // A deletion of an existing message (same message_id, content replaced
        // with DeletedContent). The message_id is retained as a tombstone, so
        // the MessageId sequence stays gapless.
        Message message_deleted = 3;
    }
}

message EventBatch {
    repeated Event events = 1 [(validate.rules).repeated = {
        min_items: 1
        max_items: 100
    }];
}

message IsTypingNotification {
    common.v1.UserId user_id = 1 [(validate.rules).message.required = true];

    State state = 2;
    enum State {
        UNKNOWN_TYPING_STATE = 0;
        STARTED_TYPING       = 1;
        STILL_TYPING         = 2;
        STOPPED_TYPING       = 3;
        TYPING_TIMED_OUT     = 4;
    }
}

message IsTypingNotificationBatch {
    repeated IsTypingNotification is_typing_notifications = 1 [(validate.rules).repeated = {
        min_items: 1
        max_items: 100 // Arbitrary
    }];
}

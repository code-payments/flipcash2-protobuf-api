syntax = "proto3";

package flipcash.moderation.v1;

option go_package = "github.com/code-payments/flipcash2-protobuf-api/generated/go/moderation/v1;moderationpb";
option java_package = "com.codeinc.flipcash.gen.moderation.v1";
option objc_class_prefix = "FPBModerationV1";

import "common/v1/common.proto";
import "moderation/v1/model.proto";
import "validate/validate.proto";

service Moderation {
    // ModerateText checks text content against moderation policies
    rpc ModerateText(ModerateTextRequest) returns (ModerateTextResponse);

    // ModerateImage checks image content against moderation policies
    rpc ModerateImage(ModerateImageRequest) returns (ModerateImageResponse);
}

message ModerateTextRequest {
    // The text content to moderate
    string text = 1 [(validate.rules).string = {
        min_len: 1
        max_len: 4096
    }];

    common.v1.Auth auth = 2 [(validate.rules).message.required = true];

    // What the text is for, which decides the checks it is moderated under and
    // is bound into the attestation. Text over the kind's maximum length (32
    // bytes for a currency name, 8 for a symbol) is refused as invalid, since
    // it could never be used as that kind.
    //
    // UNKNOWN_CONTENT_KIND is for legacy clients and will be refused once they
    // are gone; new clients must always set a kind.
    ContentKind kind = 3 [(validate.rules).enum = {
        in: [0, 1, 2, 3] // UNKNOWN_CONTENT_KIND, CURRENCY_NAME, CURRENCY_SYMBOL, CURRENCY_DESCRIPTION
    }];
}

message ModerateTextResponse {
    Result result = 1;
    enum Result {
        OK                   = 0;
        DENIED               = 1;
        UNSUPPORTED_LANGUAGE = 2;
    }

    // Whether the text content is allowed
    bool is_allowed = 2;

    // Signed attestation of the moderation result when content is allowed
    ModerationAttestation attestation = 3;

    // The best fit flagged category when content is not allowed
    FlaggedCategory flagged_category = 4;
}

message ModerateImageRequest {
    // The raw image data to moderate
    bytes image_data = 1 [(validate.rules).bytes = {
        min_len: 1
        max_len: 1048576 // 1 MB
    }];

    common.v1.Auth auth = 2 [(validate.rules).message.required = true];

    // What the image is for, which decides the checks it is moderated under and
    // is bound into the attestation.
    //
    // UNKNOWN_CONTENT_KIND is for legacy clients and will be refused once they
    // are gone; new clients must always set a kind.
    ContentKind kind = 3 [(validate.rules).enum = {
        in: [0, 4] // UNKNOWN_CONTENT_KIND, CURRENCY_ICON
    }];
}

message ModerateImageResponse {
    Result result = 1;
    enum Result {
        OK                 = 0;
        DENIED             = 1;
        UNSUPPORTED_FORMAT = 2;
    }

    // Whether the image content is allowed
    bool is_allowed = 2;

    // Signed attestation of the moderation result when content is allowed
    ModerationAttestation attestation = 3;

    // The best fit flagged category when content is not allowed
    FlaggedCategory flagged_category = 4;
}

syntax = "proto3";

package flipcash.moderation.v1;

option go_package = "github.com/code-payments/flipcash2-protobuf-api/generated/go/moderation/v1;moderationpb";
option java_package = "com.codeinc.flipcash.gen.moderation.v1";
option objc_class_prefix = "FPBModerationV1";

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

// ModerationAttestation is a signed proof of the moderation result.
// The signature is computed over this message without the signature field set.
message ModerationAttestation {
    // SHA-256 hash of the moderated content to be allowed
    bytes content_hash = 1;

    // Timestamp of the moderation
    google.protobuf.Timestamp timestamp = 2;

    // The user who submitted the content
    common.v1.UserId user_id = 3;

    // Public key of the attestor that signed this message
    common.v1.PublicKey attestor = 4;

    // Attestor signature over this message
    common.v1.Signature signature = 5;

    // What the content was moderated as. An attestation is valid only for the
    // kind it names: a verifier checks it against the kind the content is used
    // as (e.g. a currency's name), so content moderated under one kind's checks
    // cannot be used where another kind's are required.
    //
    // UNKNOWN_CONTENT_KIND for content moderated by a request that named no
    // kind, under the checks every kind once shared. Accepted for any kind for
    // a transition period, after which it is accepted for none.
    ContentKind kind = 6;
}

// ContentKind is what a piece of moderated content is for. The server moderates
// each kind under the checks that fit it, and binds the kind into the
// attestation (ModerationAttestation.kind).
enum ContentKind {
    // Legacy: the request named no kind. Moderated under the checks every kind
    // once shared, which treat any text short enough to be a currency name as
    // one.
    UNKNOWN_CONTENT_KIND = 0;

    // A currency's name (text).
    CURRENCY_NAME = 1;

    // A currency's symbol (text).
    CURRENCY_SYMBOL = 2;

    // A currency's description (text).
    CURRENCY_DESCRIPTION = 3;

    // A currency's icon (image).
    CURRENCY_ICON = 4;
}

enum FlaggedCategory {
    NONE          = 0;
    OTHER         = 1; // Fallback category when flagged content does not fit into a well-defined FlaggedCategory
    NSFW          = 2;
    IMPERSONATION = 3;
    MISLEADING    = 4;
    SPAM          = 5;
}

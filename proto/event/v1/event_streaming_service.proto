syntax = "proto3";

package flipcash.event.v1;

option go_package = "github.com/code-payments/flipcash2-protobuf-api/generated/go/event/v1;eventpb";
option java_package = "com.codeinc.flipcash.gen.events.v1";
option objc_class_prefix = "FPBEventV1";

import "event/v1/model.proto";
import "common/v1/common.proto";
import "messaging/v1/model.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

service EventStreaming {
    // StreamEvents streams events to the requesting user. Params, the first
    // message on the stream, selects what is streamed:
    //
    //   - With no target set, every event addressed to the signing user, across
    //     all of their events. This stream lives until either side closes it.
    //     For a group chat the user has archived (see
    //     chat.v1.Chat.ArchiveChat) it carries only what is addressed to the
    //     user personally, such as the MetadataUpdate.ViewerStateChanged of a
    //     change to their own state there and the RosterUpdate.MemberLeft of
    //     their own departure, unless the client has asked it to follow the
    //     user's archive (see StreamEventsRequest.FollowArchive), and then it
    //     carries the group's updates like any other's. What it did not carry
    //     is not replayed. An archived DM is carried like any other DM.
    //   - With chat_preview set, ChatUpdate for that single group chat, under
    //     a messaging.v1.ViewMode, and nothing else, for a bounded window of
    //     time. This is how a viewer who is not a member of a group — and so is
    //     not addressed by its events — previews it live before joining, and
    //     how any viewer previews a group redacted. It is the only
    //     chat-targeted stream; there is no open-ended stream for a single
    //     chat, and no stream of any kind targeted at a DM.
    //
    // The two are independent. A client may hold several streams at once, e.g.
    // a user stream plus a preview stream for the group it is currently
    // previewing as a non-member. Nothing is deduplicated across streams: a
    // member who opens a preview stream for one of their own chats receives
    // that chat's updates on both.
    rpc StreamEvents(stream StreamEventsRequest) returns (stream StreamEventsResponse);

    // ForwardEvents is an internal RPC for forwarding events to another server.
    rpc ForwardEvents(ForwardEventsRequest) returns (ForwardEventsResponse);
}

message StreamEventsRequest {
    oneof type {
        option (validate.required) = true;

        Params        params         = 1;
        ClientPong    pong           = 2;
        FollowArchive follow_archive = 3;
    }

    message Params {
        common.v1.Auth auth = 1 [(validate.rules).message.required = true];

        // ts contains the time for stream open.
        //
        // It is used primarily as a nonce for auth. Server may reject
        // timestamps that are too far in the future or past.
        google.protobuf.Timestamp ts = 2 [(validate.rules).timestamp.required = true];

        // What the stream is for. Optional: when nothing is set, the stream is
        // for the signing user and carries every event addressed to them, the
        // contract that predates this field. When set, it takes over, and the
        // stream carries only what the target describes.
        oneof target {
            ChatPreviewParams chat_preview = 3;
        }
    }

    // FollowArchive tells a user stream whether to carry the updates of the
    // group chats the user has archived (see chat.v1.Chat.ArchiveChat). A
    // stream opens not following them. The client turns following on while
    // the user is looking at their archive, i.e. the ARCHIVED folder of
    // chat.v1.Chat.GetGroupChatFeed or any archived group however it was
    // opened, and off when they leave it; moving between the folder and an
    // archived group keeps it on. Archived DMs are carried whatever the
    // setting, as every DM is.
    //
    // While following, the stream carries every archived group's updates as
    // it does an INBOX group's: a group archived meanwhile stays carried, and
    // one unarchived is carried whatever the setting. While not following, a
    // group archived meanwhile stops being carried, apart from what is
    // addressed to the user personally (see StreamEvents).
    //
    // The setting is the stream's own: the user's other streams, on this
    // device or another, are unaffected, and a new stream starts not
    // following, so a client still in the archive when it reconnects sends
    // FollowArchive again right after Params.
    //
    // The server answers every FollowArchive with a
    // StreamEventsResponse.FollowArchiveAck carrying its seq, in order, once
    // the stream does what was asked: after one turning following on, the
    // stream carries the archived groups' updates from the ack on, so the
    // client reads the ARCHIVED folder only after the ack (see
    // chat.v1.Chat.GetGroupChatFeed). After one turning it off the stream may
    // keep carrying them for a short while, and the client ignores what it
    // has no use for. Turning on a stream already following, or off one not
    // following, changes nothing and is still answered. Only a user stream
    // follows an archive: a preview stream ignores FollowArchive and sends no
    // ack.
    message FollowArchive {
        // Whether the stream follows the user's archive from now on.
        bool follow = 1;

        // Chosen by the client and echoed in the ack, so a client that turns
        // following on and off in quick succession can tell which request an
        // ack answers. A client increases it with every FollowArchive it
        // sends on a stream, so the ack carrying the highest seq is the one
        // answering its latest request and any lower one is stale. The server
        // neither checks nor relies on it: requests take effect in the order
        // they are sent, whatever their seq.
        uint64 seq = 2;
    }

    // ChatPreviewParams targets a stream at a preview of a single group chat:
    // ChatUpdate for chat_id, under view_mode, and nothing else, for a bounded
    // window of time. No update for any other chat, is ever delivered on it.
    //
    // Only group chats can be previewed. A DM has no one to preview it — a
    // non-member of a DM may not read it under any mode — so a chat_id naming
    // a DM is DENIED, whatever the viewer's standing and whatever the mode,
    // by the same rule that denies every other read of it. A DM's members
    // follow it on their user stream.
    //
    // The stream is time-bounded. The server fixes the lifetime of a preview
    // at open — the bound is the server's, not the client's, and there is no
    // way to request a longer one — and ends the stream with STREAM_EXPIRED
    // when it elapses, whether or not anything was delivered. Pings and pongs
    // keep the stream healthy, not alive: a pong does not extend the window.
    // A client still previewing the chat when the window closes opens a new
    // preview stream, and reconciles anything it missed in between the way it
    // would after any reconnect (GetDelta for the event log, a refresh of the
    // overlays). The server may refuse to open a preview, with DENIED, to a
    // viewer who opens too many in too short a time.
    //
    // A preview is for a viewer who is not (yet) a member of the chat. A
    // member's own chats are already carried on their user stream, which is
    // not time-bounded, and a client should not preview a chat it is a member
    // of; the server does not refuse it, but delivers the chat's updates on
    // both streams. A viewer who joins the chat while previewing it switches
    // to their user stream: the preview keeps delivering until its window
    // closes, but is not extended by the join.
    //
    // The stream opens only if the viewer may read the chat under the mode,
    // by the same rule as any other read under a messaging.v1.ViewMode: a
    // member, or a non-member of a group who satisfies its listener rules,
    // may read in full; a non-member of a group with listener rules they do
    // not satisfy may read redacted; anyone else is DENIED. A chat that does
    // not exist is NOT_FOUND. Standing is evaluated at stream open, and the
    // server may end the stream with DENIED before the window closes if the
    // viewer later may not read the chat under the mode — e.g. the rules
    // changed, or they were removed from the roster.
    //
    // Within a ChatUpdate, the mode decides only the messages: those carried
    // by events, and last_message in metadata_updates. Every message on the
    // stream is delivered under the mode fixed at open, like GetDelta, never
    // mixed, with Message.redacted set on each when redacted. Pointer,
    // typing, reaction and roster overlays are delivered whatever the mode.
    //
    // A client previewing a chat redacted keeps this stream and its
    // GetMessages/GetDelta reads under the same mode, so the events it
    // applies are shaped like the state it applies them to (see
    // messaging.v1.Message.redacted).
    message ChatPreviewParams {
        // The one chat whose updates are streamed. Must be a group chat; a DM
        // is DENIED.
        common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

        // What the client intends to render of the chat, and so whether its
        // messages may be delivered redacted (see messaging.v1.ViewMode).
        // Unset (FULL) delivers full content to a viewer who may read the
        // chat in full, and is DENIED to everyone else.
        messaging.v1.ViewMode view_mode = 2 [(validate.rules).enum = {
            in: [0, 1, 2] // FULL, FULL_OR_REDACTED, REDACTED
        }];
    }
}

message StreamEventsResponse {
    oneof type {
        option (validate.required) = true;

        ServerPing       ping               = 1;
        StreamError      error              = 2;
        EventBatch       events             = 3;
        FollowArchiveAck follow_archive_ack = 4;
    }

    // FollowArchiveAck answers a StreamEventsRequest.FollowArchive, sent once
    // the stream does what it asked.
    message FollowArchiveAck {
        // The seq of the FollowArchive this answers.
        uint64 seq = 1;
    }

    message StreamError {
        Code code = 1;
        enum Code {
            DENIED            = 0;
            INVALID_TIMESTAMP = 1;
            NOT_FOUND         = 2;
            STREAM_EXPIRED    = 3;
        }
    }
}

message ForwardEventsRequest {
    oneof type {
        option (validate.required) = true;

        UserEventBatch user_events = 1;
        ChatEventBatch chat_events = 2;
    }
}

message ForwardEventsResponse {
    Result result = 1;
    enum Result {
        OK     = 0;
        DENIED = 1;
    }
}
syntax = "proto3";

package flipcash.poll.v1;

option go_package = "github.com/code-payments/flipcash2-protobuf-api/generated/go/poll/v1;pollpb";
option java_package = "com.codeinc.flipcash.gen.poll.v1";
option objc_class_prefix = "FPBPollV1";

import "common/v1/common.proto";
import "moderation/v1/model.proto";
import "poll/v1/model.proto";
import "validate/validate.proto";

// Poll manages polls in group chats, private or not. DMs are not supported.
//
// A poll is shown in a chat as a message. The creator first calls CreatePoll,
// then sends the returned PollId with Messaging.SendMessage as a
// messaging.v1.PollWidget. The message carries only the PollId; clients get the
// question, options, and state from GetPoll or GetPolls.
//
// A poll belongs to the chat it was created for. Its creator may send it in
// that chat any number of times, for example to bring an older poll back to
// the bottom of the chat. Every message carrying it shows the same poll.
// Deleting a message that carries a poll does not delete the poll.
//
// In a group that is not private, the widget is sent as plain WidgetContent,
// so the server knows when the poll is first sent: the poll goes live then.
//
// In a private group, the question and option text are encrypted with the
// chat key (see EncryptedPollText), and the widget is sent inside
// messaging.v1.EncryptedContent like everything else. The server never learns
// which messages carry the poll, so the poll is live as soon as it is
// created. The server still sees the poll's structure (option count, mode,
// ends_at, balance parameters) and every vote, since it has to count them.
service Poll {
    // CreatePoll creates a poll for a group chat. The caller must be able to
    // send messages in the chat. A plaintext question and its options are
    // moderated together, as one text; encrypted text is not.
    //
    // In a group that is not private, the poll is not visible to anyone but
    // its creator, and does not accept votes, until it has been sent in a
    // message, and a poll that is never sent is eventually discarded. In a
    // private group, the poll is visible to members and accepts votes as soon
    // as it is created. PollDefinition.ends_at is a fixed time, so the poll's
    // clock runs from creation, not from when it is sent.
    rpc CreatePoll(CreatePollRequest) returns (CreatePollResponse);

    // GetPoll gets a poll, including the caller's own vote and, once the poll
    // is CLOSED, its results. The caller must be able to read the chat in
    // full (see messaging.v1.ViewMode FULL): in a group that is not private,
    // its members and anyone who satisfies its listener rules; in a private
    // group, only its members. Being able to preview the chat is not enough.
    rpc GetPoll(GetPollRequest) returns (GetPollResponse);

    // GetPolls is the batch version of GetPoll, for rendering a page of
    // messages. Polls the caller cannot see, or that don't exist, are omitted.
    rpc GetPolls(GetPollsRequest) returns (GetPollsResponse);

    // Vote replaces the caller's entire selection in an OPEN poll. Calling it
    // again with the same selection changes nothing; an empty selection
    // removes the caller's vote. The caller must be a member of the chat. The
    // chat's speaker rules don't apply: a member who cannot send messages in
    // the chat can still vote.
    rpc Vote(VoteRequest) returns (VoteResponse);
}

message CreatePollRequest {
    // The group chat to create the poll for.
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    PollDefinition definition = 2 [(validate.rules).message.required = true];

    // Key for retrying this request safely. A retry with the same key from the
    // same caller returns the poll the first attempt created, with result OK,
    // even if the parameters differ.
    IdempotencyKey idempotency_key = 3 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message CreatePollResponse {
    Result result = 1;
    enum Result {
        OK                         = 0;
        // The caller is not a member of the chat, or does not satisfy its
        // speaker rules.
        DENIED                     = 1;
        // The chat is a DM.
        CHAT_NOT_SUPPORTED         = 2;
        // The text is encrypted and the chat is not a private group.
        ENCRYPTION_NOT_ALLOWED     = 3;
        // The chat is a private group and the text is not encrypted.
        ENCRYPTION_REQUIRED        = 4;
        // The text is plaintext and option_count differs from its number of
        // options.
        OPTION_COUNT_MISMATCH      = 5;
        // ends_at is less than 5 minutes or more than 30 days after now.
        INVALID_ENDS_AT            = 6;
        // balance_parameters is missing for a BALANCE poll or set for a
        // COUNT poll, or its mint or currency is one the server cannot value.
        INVALID_BALANCE_PARAMETERS = 7;
        // The plaintext question and options, moderated together as one
        // text, were flagged.
        TEXT_MODERATED             = 8;
    }

    // The created poll. Set only when result == OK.
    PollMetadata poll = 2;

    // The best-fit category that tripped moderation, mirroring the Moderation
    // service's vocabulary. Set only when result == TEXT_MODERATED; NONE
    // otherwise.
    moderation.v1.FlaggedCategory flagged_category = 3;
}

message GetPollRequest {
    PollId poll_id = 1 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message GetPollResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        // The caller cannot read the poll's chat in full.
        DENIED    = 1;
        // The poll doesn't exist, or is in a group that is not private, has
        // not been sent yet, and the caller is not its creator.
        NOT_FOUND = 2;
    }

    // Set only when result == OK.
    PollMetadata poll = 2;
}

message GetPollsRequest {
    // Duplicates are ignored.
    repeated PollId poll_ids = 1 [(validate.rules).repeated = {
        min_items: 1
        max_items: 100
    }];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message GetPollsResponse {
    Result result = 1;
    enum Result {
        OK     = 0;
        DENIED = 1;
    }

    // One entry per requested poll the caller can see, in no particular order.
    // Clients apply each as described on PollState, so a poll whose status is
    // behind the one the client already holds does not regress it.
    repeated PollMetadata polls = 2 [(validate.rules).repeated = {
        max_items: 100
    }];
}

message VoteRequest {
    PollId poll_id = 1 [(validate.rules).message.required = true];

    // Positions in PollDefinition.options of every option the caller selects.
    // Replaces any earlier vote. Empty removes the caller's vote. More than
    // one is allowed only if PollDefinition.allows_multiple_choices is set.
    repeated uint32 option_indices = 2 [(validate.rules).repeated = {
        max_items: 10
        unique: true
        items: {
            uint32: {
                lt: 10
            }
        }
    }];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message VoteResponse {
    Result result = 1;
    enum Result {
        OK                = 0;
        // The caller is not a member of the chat.
        DENIED            = 1;
        // The poll doesn't exist, or is in a group that is not private and
        // has not been sent yet.
        NOT_FOUND         = 2;
        // The poll is no longer OPEN.
        POLL_CLOSED       = 3;
        // An option index is out of range, or several options were selected
        // in a poll that allows only one.
        INVALID_SELECTION = 4;
    }

    // The poll's state after the vote, with self_vote reflecting it, when
    // result == OK. The poll's current state when result == POLL_CLOSED.
    // Unset otherwise.
    PollState state = 2;
}

syntax = "proto3";

package flipcash.bank.plaid.v1;

option go_package = "github.com/code-payments/flipcash2-protobuf-api/generated/go/bank/plaid/v1;bankplaidpb";
option java_package = "com.codeinc.flipcash.gen.bank.plaid.v1";
option objc_class_prefix = "FPBBankPlaidV1";

import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

// BankLinkId identifies one of a user's linked banks. The server assigns it
// when the bank is linked; it is not Plaid's id for anything, and it is never
// reused, so a bank removed and linked again gets a new one.
message BankLinkId {
    bytes value = 1 [(validate.rules).bytes = {
        min_len: 16
        max_len: 16
    }];
}

// BankAccountId identifies one of a user's linked bank accounts. The server
// assigns it when the account is linked; it is not Plaid's id for the
// account, and it is never reused, so an account removed and linked again
// gets a new one.
//
// It identifies the account as Flipcash holds it, and does not pin the
// account's account or routing numbers: at some banks the numbers Plaid
// provides for an account are replaced, for example after the user withdraws
// and re-grants access to it, or when a link whose consent had already
// expired is repaired (renewing before the consent ends keeps them), even
// while the account keeps its id.
//
// It is kept on a best-effort basis. Plaid's id for an account belongs to one
// connection to the bank, and Plaid occasionally reassigns it; Plaid's
// persistent account id, which survives a new connection, exists only at some
// banks. When Flipcash brings a link's accounts in line with what the user
// shares, it matches each account to the one it held by Plaid's account id,
// or by Plaid's persistent account id where the bank provides one. It does
// not match by last digits, name or type. When it cannot match an account,
// it treats the one it held as removed and adds a new one, with a new id and
// linked_at. So an account's id is usually stable while the link keeps its
// connection, but when a link is carried over to a new connection (see
// CompleteBankLink), most of its accounts get new ids, except at banks that
// provide a persistent account id. A client looks accounts up again in a
// fresh list, or in the link just returned, rather than keep an account id
// for later. A link's BankLinkId and linked_at stay through a carry-over.
message BankAccountId {
    bytes value = 1 [(validate.rules).bytes = {
        min_len: 16
        max_len: 16
    }];
}

// IdempotencyKey lets a client safely retry CompleteBankLink, even though the
// public token Link returned can be used only once.
//
// The server remembers, for each key from the same caller, the answer it
// gave, whatever the result, or how far an attempt that failed part-way got,
// for at least 24 hours. It answers a retry with the same key within that
// time with the same result. The link an OK answer carries is returned as it
// is now; if it has since been removed, the retry is answered
// INVALID_PUBLIC_TOKEN. Which parameters were sent is not part of it: a
// retry with different parameters still gets the original answer.
//
// An attempt that failed part-way, with an error instead of a result (for
// example after the server had used the public token), has no answer to
// remember. A retry with the same key resumes it where it stopped, so it does
// not fail because the public token was already used.
//
// The client stores the key and the public token durably before it first
// calls CompleteBankLink. It retries with the same key, including on the
// app's next launch, when the call fails with a gRPC error or no answer
// arrives, and stops once it gets any result. Otherwise a link made by an
// attempt that failed part-way may be left unfinished. A retry after the
// server has forgotten the key is answered INVALID_PUBLIC_TOKEN, since the
// public token has long expired by then, even if the first attempt linked
// the bank. So the client stops retrying then, and on that result lists the
// links again, since the bank may already be linked. When the server forgets
// the key of an attempt left unfinished, it disconnects that attempt's
// connection at Plaid and keeps nothing from it, so such a retry's
// INVALID_PUBLIC_TOKEN and the list agree that the attempt linked nothing.
//
// The key is owned by the client and is typically a randomly generated UUID,
// a new one for each time Link completes. It is never exposed as the link's
// identity.
message IdempotencyKey {
    bytes value = 1 [(validate.rules).bytes = {
        min_len: 16
        max_len: 16
    }];
}

// BankLink is one bank a user has linked through Plaid, with the accounts at
// that bank they share with Flipcash. A user has at most one link per bank,
// as Plaid identifies banks (by its institution id): a second account at a
// bank already linked is added to its link (see StartBankUpdate), never
// linked on its own.
message BankLink {
    BankLinkId id = 1 [(validate.rules).message.required = true];

    // The bank.
    Institution institution = 2 [(validate.rules).message.required = true];

    // When the link is expected to stop working unless the user renews it
    // (see StartBankUpdate): when the user's consent ends, or when Plaid has
    // announced that it will disconnect the link, whichever is sooner. Unset
    // when neither is known. Many of the largest US banks end the user's
    // consent periodically, most every 12 months (Chase lets the user
    // choose), so renewing is routine; others set no end. Unset does not
    // mean the link will not break: a link can need repair without warning.
    // next_action says when to ask the user to renew the link (see RENEW); a
    // client does not compute its own window from relink_by. A disconnect
    // Plaid announced no longer counts toward it once CompleteBankUpdate
    // follows an update (see CompleteBankUpdate).
    google.protobuf.Timestamp relink_by = 3;

    // When the user linked the bank. Updates do not change it.
    google.protobuf.Timestamp linked_at = 4 [(validate.rules).timestamp.required = true];

    // The accounts at the bank the user shares with Flipcash, as Flipcash
    // holds them when the link is returned (see ListBankLinks). Empty when
    // the link holds no account (see NextAction.CHOOSE_ACCOUNT). They are
    // oldest linked first, and accounts linked in the same Link session are
    // in the order Plaid gives them. A link holds at most 16 accounts; when
    // the user shares more, the ones beyond the 16th in this order are not
    // held.
    repeated BankAccount accounts = 5 [(validate.rules).repeated.max_items = 16];

    // What the user does about the link, picked by the server. It is the one
    // signal for the state of the link. The app shows one message and button
    // for each action, so which situation gets which action is decided by
    // the server and can change without a client release. NONE and RENEW
    // mean the connection works; every other action says what is wrong and
    // what the user does about it. A client shows no prompt for NONE. It
    // treats an action it does not know as needing attention: it shows a
    // generic message and offers an update (see StartBankUpdate) and removal
    // (see RemoveBankLink).
    //
    // It describes Flipcash's connection to the bank through Plaid, not
    // whether a payout to the link's accounts can be made: that is for
    // whatever uses the accounts to decide.
    //
    // It is what Flipcash last learned, not a check made with the bank when
    // the link is returned, so a link that has just broken may still show
    // NONE for a while. Flipcash learns it both when it reads the link from
    // Plaid, which it does from time to time (see ListBankLinks), and from
    // notices Plaid sends it, and keeps the latest it has learned. Plaid
    // itself does not check most of a link's details with the bank often,
    // so most problems with a link reach Flipcash through Plaid's notices.
    // A link gone at Plaid has no next action: once Flipcash learns of it,
    // it removes the link, which is then not listed (see the Bank service).
    // Where Plaid reports that the user withdrew access to a single account
    // at their bank, Flipcash removes that account, as if the user had
    // unticked it in an update; not every bank reports this.
    //
    // When an update for RECONNECT, FIX_AT_BANK or CHOOSE_ACCOUNT fails in
    // Link, because Link cannot open for it or keeps failing, the user links
    // the bank again with StartBankLink, which carries the link over (it
    // keeps its id; see CompleteBankLink). A user at the limit on linked
    // banks, whom StartBankLink answers LIMIT_REACHED, removes the bank
    // first (see RemoveBankLink) and then links it again. Either way,
    // linking again counts toward the cap on how often banks are linked
    // (RATE_LIMITED, see StartBankLink), as any link does. When an update
    // for RENEW fails, the link still works and is left as it is: the user
    // may try again later.
    NextAction next_action = 6;
    enum NextAction {
        // Nothing to do: Flipcash knows of no problem with the link, and it
        // holds at least one account (see CHOOSE_ACCOUNT).
        NONE           = 0;

        // The link works but is expected to stop working: the user's consent
        // ends soon, or Plaid has warned that it will disconnect the link,
        // for example when the bank changes how it connects to Plaid.
        // relink_by says when, if known. The user renews the link with an
        // update (see StartBankUpdate). For an ending consent, the action
        // clears when a later read from Plaid finds that the consent's end
        // has moved on; for a disconnect Plaid warned of, it clears when
        // CompleteBankUpdate is called after the update.
        RENEW          = 1;

        // The bank needs the user to sign in or consent again, including
        // when their consent expired, and when they withdrew access at their
        // bank. The user repairs the link with an update (see
        // StartBankUpdate), which may restore it; a link whose access was
        // withdrawn at the bank is not gone at Plaid, though one the user
        // deleted through Plaid's own portal can be, and is then removed
        // (see the Bank service).
        RECONNECT      = 2;

        // The bank needs the user to do something with it directly first,
        // for example unlock their account, reset their password or finish
        // setting up online access. Then they update the link (see
        // StartBankUpdate).
        FIX_AT_BANK    = 3;

        // The link holds no account: the user shares none (they unticked
        // every one, or Plaid reports no open account they share), or the
        // accounts they shared were closed or access to them was withdrawn.
        // The app offers both ways forward: the user picks an account at the
        // bank with an update (see StartBankUpdate), or removes the bank
        // (see RemoveBankLink). The action stays CHOOSE_ACCOUNT after an
        // update that leaves the link with no account, since the user may
        // open or share one later.
        //
        // A link with no accounts has this action unless something else is
        // wrong with it, since fixing that comes first: RECONNECT,
        // FIX_AT_BANK, REMOVE and TRY_LATER each take priority. Such a link
        // never has NONE or RENEW.
        CHOOSE_ACCOUNT = 4;

        // Nothing the user does can repair the link: the bank can no longer
        // be connected through Plaid. The user removes the bank with
        // RemoveBankLink.
        REMOVE         = 5;

        // The link's state could not be checked right now: the bank or the
        // connection to it is temporarily unavailable. Either Flipcash could
        // not learn the link's state just now, including whether the link
        // still exists at Plaid, because Plaid could not be reached, did not
        // answer in time, or is limiting how often it can be asked about the
        // link; or Plaid reports that the bank is temporarily unavailable,
        // for example because it is down or not responding. It is only ever
        // temporary, and the user has nothing to repair. The client shows
        // one message, that the link could not be checked right now, and
        // lists the links again later, which reads the link from Plaid again
        // (see ListBankLinks).
        TRY_LATER      = 6;
    }
}

// BankAccount is one bank account a user shares with Flipcash, through the
// link to its bank.
//
// Everything in it is for showing the user which account it is. Nothing in
// it is an account or routing number.
message BankAccount {
    BankAccountId id = 1 [(validate.rules).message.required = true];

    // The bank's own name for the account, for example "Everyday Checking".
    // Empty when the bank gives none.
    string name = 2 [(validate.rules).string.max_len = 256];

    // The last two to four characters of the account number as Plaid shows
    // them. Empty when the bank gives none. It is not unique, even within a
    // link, so a client does not use it to identify an account.
    string mask = 3 [(validate.rules).string.max_len = 4];

    AccountType account_type = 4;

    // When the account was linked. Updates to its link do not change it,
    // but an account Flipcash could not match gets a new one with its new
    // id (see BankAccountId).
    google.protobuf.Timestamp linked_at = 5 [(validate.rules).timestamp.required = true];
}

// Institution is a bank, as Plaid names it.
message Institution {
    // Plaid's id for the institution.
    string id = 1 [(validate.rules).string = {
        min_len: 1
        max_len: 64
    }];

    // The institution's display name.
    string name = 2 [(validate.rules).string = {
        min_len: 1
        max_len: 256
    }];
}

// AccountType is the kind of a bank account. Only checking and savings
// accounts can be linked. The types may grow; a client treats one it does
// not know as ACCOUNT_TYPE_UNKNOWN.
enum AccountType {
    ACCOUNT_TYPE_UNKNOWN  = 0;
    ACCOUNT_TYPE_CHECKING = 1;
    ACCOUNT_TYPE_SAVINGS  = 2;
}

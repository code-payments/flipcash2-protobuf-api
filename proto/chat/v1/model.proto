syntax = "proto3";

package flipcash.chat.v1;

option go_package = "github.com/code-payments/flipcash2-protobuf-api/generated/go/chat/v1;chatpb";
option java_package = "com.codeinc.flipcash.gen.chat.v1";
option objc_class_prefix = "FPBChatV1";

import "blob/v1/model.proto";
import "common/v1/common.proto";
import "profile/v1/model.proto";
import "messaging/v1/model.proto";
import "validate/validate.proto";
import "google/protobuf/timestamp.proto";

enum ChatType {
    UNKNOWN    = 0;
    CONTACT_DM = 1;
    DM         = 2;
    GROUP      = 3;
}

message Metadata {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    // The type of chat
    ChatType type = 2 [(validate.rules).enum = {
        not_in: [0] // UNKNOWN
    }];

    // Members of this chat
    //
    // For large group chats, this is a subset of all members. Use
    // RosterSummary.member_count to infer if there are more members.
    repeated Member members = 3;

    // The last message in this chat. Withheld, along with
    // latest_event_sequence, from a viewer who may not read the chat. May be
    // redacted (see messaging.v1.Message.redacted) when the read was made
    // under a messaging.v1.ViewMode other than FULL.
    messaging.v1.Message last_message = 4;

    // The timestamp of the last activity in this chat
    google.protobuf.Timestamp last_activity = 5 [(validate.rules).timestamp.required = true];

    // The chat's head event sequence — the value of the most recent event in its
    // event log. A client compares this against its locally stored cursor for
    // the chat to decide whether catch-up is needed: if its cursor is behind, it
    // calls Messaging.GetDelta; if equal, it is current and can skip it.
    //
    // This is NOT derivable from last_message: an edit or deletion of an older
    // message advances the head without changing last_message, so this value can
    // exceed last_message.event_sequence. It is the same head reported by
    // GetDeltaResponse.latest_sequence.
    uint64 latest_event_sequence = 6;

    // Whether this chat is hidden from the requesting owner's chat list.
    // Per-viewer and server-computed (e.g. the chat's peer is on the caller's
    // blocklist). Clients should exclude hidden chats from the primary DM list.
    bool is_hidden = 7;

    // Title for this chat. Only supported for group chats
    string title = 8 [(validate.rules).string = {
        min_len: 0
        max_len: 64
    }];

    // The chat's profile picture — the avatar shown for it in chat lists and
    // headers — as the set of renditions it is stored as. Only supported for
    // group chats. Not to be confused with cover_picture, the banner shown
    // behind the chat's profile view.
    //
    // Set it on creation (see StartChatRequest) or with Chat.EditChat. To
    // fetch its bytes as a non-member, a GetBlobs call must carry a
    // blob.v1.AccessContext whose `chat_profile` scope names this chat.
    blob.v1.Media profile_picture = 9;

    // Chat roster summary
    RosterSummary roster_summary = 10 [(validate.rules).message.required = true];

    // Rules governing participation in this chat. Only supported for group
    // chats. If not set, the chat has no participation requirements. Never
    // set for a private group (see is_private), which admits a user by its
    // creator's approval instead.
    Rules rules = 11;

    // Per-viewer chat state, including what the viewer may do in the chat.
    // Absent when the chat holds nothing about them; always set for a member.
    ViewerState viewer_state = 12;

    // The user that created this chat. Set only for group chats.
    common.v1.UserId creator = 13;

    // Whether this chat is a private group. Only supported for group chats,
    // and fixed when the chat is created (see
    // StartChatRequest.private_group).
    //
    // A private group has no rules. Nobody joins it with Chat.JoinChat: a
    // user enters its lobby with Chat.EnterLobby and is admitted by its
    // creator. Only its members can read its messages, under any
    // messaging.v1.ViewMode, and every message a client sends in it is
    // messaging.v1.EncryptedContent, encrypted with the group's chat key
    // (see KeyEnvelope).
    //
    // A private group is visible from the moment it is created, but nothing
    // can happen in it until its creator has stored its key (see
    // StartChatRequest.PrivateGroupChatParameters).
    bool is_private = 14;

    // Whether the viewer is waiting in this private group's lobby (see
    // Chat.EnterLobby). Per-viewer and server-computed, like is_hidden.
    // Always false for a member, and for any chat that is not a private
    // group.
    bool in_lobby = 15;

    // A short free-form description of this chat, written by its creator.
    // Only supported for group chats. Empty when none is set. Part of the
    // group's record, like title, so it is returned to every viewer who can
    // see the chat, including in its public view.
    //
    // Set it on creation (see StartChatRequest) or with Chat.EditChat.
    //
    // Unlike cover_picture, it is carried by the feed RPCs meant for list
    // views (Chat.GetDmChatFeed, Chat.GetGroupChatFeed) too, so a list row
    // may show it, and an empty value there means none is set.
    string description = 16 [(validate.rules).string = {
        max_len: 160
    }];

    // The chat's cover picture — the banner shown behind the chat's profile
    // view — as the set of renditions it is stored as, like
    // profile_picture. Only supported for group chats. Unset when none is
    // set. Part of the group's record, like profile_picture, so it is
    // returned to every viewer who can see the chat, including in its public
    // view.
    //
    // Set it on creation (see StartChatRequest) or with Chat.EditChat. To
    // fetch its bytes as a non-member, a GetBlobs call must carry a
    // blob.v1.AccessContext whose `chat_profile` scope names this chat,
    // exactly as for profile_picture.
    //
    // It may be unset on a chat returned by a feed RPC meant for list views
    // (Chat.GetDmChatFeed, Chat.GetGroupChatFeed), so an unset value there
    // does not mean none is set. Fetch it with Chat.GetChat, and don't let a
    // feed result clear a cover picture the client already holds.
    blob.v1.Media cover_picture = 17;

    // Whether messages in this chat are end-to-end encrypted (see
    // messaging.v1.EncryptedContent). Only supported for DMs (CONTACT_DM or DM);
    // always false for group chats. A private group is always end-to-end
    // encrypted and does not use this flag (see is_private).
    //
    // Used to migrate DMs to E2EE: when true, clients send all new content in
    // the chat as EncryptedContent. When false, clients send content in the
    // clear. Existing messages are not re-encrypted, so a chat may hold a mix
    // of both.
    //
    // This is a transitional flag. Once E2EE has launched, clients should
    // always end-to-end encrypt DMs regardless of this value, and it will be
    // deprecated.
    bool use_e2ee = 100;
}

// Rules define the requirements a user must satisfy to participate in a chat.
//
// Rules are split into two classes, each of which is independently optional:
//  - ListenerRules gate reading and joining the chat
//  - SpeakerRules gate sending messages in the chat
//
// All rules within a class must be satisfied. Speaker rules are applied in
// addition to listener rules: a user must be able to listen before they can
// speak.
message Rules {
    // Rules to read and join the chat. If empty, anyone can read and join.
    repeated ListenerRules listener = 1 [(validate.rules).repeated = {
        min_items: 0
        max_items: 32
    }];

    // Rules to send messages in the chat. If empty, any member can send
    // messages.
    repeated SpeakerRules speaker = 2 [(validate.rules).repeated = {
        min_items: 0
        max_items: 32
    }];
}

// ListenerRules are the rules a user must satisfy to read and join a chat
message ListenerRules {
    oneof kind {
        option (validate.required) = true;

        MinimumBalanceRequirement minimum_balance = 1;
        StaffRequirement          staff           = 2;
    }
}

// SpeakerRules are the rules a user must satisfy to send messages in a chat
message SpeakerRules {
    oneof kind {
        option (validate.required) = true;

        MinimumBalanceRequirement minimum_balance = 1;
        StaffRequirement          staff           = 2;
        Never                     never           = 3;
        CreatorRequirement        creator         = 4;
    }
}

// StaffRequirement requires the user to be a Flipcash staff member, as
// indicated by UserFlags.is_staff.
message StaffRequirement {
}

// A special rule indicating that an action can never be taken.
message Never {
}

// CreatorRequirement requires the user to be the chat's creator, as indicated
// by Metadata.creator.
message CreatorRequirement {
}

// MinimumBalanceRequirement requires a user to hold a minimum balance,
// denominated in fiat, in an acceptable mint.
message MinimumBalanceRequirement {
    // The minimum balance, denominated in fiat
    common.v1.FiatPaymentAmount amount = 1 [(validate.rules).message.required = true];

    // The mints the balance may be held in. If empty, the requirement applies
    // to all mints. Otherwise, it applies only to the one listed mint.
    //
    // Currently limited to at most one mint. This is a repeated field so that
    // multiple mints can be specified in the future.
    repeated common.v1.PublicKey mints = 2 [(validate.rules).repeated = {
        min_items: 0
        max_items: 1
    }];
}

message Member {
    common.v1.UserId user_id = 1 [(validate.rules).message.required = true];

    // The user profile for this member. It contains a subset of identifiers
    // that can be publicly viewed within the chat.
    profile.v1.UserProfile user_profile = 2 [(validate.rules).message.required = true];

    // Chat message state for this member.
    //
    // If set, the list may contain DELIVERED and READ pointers. SENT pointers
    // are only shared between the sender and server, to indicate persistence.
    // Hydrated for a DM's participants; a group member's are never carried.
    repeated messaging.v1.Pointer pointers = 3 [(validate.rules).repeated = {
        min_items: 0
        max_items: 2
    }];

    // When the member most recently joined the chat. A member who left and
    // rejoined carries the rejoin time.
    //
    // Set for a group's members on a Chat.GetRoster page and on a
    // RosterUpdate.MemberJoined — the carriers a client builds its member
    // list from. Unset on Metadata.members, which carries only the viewer's
    // own entry, and never set for a DM's participants, whose roster is fixed
    // at creation.
    google.protobuf.Timestamp joined_at = 4;

    // The roster version at which the member most recently joined: the
    // version RosterSummary.version moved to on that transition, so it equals
    // roster_summary.version on the RosterUpdate.MemberJoined that announced
    // it. Zero for a member joined at the chat's creation and for every DM
    // participant. In future it moves with any change to what the chat
    // records about the member (e.g. a role), as RosterSummary.version does.
    //
    // A client merges what it holds for a user by this version: the greater
    // wins, so a GetRoster page that trails the stream (see GetRoster)
    // cannot resurrect a member the stream has already removed. Set wherever
    // joined_at is; a DM participant's is zero by that rule too.
    uint64 version = 5;
}

// MentionSuggestion is one person the caller may want to @mention in a chat,
// as returned by Chat.GetMentionSuggestions. It is not a Member: a suggestion
// may name someone who has since left the chat.
message MentionSuggestion {
    // The suggested user's public profile. user_id and username are always
    // set.
    profile.v1.UserProfile user_profile = 1 [(validate.rules).message.required = true];

    // When the user last sent a message in this chat, as the server records
    // it: it may trail their latest message by up to a minute. A client
    // merging new messages from the event stream into its list compares
    // against it. Unset for a user suggested for another reason.
    google.protobuf.Timestamp last_sent_at = 2;
}

// SampledChatter is one member of a group in a sample of its chatters, as
// returned by Chat.SampleChatters: a member as of the read. It is not a
// Member message, carrying no join time or roster version, because a sample
// is a snapshot replaced whole rather than merged against the roster by
// version.
message SampledChatter {
    // The member's public profile.
    profile.v1.UserProfile user_profile = 1 [(validate.rules).message.required = true];

    // When the member last sent a message in this chat, as the server records
    // it: it may trail their latest message by up to a minute. A client
    // moving new senders to the front compares against it. Unset for a
    // creator who has not sent recently.
    google.protobuf.Timestamp last_sent_at = 2;

    // Whether the member is the group's creator.
    bool is_creator = 3;
}

// RosterSummary describes a chat's roster — its member list — without
// containing it: what a client needs in order to know whether its copy of
// that list is stale, without holding the list.
//
// It says nothing about member profiles. Profiles are hydrated afresh onto
// every response that carries a member, and a profile change never moves
// this summary.
message RosterSummary {
    // Number of currently joined members. For a large group chat,
    // Metadata.members is a subset of the roster; this is its true size, and
    // Chat.GetRoster pages the roster itself.
    uint64 member_count = 1;

    // Version of the roster: advanced by exactly one on every change to the
    // membership records — a member joining, a member leaving, and in future
    // any change to what the chat records about a member (e.g. a role) — and
    // never by an idempotent no-op or a profile change. A viewer's own state
    // (see ViewerState) is not part of the roster: it is private to that
    // viewer, carries its own version, and never moves this one.
    //
    // Opaque to clients. Compare it against the last value seen: a different
    // value means the cached member list may be stale and should be refetched.
    // On a stream, apply a greater value and drop the rest, so delivery order
    // does not matter. It is compared the same way as ReactionSummary.version
    // and, like it, is NOT the chat event sequence: there is no delta to fetch
    // against it, only a refetch of the members.
    uint64 version = 2;
}

message MetadataUpdate {
    oneof kind {
        option (validate.required) = true;

        FullRefresh           full_refresh            = 1;
        LastActivityChanged   last_activity_changed   = 2;
        ViewerStateChanged    viewer_state_changed    = 3;
        TitleChanged          title_changed           = 4;
        ProfilePictureChanged profile_picture_changed = 5;
        DescriptionChanged    description_changed     = 6;
        CoverPictureChanged   cover_picture_changed   = 7;
    }

    // Refreshes the entire chat metadata
    message FullRefresh {
        Metadata metadata = 1 [(validate.rules).message.required = true];
    }

    // The last activity timestamp has changed to a newer value
    message LastActivityChanged {
        google.protobuf.Timestamp new_last_activity = 1 [(validate.rules).timestamp.required = true];
    }

    // The receiving user's own state for the chat has changed
    message ViewerStateChanged {
        ViewerState viewer_state = 1 [(validate.rules).message.required = true];
    }

    // The chat's title has changed (e.g. via Chat.EditChat). Delivered to the
    // chat's members, including the editor's other devices. Best-effort and
    // applied as received; a client that suspects a miss refetches the chat
    // via Chat.GetChat.
    message TitleChanged {
        // The new title, replacing Metadata.title.
        string new_title = 1 [(validate.rules).string = {
            min_len: 1
            max_len: 64
        }];
    }

    // The chat's profile picture has changed (e.g. via Chat.EditChat).
    // Delivered to the chat's members, including the editor's other devices.
    // Best-effort and applied as received; a client that suspects a miss
    // refetches the chat via Chat.GetChat.
    message ProfilePictureChanged {
        // The new profile picture, with the renditions the server derived,
        // replacing Metadata.profile_picture.
        blob.v1.Media new_profile_picture = 1 [(validate.rules).message.required = true];
    }

    // The chat's description has changed (e.g. via Chat.EditChat). Delivered
    // to the chat's members, including the editor's other devices.
    // Best-effort and applied as received; a client that suspects a miss
    // refetches the chat via Chat.GetChat.
    message DescriptionChanged {
        // The new description, replacing Metadata.description. Empty when the
        // description was cleared.
        string new_description = 1 [(validate.rules).string = {
            max_len: 160
        }];
    }

    // The chat's cover picture has changed (e.g. via Chat.EditChat). Delivered
    // to the chat's members, including the editor's other devices.
    // Best-effort and applied as received; a client that suspects a miss
    // refetches the chat via Chat.GetChat.
    message CoverPictureChanged {
        // The new cover picture, with the renditions the server derived,
        // replacing Metadata.cover_picture.
        blob.v1.Media new_cover_picture = 1 [(validate.rules).message.required = true];
    }
}

// RosterUpdate is a best-effort, real-time change to a chat's roster — a
// member joining (e.g. via Chat.JoinChat, or as the first member via
// Chat.StartChat) or leaving (e.g. via Chat.LeaveChat), or a change the
// recipient is not shown, which carries the summary alone (see
// MembershipChanged). It is delivered to the chat's members, including the
// affected user's other devices.
//
// Roster changes are a convergent overlay, so these ride the event stream
// OUTSIDE the gap-detected event log. Clients apply them by roster_summary
// version as described on RosterSummary: a greater version than the one held
// means the cached member list is stale and this update should be applied; a
// lesser or equal version should be dropped, so delivery order does not
// matter. A missed update is not caught up via GetDelta but reconciled by
// refetching the roster when a client observes a version it cannot reconcile.
message RosterUpdate {
    oneof kind {
        option (validate.required) = true;

        MemberJoined      member_joined      = 1;
        MemberLeft        member_left        = 2;
        MembershipChanged membership_changed = 3;
    }

    // The chat's roster summary after this change, applied by version as
    // described above.
    RosterSummary roster_summary = 10 [(validate.rules).message.required = true];

    // A member joined the chat. When member is the recipient, the recipient
    // has just become a member of the chat and should insert it into their
    // chat list using metadata.
    message MemberJoined {
        // The member that joined, with their profile hydrated and joined_at and
        // version set, so a client can update its cached member list without
        // a refetch and merge later Chat.GetRoster pages against it.
        Member member = 1 [(validate.rules).message.required = true];

        // The full metadata for the chat, so the recipient can insert it into
        // their chat list without a refetch. Set only when member is the
        // recipient; unset for every other member of the chat.
        //
        // The recipient inserts the chat from this snapshot, then applies the
        // enclosing RosterUpdate.roster_summary by version like any other
        // roster update. RosterUpdate.roster_summary is authoritative for
        // versioning; metadata.roster_summary is not compared separately.
        Metadata metadata = 2;
    }

    // A member left the chat. When user_id is the recipient, the recipient is
    // no longer a member of the chat and should remove it from their chat
    // list.
    message MemberLeft {
        // The user that left
        common.v1.UserId user_id = 1 [(validate.rules).message.required = true];
    }

    // The roster changed, but the change is not disclosed to the recipient:
    // the update names no member and carries no member to add or remove. The
    // recipient applies the enclosing roster_summary by version like any
    // other roster update, so member_count and version stay current, and
    // leaves its cached member list as it is. Having applied it, the
    // recipient holds the new version, so it is not a version to reconcile
    // by refetching the roster.
    //
    // It is never delivered to the user whose membership changed: their own
    // devices receive MemberJoined or MemberLeft for it.
    message MembershipChanged {}
}

message RosterUpdateBatch {
    repeated RosterUpdate roster_updates = 1 [(validate.rules).repeated = {
        min_items: 1
        max_items: 100
    }];
}

// ViewerState is what this chat holds about the requesting user,
// independent of whether they are a member. It is per-viewer and never
// shared with other members. Absent when the chat holds nothing about the
// viewer; always present for a member, whose permissions it carries.
message ViewerState {
    // State the viewer set for themselves through their own RPCs.
    Settings settings = 1;

    // What the viewer may do in this chat. Server-computed from the viewer's
    // standing in the chat and its rules, and never derivable by the client:
    // a client shows an affordance if and only if its flag is set. A change
    // to any flag (e.g. the viewer being granted or losing the ability to
    // edit) advances version and reaches the viewer's devices as a
    // MetadataUpdate.ViewerStateChanged.
    Permissions permissions = 2;

    // Advanced by exactly one on every real change to any field of this
    // message, never by a no-op. Compared like RosterSummary.version: apply
    // the greater value and drop the rest, so delivery order does not matter.
    // It is not the chat event sequence and has no delta.
    uint64 version = 10;

    message Settings {
        // Present if and only if the chat is muted for the viewer. Muted pushes
        // are still delivered, flagged with push.v1.ChatMetadata.muted, and the
        // client suppresses the notification.
        MuteState mute = 1;
    }

    // Permissions are the actions the viewer may take in the chat. Each flag
    // is named for the RPC it gates and defaults to false, so an unset flag
    // always means the action is not permitted.
    message Permissions {
        // Whether the viewer may call Chat.EditChat on this chat. False for
        // every DM, and for a group member the server does not permit to
        // edit it.
        bool can_edit = 1;
    }
}

message MuteState {
    oneof duration {
        option (validate.required) = true;

        // Muted until this time, after which the mute lapses. Nothing is
        // sent when it does, so the client owns the countdown.
        google.protobuf.Timestamp until = 1;

        // Muted forever until explicitly unmuted.
        Forever forever = 2;
    }

    message Forever {}
}

// IdempotencyKey lets a client safely retry a request that creates something.
// The server derives the created object's identity from the caller and this
// key, so a retry with the same key returns the original result instead of
// creating a duplicate. Which parameters were sent is not part of the identity:
// a retry with different parameters still returns the original.
//
// The key is owned by the client and is typically a randomly generated UUID.
// It is never exposed as the object's identity.
message IdempotencyKey {
    bytes value = 1 [(validate.rules).bytes = {
        min_len: 16
        max_len: 16
    }];
}

// KeyEnvelope carries a private group's chat key to one user, encrypted so
// that only that user can open it. The server stores one envelope per member
// and returns it with Chat.GetKeyEnvelope. It cannot open an envelope and
// never holds the chat key.
//
// The chat key is 32 random bytes generated by the group's creator, and it
// never changes. It encrypts every message and blob in the group (see
// messaging.v1.EncryptedContent), so a member who holds it can read the
// group's whole history.
//
// An envelope is bound to the chat's ID, which the creator learns only when
// Chat.StartChat returns. So the creator generates the chat key then, and
// stores its own envelope with Chat.SetKeyEnvelope as the second step of
// creating the group. Until that step lands the group has no key, and the
// server lets nothing happen in it (see
// StartChatRequest.PrivateGroupChatParameters): in particular, nobody is
// admitted to it.
//
// The creator's client keeps attempting that step until it succeeds. A
// creator whose Chat.GetKeyEnvelope returns NO_ENVELOPE, on any device,
// generates a chat key and stores its envelope. That is always safe: the
// creator's envelope is never deleted, so its absence means no other user
// was ever given a key. If two of the creator's devices do this at once,
// the first envelope stored stands (SetKeyEnvelopeResponse.ALREADY_SET) and
// the other device adopts it.
//
// An envelope is made by a wrapper for a recipient. The wrapper is either
// the recipient themself, or the group's creator admitting the recipient
// with Chat.AdmitLobbyMember. The server records who stored each envelope
// and returns it as GetKeyEnvelopeResponse.wrapped_by. Both are identified
// by the Ed25519 public keys they registered their accounts with. For scheme
// X25519_XCHACHA20POLY1305:
//
//  1. Convert keys to X25519, exactly as in step 1 of
//     messaging.v1.EncryptedContent: own Ed25519 private key to an X25519
//     private key, and the peer's Ed25519 public key to an X25519 public
//     key. The wrapper's peer is the recipient, and the recipient's peer is
//     the wrapper. When the wrapper is the recipient, the peer key is the
//     user's own public key. Reject a public key that is not a valid point,
//     or that converts to a low-order X25519 point.
//
//  2. Compute the shared secret: ss = X25519(own_x25519_priv, peer_x25519_pub).
//     Abort if ss is all zeros.
//
//  3. Derive the wrapping key with HKDF-SHA256 (RFC 5869):
//       salt = min(wrapper_pk, recipient_pk) || max(wrapper_pk, recipient_pk)
//       ikm  = ss
//       info = "flipcash-group-key-wrap-v1" || chat_id
//       L    = 32
//     wrapper_pk and recipient_pk are the 32-byte Ed25519 public keys,
//     ordered bytewise, and chat_id is the raw bytes of
//     common.v1.ChatId.value.
//
//  4. Encrypt with XChaCha20-Poly1305 (the IETF construction in libsodium's
//     crypto_aead_xchacha20poly1305_ietf_encrypt):
//       key       = the wrapping key from step 3
//       nonce     = 24 fresh random bytes, set in `nonce` below
//       plaintext = the 32-byte chat key
//       aad       = "flipcash-group-key-wrap-v1" || chat_id
//                   || wrapper_pk || recipient_pk
//     The ciphertext, with its 16-byte Poly1305 tag appended, is set in
//     `ciphertext` below.
//
// The recipient derives the same wrapping key and decrypts with the same
// aad. Only the wrapper and the recipient can derive that key, so an
// envelope that opens was made by one of them: neither the server nor
// another member can substitute a chat key of its choosing.
//
// That holds only as far as the recipient trusts the public key it uses for
// the wrapper. When wrapped_by is the recipient, that is the recipient's own
// key. Otherwise wrapped_by must be Metadata.creator, and the client uses
// the creator's public key, preferring one it learned outside this service
// (for example, from the invitation that led it to the chat) over one the
// server reports. A client rejects an envelope that names any other wrapper
// or that fails to open, and does not send in the chat.
//
// A member who opens an envelope wrapped by the creator wraps the chat key
// again for itself and stores that envelope with Chat.SetKeyEnvelope, so
// that opening it later, on any of the member's devices, depends on no one
// else's key.
//
// Like EncryptedContent, this has no forward secrecy: anyone who later
// obtains a member's private key can open that member's envelope and read
// the whole chat. A user who leaves the group still knows the chat key. The
// server stops serving them the group's messages, and nothing else keeps
// them out.
message KeyEnvelope {
    // The scheme used, which determines how every other field is
    // interpreted. Clients treat an unrecognized scheme as an envelope they
    // cannot open.
    Scheme scheme = 1 [(validate.rules).enum = {
        in: [1] // X25519_XCHACHA20POLY1305
    }];
    enum Scheme {
        UNKNOWN                  = 0;
        X25519_XCHACHA20POLY1305 = 1;
    }

    // The random XChaCha20-Poly1305 nonce, unique per envelope.
    bytes nonce = 2 [(validate.rules).bytes = {
        min_len: 24
        max_len: 24
    }];

    // The encrypted 32-byte chat key with the 16-byte Poly1305 tag appended.
    bytes ciphertext = 3 [(validate.rules).bytes = {
        min_len: 48
        max_len: 48
    }];
}

// LobbyMember is a user waiting in a private group's lobby for its creator
// to admit them (see Chat.EnterLobby). It is not a Member: the user is not
// on the chat's roster and cannot read the chat.
message LobbyMember {
    // The waiting user's public profile. user_id is always set.
    profile.v1.UserProfile user_profile = 1 [(validate.rules).message.required = true];

    // The Ed25519 public key the user registered their account with. It is
    // the key the creator wraps the chat key for when admitting them (see
    // KeyEnvelope).
    common.v1.PublicKey public_key = 2 [(validate.rules).message.required = true];

    // When the user entered the lobby.
    google.protobuf.Timestamp entered_at = 3 [(validate.rules).timestamp.required = true];
}

// Lobby is one private group whose lobby the requesting user is waiting in,
// as returned by Chat.EnterLobby.
message Lobby {
    // The chat, as a user who is not a member sees it: its record (title,
    // profile picture, roster summary, creator) with in_lobby set, and none of
    // its members or messaging state.
    Metadata chat = 1 [(validate.rules).message.required = true];

    // When the user entered the lobby.
    google.protobuf.Timestamp entered_at = 2 [(validate.rules).timestamp.required = true];
}

// LobbyUpdate is a best-effort, real-time change to a private group's lobby:
// a user entering it (Chat.EnterLobby) or leaving it. It is delivered only
// to the group's creator, who is the only user that can see the lobby.
//
// Like roster changes, these ride the event stream OUTSIDE the gap-detected
// event log. They carry no version and are applied as received; a client
// that suspects a miss refetches the lobby with Chat.GetLobbyMembers.
message LobbyUpdate {
    oneof kind {
        option (validate.required) = true;

        MemberEntered member_entered = 1;
        MemberLeft    member_left    = 2;
    }

    // A user entered the lobby and is waiting to be admitted.
    message MemberEntered {
        LobbyMember member = 1 [(validate.rules).message.required = true];
    }

    // A user is no longer in the lobby: they withdrew (Chat.LeaveLobby),
    // were denied (Chat.DenyLobbyMember) or were admitted
    // (Chat.AdmitLobbyMember). An admission also arrives as a
    // RosterUpdate.MemberJoined.
    message MemberLeft {
        // The user that left the lobby
        common.v1.UserId user_id = 1 [(validate.rules).message.required = true];
    }
}

message LobbyUpdateBatch {
    repeated LobbyUpdate lobby_updates = 1 [(validate.rules).repeated = {
        min_items: 1
        max_items: 100
    }];
}

syntax = "proto3";

package flipcash.chat.v1;

option go_package = "github.com/code-payments/flipcash2-protobuf-api/generated/go/chat/v1;chatpb";
option java_package = "com.codeinc.flipcash.gen.chat.v1";
option objc_class_prefix = "FPBChatV1";

import "blob/v1/model.proto";
import "chat/v1/model.proto";
import "common/v1/common.proto";
import "messaging/v1/model.proto";
import "moderation/v1/model.proto";
import "validate/validate.proto";

service Chat {
    // GetChat returns the metadata for a specific chat
    rpc GetChat(GetChatRequest) returns (GetChatResponse);

    // GetDmChatFeed gets the set of DM chats for an owner account using
    // a paged API, ordered by last activity with the most recent first.
    //
    // Chats are ordered by a mutable key (last_activity), so pagination alone
    // cannot guarantee a complete read: a chat can receive new activity and
    // move into a region the client has already paged past. To get the full
    // list, the client MUST combine this RPC with the event stream:
    //
    //   1. Open the event stream to receive ChatUpdate and begin buffering updates
    //      BEFORE the first GetDmChatFeed call. This ordering is the contract that
    //      closes the gap; subscribing after pagination starts can drop chats.
    //   2. Page through GetDmChatFeed to exhaustion (until has_more is false),
    //      always echoing back the paging token returned by the prior response.
    //      All pages are served against a single snapshot pinned by that token,
    //      so the set is read consistently.
    //   3. Merge the buffered and ongoing stream updates onto the paginated
    //      set. Any chat whose activity changed after the snapshot watermark
    //      is delivered via the stream rather than via pagination.
    //
    // Read together, pagination guarantees the set (every chat exactly once)
    // and the stream guarantees freshness and ordering. The local last_activity
    // sort is maintained by the client from the stream after the initial read.
    rpc GetDmChatFeed(GetDmChatFeedRequest) returns (GetDmChatFeedResponse);

    // GetGroupChatFeed gets the set of group chats for an owner account using
    // a paged API, ordered by last activity with the most recent first.
    //
    // It has the same read contract as GetDmChatFeed. Chats are ordered by a
    // mutable key (last_activity), so pagination alone cannot guarantee a
    // complete read. To get the full list, the client MUST combine this RPC
    // with the event stream:
    //
    //   1. Open the event stream to receive ChatUpdate and begin buffering
    //      updates BEFORE the first GetGroupChatFeed call.
    //   2. Page through GetGroupChatFeed to exhaustion (until has_more is
    //      false), always echoing back the paging token returned by the prior
    //      response. All pages are served against a single snapshot pinned by
    //      that token.
    //   3. Merge the buffered and ongoing stream updates onto the paginated
    //      set. Any chat whose activity changed after the snapshot watermark
    //      is delivered via the stream rather than via pagination.
    //
    // Unlike the DM feed, a group's membership can change while the feed is
    // being read. Every page is served only for groups the caller is still a
    // member of at the time of that page; a group the caller left between
    // pages is dropped, and its removal arrives on the stream.
    rpc GetGroupChatFeed(GetGroupChatFeedRequest) returns (GetGroupChatFeedResponse);

    // GetRoster pages a chat's roster, most recently joined first. Every
    // page carries the chat's RosterSummary, and every member carries the
    // roster version that placed them (see Member.version).
    //
    // A DM's roster is its participants, and a small group's is read whole:
    // for these a page is the roster at exactly roster_summary.version — a
    // roster that fits one page is member_count members, and a later page
    // is a fresh snapshot at its own summary. A large group's roster is
    // paged from an index that trails membership writes briefly, so a page
    // may lag roster_summary — a member
    // who just joined may be absent, one who just left may be present.
    // Clients do not see which case they are in and must follow the weaker
    // contract: treat roster_summary.version as the staleness watermark
    // described on RosterSummary, and merge each page against what the
    // event stream has told them per member by Member.version, the greater
    // winning. A cached member absent from a fully read roster is gone
    // unless the client holds their join at a version above the page's
    // roster_summary.version. A join during the walk lands ahead of the
    // cursor and arrives only as a RosterUpdate.
    //
    // Pointers are hydrated for a DM's participants only. A group's members
    // carry none: group pointer advances are never broadcast, so a page of
    // them would be stale as soon as it was served.
    //
    // Requires that the caller may read the chat: a member, or a non-member
    // a group's listener rules admit. A viewer who may only preview the chat
    // is DENIED.
    rpc GetRoster(GetRosterRequest) returns (GetRosterResponse);

    // StartChat starts a new chat.
    rpc StartChat(StartChatRequest) returns (StartChatResponse);

    // JoinChat adds the caller to a chat's roster.
    rpc JoinChat(JoinChatRequest) returns (JoinChatResponse);

    // LeaveChat removes the caller from a chat's roster.
    rpc LeaveChat(LeaveChatRequest) returns (LeaveChatResponse);

    // EditChat edits a group chat's record. Every editable field is optional;
    // only the ones set in the request are changed, and the edit is atomic:
    // if any part is refused, nothing is applied.
    //
    // Only a group chat may be edited, and only by a member the server permits
    // to edit it; anyone else is DENIED. A new title is moderated like
    // StartChat's. A new picture is a blob the caller has already uploaded via
    // BlobStorage: the client uploads only the ORIGINAL and passes the
    // resulting BlobId once the blob is READY, and the server derives the
    // remaining renditions. Setting a field to the value the chat already has
    // is a no-op for that field, and a request that sets nothing is a no-op
    // that returns OK.
    //
    // Every real change reaches the chat's members, including the caller's
    // other devices, on the event stream as one MetadataUpdate per field
    // changed: TitleChanged for the title, PictureChanged for the picture.
    rpc EditChat(EditChatRequest) returns (EditChatResponse);

    // MuteChat mutes a chat for the caller, until a time or indefinitely.
    //
    // Only a member may mute. Muting does not affect the event stream or
    // message delivery: pushes for a muted chat are still sent, flagged with
    // push.v1.ChatMetadata.muted, and the client suppresses the notification.
    // Calling it again with a different duration replaces the mute. An
    // identical request is a no-op. A mute is cleared when the caller leaves
    // the chat. Every real change reaches the caller's other devices as a
    // MetadataUpdate.ViewerStateChanged on the event stream.
    rpc MuteChat(MuteChatRequest) returns (MuteChatResponse);

    // UnmuteChat clears the caller's mute on a chat. Unmuting a chat that is
    // not muted is a no-op. Every real change reaches the caller's other devices
    // as a MetadataUpdate.ViewerStateChanged on the event stream.
    rpc UnmuteChat(UnmuteChatRequest) returns (UnmuteChatResponse);
}

message GetChatRequest {
    common.v1.ChatId chat_id = 1;

    // What the client intends to render of the chat's messaging state — its
    // last_message and latest_event_sequence — and so whether they may be
    // returned redacted (see messaging.v1.ViewMode). A group's record (title,
    // picture, rules, roster summary) is returned to every registered user
    // whatever the mode; the mode decides only the messaging state, which is
    // withheld from a viewer who may not read the chat under it. Unset (FULL)
    // is the pre-redaction contract: messaging state for a viewer who may
    // read the chat in full, the bare record for anyone else.
    messaging.v1.ViewMode view_mode = 2 [(validate.rules).enum = {
        in: [0, 1, 2] // FULL, FULL_OR_REDACTED, REDACTED
    }];

    common.v1.Auth auth = 10;
}

message GetChatResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1;
        NOT_FOUND = 2;
    }

    Metadata metadata = 2;
}

message GetDmChatFeedRequest {
    // QueryOptions controls page_size. Ordering is fixed to most-recent
    // activity first and is not client-selectable.
    //
    // Leave query_options.paging_token unset on the first request: the server
    // mints a token that pins a new snapshot and returns it in the response. On
    // every subsequent request, set query_options.paging_token to the
    // paging_token from the most recent response to advance within the same
    // snapshot. The token is opaque and server-generated; do not construct it.
    common.v1.QueryOptions query_options = 1;

    // The type of DM chat to filter for
    //
    // For backwards compatiblity, UNKNOWN maps to CONTACT_DM for legacy clients
    ChatType dm_chat_type = 2 [(validate.rules).enum = {
        in: [0, 1, 2] // UNKNOWN, CONTACT_DM, TIP_DM
    }];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message GetDmChatFeedResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1;
        NOT_FOUND = 2;
    }

    repeated Metadata chats = 2 [(validate.rules).repeated = {
        min_items: 0
        max_items: 100
    }];

    // PagingToken is the server-generated token for this paginated read. On the
    // first response it pins a new snapshot; on later responses it carries the
    // advanced cursor over (last_activity, chat_id). The client MUST send the
    // most recent value back in query_options.paging_token on the next
    // GetDmChatFeedRequest. Set when result is OK.
    common.v1.PagingToken paging_token = 3;

    // HasMore indicates whether further pages remain in this snapshot. When
    // false, the paginated set has been fully read; the complete chat list is
    // this set reconciled with the event stream (see GetDmChatFeed). When true, the
    // client should issue another GetDmChatFeedRequest with the returned
    // paging_token.
    bool has_more = 4;
}

message GetGroupChatFeedRequest {
    // QueryOptions controls page_size. Ordering is fixed to most-recent
    // activity first and is not client-selectable.
    //
    // Leave query_options.paging_token unset on the first request: the server
    // mints a token that pins a new snapshot and returns it in the response. On
    // every subsequent request, set query_options.paging_token to the
    // paging_token from the most recent response to advance within the same
    // snapshot. The token is opaque and server-generated; do not construct it.
    //
    // Group feed tokens are larger than DM feed tokens: the server carries
    // the snapshot's remaining order in the token so later pages do not
    // recompute it. Clients must treat the token as an opaque blob of up to
    // common.v1.PagingToken's maximum size.
    common.v1.QueryOptions query_options = 1;

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message GetGroupChatFeedResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1;
        NOT_FOUND = 2;
    }

    repeated Metadata chats = 2 [(validate.rules).repeated = {
        min_items: 0
        max_items: 100
    }];

    // PagingToken is the server-generated token for this paginated read. On the
    // first response it pins a new snapshot; on later responses it carries the
    // advanced cursor over (last_activity, chat_id). The client MUST send the
    // most recent value back in query_options.paging_token on the next
    // GetGroupChatFeedRequest. Set when result is OK.
    common.v1.PagingToken paging_token = 3;

    // HasMore indicates whether further pages remain in this snapshot. When
    // false, the paginated set has been fully read; the complete chat list is
    // this set reconciled with the event stream (see GetGroupChatFeed). When
    // true, the client should issue another GetGroupChatFeedRequest with the
    // returned paging_token.
    bool has_more = 4;
}

message GetRosterRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    // QueryOptions controls page_size, capped at 100. Ordering is fixed to
    // most recently joined first and is not client-selectable.
    //
    // Leave query_options.paging_token unset on the first request. On every
    // subsequent request, set it to the paging_token from the most recent
    // response. The token is opaque and server-generated; do not construct
    // it. It is bound to chat_id and refused with another chat.
    common.v1.QueryOptions query_options = 2;

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message GetRosterResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1;
        NOT_FOUND = 2;
    }

    // The page, most recently joined first, each with user_profile,
    // joined_at and version set, and pointers for a DM. Set when result is
    // OK.
    repeated Member members = 2 [(validate.rules).repeated = {
        min_items: 0
        max_items: 100
    }];

    // The chat's roster summary as of this page's read. Set when result is
    // OK. Applied by version as described on RosterSummary; see GetRoster
    // for how the page relates to it.
    RosterSummary roster_summary = 3;

    // PagingToken carries the cursor over (joined_at, user_id) after the last
    // member returned. The client MUST send it back in
    // query_options.paging_token on the next GetRosterRequest. Set when
    // result is OK and has_more is true.
    common.v1.PagingToken paging_token = 4;

    // HasMore indicates whether further pages remain. When false, the roster
    // has been fully read as of this page; the complete member list is this
    // set reconciled with the event stream (see GetRoster). When true, the
    // client should issue another GetRosterRequest with the returned
    // paging_token.
    bool has_more = 5;
}

message StartChatRequest {
    // Parameters for the kind of chat being created. The variant selects the
    // chat type.
    oneof parameters {
        option (validate.required) = true;

        GroupChatParameters group = 1;
    }

    // Parameters for creating a group chat
    message GroupChatParameters {
        // Title for the chat.
        string title = 1 [(validate.rules).string = {
            min_len: 1
            max_len: 64
        }];

        // The blob holding the ORIGINAL picture the caller uploaded. Optional.
        // If set, it must be owned by the caller and READY.
        blob.v1.BlobId picture = 2;

        // Rules governing participation in the chat. Optional; if not set, the
        // chat has no participation requirements. Caller must satisfy the rules
        // in order for the chat to be started.
        Rules rules = 3;
    }

    // Key for retrying this request safely. A retry with the same key from the
    // same caller returns the chat the first attempt created, with result OK,
    // even if the parameters differ.
    IdempotencyKey idempotency_key = 9 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message StartChatResponse {
    Result result = 1;
    enum Result {
        OK                        = 0;
        DENIED                    = 1;
        TITLE_MODERATED           = 2;
        PICTURE_BLOB_NOT_ACCEPTED = 3;
        INVALID_RULES             = 4;
        RULES_NOT_SATISFIED       = 5;
    }

    // The metadata for the newly created chat, including the server-generated
    // chat_id and any picture renditions the server derived. Set only when
    // result == OK.
    Metadata chat = 2;

    // The best-fit category that tripped moderation, mirroring the Moderation
    // service's vocabulary. Set only when result == TITLE_MODERATED; NONE
    // otherwise.
    moderation.v1.FlaggedCategory flagged_category = 3;
}

message JoinChatRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message JoinChatResponse {
    Result result = 1;
    enum Result {
        OK                  = 0;
        DENIED              = 1;
        NOT_FOUND           = 2;
        RULES_NOT_SATISFIED = 3;
    }

    // The metadata for the joined chat, as seen by the caller. Set only when
    // result == OK.
    Metadata chat = 2;
}

message LeaveChatRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message LeaveChatResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1;
        NOT_FOUND = 2;
    }
}

message EditChatRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    // The new title. Left unchanged when unset.
    Title title = 2;

    // The new picture. Left unchanged when unset.
    Picture picture = 3;

    message Title {
        string value = 1 [(validate.rules).string = {
            min_len: 1
            max_len: 64
        }];
    }

    message Picture {
        // The blob holding the ORIGINAL picture the caller uploaded. It must be
        // owned by the caller and READY; the server derives the remaining
        // renditions from it.
        blob.v1.BlobId blob_id = 1 [(validate.rules).message.required = true];
    }

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message EditChatResponse {
    Result result = 1;
    enum Result {
        OK                        = 0;
        DENIED                    = 1;
        NOT_FOUND                 = 2;
        TITLE_MODERATED           = 3;
        PICTURE_BLOB_NOT_ACCEPTED = 4;
    }

    // The metadata for the chat after the edit, as seen by the caller,
    // including any picture renditions the server derived. Set only when
    // result == OK.
    Metadata chat = 2;

    // The best-fit category that tripped moderation, mirroring the Moderation
    // service's vocabulary. Set only when result == TITLE_MODERATED; NONE
    // otherwise.
    moderation.v1.FlaggedCategory flagged_category = 3;
}

message MuteChatRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    // How long to mute for. A timed mute must end in the future; the server
    // rejects one that does not.
    MuteState mute = 2 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message MuteChatResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1; // Caller is not a member
        NOT_FOUND = 2;
    }

    // The caller's state for the chat after the write, so the client can
    // apply it at its version. Set only when result == OK.
    ViewerState viewer_state = 2;
}

message UnmuteChatRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message UnmuteChatResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1;
        NOT_FOUND = 2;
    }

    // As for MuteChatResponse.viewer_state.
    ViewerState viewer_state = 2;
}

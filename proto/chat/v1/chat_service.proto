syntax = "proto3";

package flipcash.chat.v1;

option go_package = "github.com/code-payments/flipcash2-protobuf-api/generated/go/chat/v1;chatpb";
option java_package = "com.codeinc.flipcash.gen.chat.v1";
option objc_class_prefix = "FPBChatV1";

import "blob/v1/model.proto";
import "chat/v1/model.proto";
import "common/v1/common.proto";
import "messaging/v1/model.proto";
import "moderation/v1/model.proto";
import "validate/validate.proto";
import "google/protobuf/timestamp.proto";

service Chat {
    // GetChat returns the metadata for a specific chat
    //
    // Auth is optional. An unauthenticated caller gets the chat's public view:
    // the same group record a registered non-member previewing it receives,
    // with view_mode REDACTED and none of the per-viewer fields (is_hidden,
    // viewer_state). An unauthenticated read under any other view_mode, or of
    // a DM, is DENIED.
    //
    // A private group (see Metadata.is_private) returns its record to any
    // registered user, so that one who is not a member can see what they are
    // asking to join, but its messaging state only to a member, whatever the
    // view_mode. Its public view is that record alone, with no messaging
    // state. A private group whose creator has not stored its key yet (see
    // StartChatRequest.PrivateGroupChatParameters) is returned like any
    // other: it is visible, though nothing can happen in it.
    rpc GetChat(GetChatRequest) returns (GetChatResponse);

    // GetDmChatFeed gets the set of DM chats for an owner account using
    // a paged API, ordered by last activity with the most recent first.
    //
    // Chats are ordered by a mutable key (last_activity), so pagination alone
    // cannot guarantee a complete read: a chat can receive new activity and
    // move into a region the client has already paged past. To get the full
    // list, the client MUST combine this RPC with the event stream:
    //
    //   1. Open the event stream to receive ChatUpdate and begin buffering updates
    //      BEFORE the first GetDmChatFeed call. This ordering is the contract that
    //      closes the gap; subscribing after pagination starts can drop chats.
    //   2. Page through GetDmChatFeed to exhaustion (until has_more is false),
    //      always echoing back the paging token returned by the prior response.
    //      All pages are served against a single snapshot pinned by that token,
    //      so the set is read consistently.
    //   3. Merge the buffered and ongoing stream updates onto the paginated
    //      set. Any chat whose activity changed after the snapshot watermark
    //      is delivered via the stream rather than via pagination.
    //
    // Read together, pagination guarantees the set (every chat exactly once)
    // and the stream guarantees freshness and ordering. The local last_activity
    // sort is maintained by the client from the stream after the initial read.
    rpc GetDmChatFeed(GetDmChatFeedRequest) returns (GetDmChatFeedResponse);

    // GetGroupChatFeed gets the set of group chats for an owner account using
    // a paged API, ordered by last activity with the most recent first.
    //
    // It has the same read contract as GetDmChatFeed. Chats are ordered by a
    // mutable key (last_activity), so pagination alone cannot guarantee a
    // complete read. To get the full list, the client MUST combine this RPC
    // with the event stream:
    //
    //   1. Open the event stream to receive ChatUpdate and begin buffering
    //      updates BEFORE the first GetGroupChatFeed call.
    //   2. Page through GetGroupChatFeed to exhaustion (until has_more is
    //      false), always echoing back the paging token returned by the prior
    //      response. All pages are served against a single snapshot pinned by
    //      that token.
    //   3. Merge the buffered and ongoing stream updates onto the paginated
    //      set. Any chat whose activity changed after the snapshot watermark
    //      is delivered via the stream rather than via pagination.
    //
    // Unlike the DM feed, a group's membership can change while the feed is
    // being read. Every page is served only for groups the caller is still a
    // member of at the time of that page; a group the caller left between
    // pages is dropped, and its removal arrives on the stream.
    //
    // The feed is meant for list views, so a chat's cover_picture may be
    // omitted from it (see Metadata). Fetch it with GetChat when the client
    // shows the chat's profile view.
    rpc GetGroupChatFeed(GetGroupChatFeedRequest) returns (GetGroupChatFeedResponse);

    // GetRoster pages a chat's roster, most recently joined first. Every
    // page carries the chat's RosterSummary, and every member carries the
    // roster version that placed them (see Member.version).
    //
    // A DM's roster is its participants, and a small group's is read whole:
    // for these a page is the roster at exactly roster_summary.version — a
    // roster that fits one page is member_count members, and a later page
    // is a fresh snapshot at its own summary. A large group's roster is
    // paged from an index that trails membership writes briefly, so a page
    // may lag roster_summary — a member
    // who just joined may be absent, one who just left may be present.
    // Clients do not see which case they are in and must follow the weaker
    // contract: treat roster_summary.version as the staleness watermark
    // described on RosterSummary, and merge each page against what the
    // event stream has told them per member by Member.version, the greater
    // winning. A cached member absent from a fully read roster is gone
    // unless the client holds their join at a version above the page's
    // roster_summary.version. A join during the walk lands ahead of the
    // cursor and arrives only as a RosterUpdate.
    //
    // Pointers are hydrated for a DM's participants only. A group's members
    // carry none: group pointer advances are never broadcast, so a page of
    // them would be stale as soon as it was served.
    //
    // Requires that the caller is a member of the chat, or holds a link to an
    // invite to it (see Invite) and sends the invite's token in
    // invite_token. Anyone else is DENIED, including a non-member whom a
    // group's listener rules admit to read its messages: who is in a chat is
    // shown only to its members and to those holding a link that would let
    // them join it.
    //
    // The token is the credential, so auth is optional when it is sent (when
    // set, auth must be valid). It is honored while its invite is ACTIVE and
    // to chat_id; any other token is DENIED, as is a token sent for a public
    // group or a DM. Whoever sends an honored token gets the page a member
    // gets, registered or not, and a user the chat's creator banned
    // included: a ban stops a user joining, not reading the roster through a
    // link they hold, which the creator stops by revoking the invite.
    // Reading the roster with a token counts no use of the invite, changes
    // nothing, and is announced to no one. The invite is checked again on
    // every page, so a walk ends with DENIED once it stops being ACTIVE.
    //
    // A member is served whether or not they send a token, which is not
    // checked for them. A request with neither auth nor invite_token is
    // DENIED.
    rpc GetRoster(GetRosterRequest) returns (GetRosterResponse);

    // SampleChatters returns a short sample of a public group's members to
    // show: its creator first, while they are a member, then the members who
    // have sent a message most recently, most recent first. Members who have
    // not sent a message recently are not in it. The caller is included like
    // any other member, and so are users the caller has blocked: the sample
    // shows who is in the chat, not who may be mentioned (see
    // GetMentionSuggestions).
    //
    // Unlike the roster (see GetRoster), the sample is public: it is part of
    // how a group presents itself, as its title and pictures are, and is
    // returned to anyone who asks, member or not, registered or not. Auth is
    // optional; when set it must be valid, but it changes nothing about what
    // is returned.
    //
    // Everyone in the sample is a member of the group as of the read, which
    // may trail a join or departure by a moment: it is a subset of the roster
    // GetRoster pages, never someone who never joined, though someone who
    // left a moment ago may still be in it. It is not the whole roster: it is neither complete nor
    // paged and carries no roster version, and has_more is the only
    // indication of what lies past it. The server decides how many to
    // return, up to 100; neither the size nor the order after the creator is
    // part of the contract.
    //
    // It is a snapshot, which a client may show as it is. A client that wants
    // it live, and streams the group's events (as a member, or through a chat
    // preview), may instead keep it fresh between fetches by moving the
    // sender of each new message to the front, adding them if absent, since
    // anyone who sends is a member. Departures are not announced to the other
    // members (see RosterUpdate.MembershipChanged), so a member who has left
    // may remain in a client's copy until it fetches again.
    //
    // Only for public groups: a private group (see Metadata.is_private) and a
    // DM are DENIED, whoever asks.
    rpc SampleChatters(SampleChattersRequest) returns (SampleChattersResponse);

    // GetMentionSuggestions returns people the caller may want to @mention in
    // a group chat, ranked by the server, most relevant first. Today that is
    // the group's most recent senders, most recent first, including people
    // who have since left the group.
    //
    // The response is a ranked pool of suggestions, not the set of people who
    // may be mentioned, and it is neither complete nor paged. The server
    // decides how many to return, up to 200; the client filters the whole
    // pool locally as the user types, however few rows it displays, and keeps
    // it fresh from the event stream by moving the sender of each new message
    // to the front. It fetches the pool once per composing session. The
    // ranking and the pool's size may change without notice; clients must
    // not depend on either beyond the order given.
    //
    // The caller, users the caller has blocked, and users without a username
    // are never suggested. A user who has blocked the caller may still be.
    //
    // Requires that the caller may speak in the chat. A DM is DENIED.
    rpc GetMentionSuggestions(GetMentionSuggestionsRequest) returns (GetMentionSuggestionsResponse);

    // StartChat starts a new chat.
    rpc StartChat(StartChatRequest) returns (StartChatResponse);

    // JoinChat adds the caller to a chat's roster.
    //
    // A private group (see Metadata.is_private) is joined this way only with
    // an invite (JoinChatRequest.invite) or by its creator. Anyone else is
    // DENIED, and enters its lobby with EnterLobby to be admitted by the
    // creator. The creator needs neither approval nor an invite, and rejoins
    // a private group they left with this RPC; an invite they pass is
    // ignored.
    //
    // Joining with an invite (see Invite) needs no one's approval. The client
    // previews the invite with GetInvite, which names the chat, and passes
    // the invite's token here. The invite must be ACTIVE (INVITE_EXHAUSTED,
    // INVITE_EXPIRED or INVITE_REVOKED otherwise), for a user who joined
    // with it before as for anyone.
    //
    // The join is atomic: the caller becomes a member, the join is counted as
    // one use of the invite (a user who left and joins again with it uses
    // another), and the invite's copy of the chat key is stored as their key
    // envelope, with the link's secret encrypted by the caller for themself
    // (JoinChatRequest.InviteParameters.secret_envelope), together, or
    // nothing happens. A caller waiting in the chat's
    // lobby leaves it in the same step. A caller who is already a member gets
    // OK with nothing changed: the invite is not checked, no use is counted,
    // and their stored envelope stays as it is. Only a public group's rules
    // or a private group's invite are checked, never both: an invite to a
    // public group is INVITE_NOT_FOUND.
    //
    // Any of the joiner's devices then fetches the copy and the secret with
    // GetKeyEnvelope (GetKeyEnvelopeResponse.invite_key_bundle), checks
    // the copy's signature, opens the secret with the joiner's account key
    // and the copy with the secret, wraps the chat key for the joiner and
    // stores that envelope with SetKeyEnvelope (see KeyEnvelope). None of
    // this needs the device the joiner joined with, or the link itself. A
    // join with an invite is announced like an admission (see
    // AdmitLobbyMember). A member whose copy turns out to hold the wrong key
    // cannot fix it by joining again: they leave and are admitted from the
    // lobby (see KeyEnvelope).
    rpc JoinChat(JoinChatRequest) returns (JoinChatResponse);

    // LeaveChat removes the caller from a chat's roster.
    //
    // Leaving a private group discards the caller's key envelope (see
    // KeyEnvelope), so returning means being admitted from the lobby or
    // joining with an invite again. The creator's envelope is kept, since no
    // one else could give them another.
    rpc LeaveChat(LeaveChatRequest) returns (LeaveChatResponse);

    // EditChat edits a group chat's record. Every editable field is optional;
    // only the ones set in the request are changed, and the edit is atomic:
    // if any part is refused, nothing is applied.
    //
    // Only a group chat may be edited, and only by a member the server permits
    // to edit it, as reported by ViewerState.Permissions.can_edit; anyone else
    // is DENIED. A new title or description is moderated like StartChat's. A
    // new profile picture or cover picture is a blob the caller has already
    // uploaded via BlobStorage: the client uploads only the ORIGINAL and
    // passes the resulting BlobId once the blob is READY, and the server
    // derives the remaining renditions. Setting a field to the value the chat
    // already has is a no-op for that field, and a request that sets nothing
    // is a no-op that returns OK.
    //
    // Every real change reaches the chat's members, including the caller's
    // other devices, on the event stream as one MetadataUpdate per field
    // changed: TitleChanged for the title, ProfilePictureChanged for the
    // profile picture, DescriptionChanged for the description,
    // CoverPictureChanged for the cover picture.
    rpc EditChat(EditChatRequest) returns (EditChatResponse);

    // MuteChat mutes a chat for the caller, until a time or indefinitely.
    //
    // Only a member may mute. Muting does not affect the event stream or
    // message delivery: pushes for a muted chat are still sent, flagged with
    // push.v1.ChatMetadata.muted, and the client suppresses the notification.
    // Calling it again with a different duration replaces the mute. An
    // identical request is a no-op. A mute is cleared when the caller leaves
    // the chat. Every real change reaches the caller's other devices as a
    // MetadataUpdate.ViewerStateChanged on the event stream.
    rpc MuteChat(MuteChatRequest) returns (MuteChatResponse);

    // UnmuteChat clears the caller's mute on a chat. Unmuting a chat that is
    // not muted is a no-op. Every real change reaches the caller's other devices
    // as a MetadataUpdate.ViewerStateChanged on the event stream.
    rpc UnmuteChat(UnmuteChatRequest) returns (UnmuteChatResponse);

    // EnterLobby places the caller in a private group's lobby, where they
    // wait for the group's creator to admit them. It is how a user asks to
    // join a private group (see Metadata.is_private) when they hold no
    // invite; JoinChat without one is DENIED for a private group.
    //
    // Entering a lobby the caller is already in is a no-op that returns OK.
    // The server caps both how many users may wait in one lobby and how many
    // lobbies one user may wait in. A group whose creator has not stored its
    // key yet (see StartChatRequest.PrivateGroupChatParameters) has no lobby
    // to enter, and is DENIED until they have.
    //
    // A lobby is visible only to the group's creator, through
    // GetLobbyMembers: the users waiting in it are not shown to each other or
    // to the group's members. The creator's devices learn of the entry as a
    // LobbyUpdate on the event stream.
    //
    // While the caller waits, the chat's Metadata carries in_lobby. The
    // caller leaves the lobby when they withdraw (LeaveLobby), when the
    // creator denies them (DenyLobbyMember), when the creator admits them
    // (AdmitLobbyMember), or when they join with an invite (JoinChat). An
    // admission reaches the caller's devices as a RosterUpdate.MemberJoined
    // naming them; a denial is not announced to them.
    //
    // There is no RPC that lists the lobbies a caller is waiting in. A client
    // keeps the chats it entered itself, and reads in_lobby from GetChat to
    // learn whether it is still waiting in one. A paged listing may be added
    // later.
    rpc EnterLobby(EnterLobbyRequest) returns (EnterLobbyResponse);

    // LeaveLobby withdraws the caller from a private group's lobby. Leaving a
    // lobby the caller is not in is a no-op that returns OK.
    rpc LeaveLobby(LeaveLobbyRequest) returns (LeaveLobbyResponse);

    // GetLobbyMembers pages the users waiting in a private group's lobby,
    // earliest entered first.
    //
    // Only the group's creator may call it, and only while a member of the
    // group; anyone else is DENIED. The page is read from an index that
    // trails writes briefly, so a user who just entered may be absent and one
    // who just left may be present.
    rpc GetLobbyMembers(GetLobbyMembersRequest) returns (GetLobbyMembersResponse);

    // AdmitLobbyMember admits a user waiting in a private group's lobby:
    // it stores the chat key wrapped for them (see KeyEnvelope) and adds them
    // to the chat's roster. The envelope is stored first, so an admitted
    // member always has one.
    //
    // Only the group's creator may call it, and only while a member of the
    // group; anyone else is DENIED. So is a creator who has not stored their
    // own key envelope yet (see StartChatRequest.PrivateGroupChatParameters):
    // nobody is admitted to a group before its creator holds its key. Besides
    // joining with an invite, which stores the invite's copy of the chat key
    // for the joiner (see JoinChat), this is the only way to give another
    // user a key envelope. Admitting a user who is already a member is a
    // no-op that returns OK and leaves their stored envelope as it is.
    //
    // The admission is announced like any other join: a
    // RosterUpdate.MemberJoined to the chat's members and to the admitted
    // user, who then fetches their envelope with GetKeyEnvelope.
    rpc AdmitLobbyMember(AdmitLobbyMemberRequest) returns (AdmitLobbyMemberResponse);

    // DenyLobbyMember removes a user from a private group's lobby without
    // admitting them. Only the group's creator may call it, and only while a
    // member of the group; anyone else is DENIED. Denying a user who is not
    // in the lobby is a no-op that returns OK.
    //
    // The denied user is not notified. The chat's Metadata stops carrying
    // in_lobby for them, and they may enter the lobby again.
    rpc DenyLobbyMember(DenyLobbyMemberRequest) returns (DenyLobbyMemberResponse);

    // SetKeyEnvelope stores the caller's own key envelope for a private
    // group. Only a member may call it, and only for themself: an envelope
    // for another user is stored by admitting them (AdmitLobbyMember).
    //
    // It is called in three situations (see KeyEnvelope):
    //  - By the group's creator, right after StartChat returns the chat's
    //    ID, to store the chat key they have just generated. This is the
    //    second step of creating a private group, and nothing can happen in
    //    the group until it succeeds (see
    //    StartChatRequest.PrivateGroupChatParameters). The creator's client
    //    keeps attempting it until it returns OK or ALREADY_SET: on a failed
    //    call, on its next launch, and on any device that finds the group
    //    with NO_ENVELOPE.
    //  - By an admitted member, after first opening the envelope the creator
    //    wrapped for them, to replace it with one wrapped by themself.
    //  - By a member who joined with an invite, after first opening the
    //    invite's copy of the chat key with the link's secret (from the
    //    secret envelope stored with it, or from the link), to replace it
    //    with one wrapped by themself. Storing it deletes the copy and that
    //    secret envelope (see InviteKeyEnvelope).
    //
    // The first envelope a caller stores for themself stands. Once the
    // stored envelope is one the caller wrapped, a call with a different
    // envelope changes nothing and returns ALREADY_SET, and the caller uses
    // the stored one from GetKeyEnvelope. This keeps two of a creator's
    // devices, each setting up the same new group, from holding different
    // keys. Storing an envelope identical to the one stored is a no-op that
    // returns OK.
    //
    // Nothing is published: the caller's other devices fetch the envelope
    // when they need it.
    rpc SetKeyEnvelope(SetKeyEnvelopeRequest) returns (SetKeyEnvelopeResponse);

    // GetKeyEnvelope returns the caller's own key envelope for a private
    // group. Only a member may call it. The chat key never changes, so a
    // client calls this once per chat per install and keeps the key it
    // unwraps.
    //
    // For a member who joined with an invite and has not yet stored their
    // own envelope, what is stored is the invite's copy of the chat key and
    // the link's secret the member encrypted for themself when joining. Both
    // are returned in invite_key_bundle in place of key_envelope. Any of
    // the member's devices opens the secret with the member's account key,
    // then the copy with the secret, and replaces the copy with an envelope
    // of its own with SetKeyEnvelope (see InviteKeyEnvelope).
    //
    // NO_ENVELOPE is expected only for the creator of a group whose creation
    // stopped between StartChat and SetKeyEnvelope. A creator's client that
    // receives it generates a chat key and stores its envelope with
    // SetKeyEnvelope, as described on KeyEnvelope, and keeps attempting that
    // until it succeeds.
    rpc GetKeyEnvelope(GetKeyEnvelopeRequest) returns (GetKeyEnvelopeResponse);

    // CreateInvite creates an invite to a private group (see Invite): a link
    // that lets users join it with JoinChat without the creator's approval.
    //
    // Only a member the server permits to invite may call it, as reported by
    // ViewerState.Permissions.can_invite; anyone else is DENIED. So is any
    // call for a group whose creator has not stored its key yet (see
    // StartChatRequest.PrivateGroupChatParameters).
    //
    // The caller's client generates the link's secret and derives the
    // invite's token, ID and wrap key from it (see Invite). It sends the
    // token, the chat key encrypted under the wrap key and signed by the
    // caller (InviteKeyEnvelope), and the secret encrypted for itself
    // (InviteSecretEnvelope); the secret and the wrap key never leave it. The
    // server computes the invite's ID from the token, which it never stores
    // (see InviteToken), and checks the copy's signature against the
    // caller's public key with that ID, refusing one that does not verify
    // (INVALID_SIGNATURE), since no joiner could accept it. So a client that
    // derived the ID wrongly is refused here, rather than sharing a link that
    // admits no one. The server cannot check what either envelope holds: a
    // copy that does not hold the chat key gives everyone who joins with the
    // invite a key that reads nothing.
    //
    // An existing invite with the ID computed from the request's token is
    // looked up before anything else is checked. A retry with the same token,
    // by the same caller for the same chat, returns the invite the first
    // attempt created, with result OK, even if the other parameters differ
    // and whatever its status now: it may since have been used up, expired
    // or been revoked, so the client checks Invite.status before sharing the
    // link. An ID already held by an invite to another chat, or by another
    // user's, is DENIED.
    //
    // Otherwise, the server caps how many ACTIVE invites a chat may hold
    // (TOO_MANY_INVITES) and how far away expires_at may be
    // (INVALID_EXPIRES_AT).
    //
    // Nothing is published.
    rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse);

    // GetInvite previews an invite from its link (see Invite): the chat it
    // admits users to, whose chat_id the caller passes to JoinChat and
    // derives the invite's wrap key with, and whether the invite still admits
    // anyone. Anyone holding the link may call it, registered or not: the
    // token is the credential, and auth is optional (when set, it must be
    // valid). It counts no use, returns no key, and changes nothing.
    //
    // An authenticated caller gets the chat as they see it with GetChat: a
    // non-member gets its record, with in_lobby set while they wait in its
    // lobby. A user banned from the chat gets only BANNED. An
    // unauthenticated caller gets the chat's public view (see GetChat),
    // which for a private group is its record alone, and is never BANNED,
    // since the server does not know who they are. Use counts are shown only
    // to those who may invite (GetChatInvites).
    rpc GetInvite(GetInviteRequest) returns (GetInviteResponse);

    // GetChatInvites pages a private group's invites, most recently created
    // first, whatever their status, each with its use count and its
    // creator's copy of the link's secret (see InviteSecretEnvelope).
    //
    // Only a member the server permits to invite may call it, as reported by
    // ViewerState.Permissions.can_invite; anyone else is DENIED.
    rpc GetChatInvites(GetChatInvitesRequest) returns (GetChatInvitesResponse);

    // RevokeInvite stops an invite admitting anyone and, in the same step,
    // deletes the server's copy of the chat key held for it (see
    // InviteKeyEnvelope). Users it already admitted stay members and keep
    // the chat key: an invite never changes it, and the copies stored for
    // those who have not yet replaced theirs are kept, since those are their
    // only key. So revoking a link that leaked keeps new users out, but
    // takes the key from no one who already opened it, nor from anyone
    // holding the link who can read those copies (see Invite). A link that
    // leaked is replaced by revoking it and creating another.
    //
    // Gated like GetChatInvites. Revoking an invite already revoked is a
    // no-op that returns OK; revoking one that has expired or been used up
    // records it as revoked. Nothing is published.
    rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse);

    // SetFeaturedGroups replaces the caller's featured groups: an ordered
    // list of public group chats they show on their profile, which anyone can
    // fetch with GetFeaturedGroups. The list is written whole, so the request
    // carries every group the caller wants featured, in the order to show
    // them, and an empty list clears it. Setting the list already stored is a
    // no-op that returns OK.
    //
    // Featuring a group says nothing about the caller's place in it: a group
    // may be featured whether or not the caller is a member, and leaving a
    // group does not remove it from the list.
    //
    // Only public groups may be featured: when a group in the request is
    // private (see Metadata.is_private), nothing is written and the result
    // is DENIED. A group never becomes private after it is created, so a
    // featured group stays public. Every group must exist: when one does not,
    // nothing is written and the result is NOT_FOUND. A DM's ID, or a group
    // named more than once, is an invalid argument.
    //
    // Nothing is published: the caller's other devices see the change on
    // their next GetFeaturedGroups.
    rpc SetFeaturedGroups(SetFeaturedGroupsRequest) returns (SetFeaturedGroupsResponse);

    // GetFeaturedGroups returns a user's featured groups (see
    // SetFeaturedGroups), in the order the user set them.
    //
    // Each group is a public group (see SetFeaturedGroups), returned as its
    // record as a list view shows it: chat_id, type, title, description,
    // profile_picture, roster_summary, rules, creator and last_activity. Nothing about the viewer's place in the
    // group is set (members, is_hidden, viewer_state, in_lobby), nor its
    // messaging state (last_message, latest_event_sequence), nor its
    // cover_picture: a client opening a group fetches the rest with GetChat.
    //
    // The list is public, like the user's profile, and the same for every
    // viewer. Auth is optional; when set it must be valid, but it changes
    // nothing about what is returned. A group that no longer exists is left
    // out.
    //
    // The user is identified by username, the handle a profile is opened by,
    // so a client can fetch a profile (see profile.v1.Profile.GetProfile) and
    // its featured groups at once.
    rpc GetFeaturedGroups(GetFeaturedGroupsRequest) returns (GetFeaturedGroupsResponse);

    // SilenceUser silences a user in a group chat, until a time or
    // indefinitely: they may still read the chat, react and vote, but not
    // send, edit, show typing, or do anything else that requires speaking
    // in it (see ViewerState.Restrictions.silence). They may still delete
    // their own messages.
    //
    // Public and private groups alike. Only a member the server permits to
    // silence users in the chat may call it, as reported by
    // ViewerState.Permissions.moderation.can_silence; anyone else, and any
    // DM, is DENIED. The chat's creator cannot be silenced.
    //
    // The user need not be a member: a silence survives leaving and
    // rejoining, and may be set before the user ever joins. Calling it again
    // with a different duration replaces the silence; an identical request
    // is a no-op that returns OK. A timed silence must end in the future;
    // the server rejects one that does not.
    //
    // A real change reaches the silenced user's devices, while they are a
    // member, as a MetadataUpdate.ViewerStateChanged on the event stream.
    // Nobody else is told.
    rpc SilenceUser(SilenceUserRequest) returns (SilenceUserResponse);

    // UnsilenceUser clears a user's silence in a group chat. Gated as
    // SilenceUser. Unsilencing a user who is not silenced is a no-op that
    // returns OK. A real change reaches the user's devices as SilenceUser's
    // does.
    rpc UnsilenceUser(UnsilenceUserRequest) returns (UnsilenceUserResponse);

    // BanUser bans a user from a group chat: a member is removed from its
    // roster, a user waiting in a private group's lobby is removed from it,
    // and the user cannot join, enter the lobby or be admitted until they
    // are unbanned. A banned user may not read the chat as a non-member
    // either (see the listener rules), though anyone may still see its
    // redacted public view. Only a member the server permits to ban users
    // in the chat may call it, as reported by
    // ViewerState.Permissions.moderation.can_ban; anyone else, and any DM,
    // is DENIED. The chat's creator cannot be banned.
    //
    // The user need not be a member, so a creator can ban someone before
    // they join. Banning a user who is already banned is a no-op that
    // returns OK. A ban leaves a silence as it is, and the user's messages
    // stay in the chat.
    //
    // Removing a member is announced exactly like a departure: a
    // RosterUpdate.MemberLeft to the banned user's devices, which does not
    // say why, and the roster change to the chat's other members. A banned
    // member of a private group loses their key envelope (see KeyEnvelope),
    // as when leaving. They cannot fetch anything from the chat afterwards,
    // but the server cannot take back the chat key they already opened:
    // ciphertext of later messages that reached them some other way is
    // readable to them, since the key is not rotated.
    //
    // A ban applies to the account, not to an invite link (see Invite). A
    // banned user who still holds a link that admits users can join with it
    // from another account, so banning someone who joined with an invite
    // calls for revoking that invite too (RevokeInvite).
    rpc BanUser(BanUserRequest) returns (BanUserResponse);

    // UnbanUser lifts a user's ban from a group chat. Gated as BanUser.
    // It does not return them to the chat: they join (or enter a private
    // group's lobby) again like anyone else. Unbanning a user who is not
    // banned is a no-op that returns OK. Nothing is published.
    rpc UnbanUser(UnbanUserRequest) returns (UnbanUserResponse);

    // GetRestrictedUsers pages the users silenced or banned in a group chat,
    // most recently restricted first, by the time of the latest silence or
    // ban set on them. A silence that has lapsed is left out. Only a member
    // the server permits to silence or to ban users in the chat may call it
    // (see ViewerState.Permissions.moderation); anyone else, and any DM, is
    // DENIED. The page is read from an index that trails writes
    // briefly, so a user just restricted may be absent and one just
    // released may be present.
    rpc GetRestrictedUsers(GetRestrictedUsersRequest) returns (GetRestrictedUsersResponse);
}

message GetChatRequest {
    common.v1.ChatId chat_id = 1;

    // What the client intends to render of the chat's messaging state — its
    // last_message and latest_event_sequence — and so whether they may be
    // returned redacted (see messaging.v1.ViewMode). A group's record (title,
    // description, profile picture, cover picture, rules, roster summary) is
    // returned to every registered user whatever the mode; the mode decides
    // only the messaging state, which is withheld from a viewer who may not
    // read the chat under it. Unset (FULL) is the pre-redaction contract:
    // messaging state for a viewer who may read the chat in full, the bare
    // record for anyone else.
    //
    // Must be REDACTED when auth is unset; any other mode is DENIED.
    messaging.v1.ViewMode view_mode = 2 [(validate.rules).enum = {
        in: [0, 1, 2] // FULL, FULL_OR_REDACTED, REDACTED
    }];

    // Optional. Unset requests the chat's public view (see Chat.GetChat),
    // which requires view_mode REDACTED.
    common.v1.Auth auth = 10;
}

message GetChatResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1;
        NOT_FOUND = 2;
    }

    Metadata metadata = 2;
}

message GetDmChatFeedRequest {
    // QueryOptions controls page_size. Ordering is fixed to most-recent
    // activity first and is not client-selectable.
    //
    // Leave query_options.paging_token unset on the first request: the server
    // mints a token that pins a new snapshot and returns it in the response. On
    // every subsequent request, set query_options.paging_token to the
    // paging_token from the most recent response to advance within the same
    // snapshot. The token is opaque and server-generated; do not construct it.
    common.v1.QueryOptions query_options = 1;

    // The type of DM chat to filter for
    //
    // For backwards compatiblity, UNKNOWN maps to CONTACT_DM for legacy clients
    ChatType dm_chat_type = 2 [(validate.rules).enum = {
        in: [0, 1, 2] // UNKNOWN, CONTACT_DM, DM
    }];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message GetDmChatFeedResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1;
        NOT_FOUND = 2;
    }

    repeated Metadata chats = 2 [(validate.rules).repeated = {
        min_items: 0
        max_items: 100
    }];

    // PagingToken is the server-generated token for this paginated read. On the
    // first response it pins a new snapshot; on later responses it carries the
    // advanced cursor over (last_activity, chat_id). The client MUST send the
    // most recent value back in query_options.paging_token on the next
    // GetDmChatFeedRequest. Set when result is OK.
    common.v1.PagingToken paging_token = 3;

    // HasMore indicates whether further pages remain in this snapshot. When
    // false, the paginated set has been fully read; the complete chat list is
    // this set reconciled with the event stream (see GetDmChatFeed). When true, the
    // client should issue another GetDmChatFeedRequest with the returned
    // paging_token.
    bool has_more = 4;
}

message GetGroupChatFeedRequest {
    // QueryOptions controls page_size. Ordering is fixed to most-recent
    // activity first and is not client-selectable.
    //
    // Leave query_options.paging_token unset on the first request: the server
    // mints a token that pins a new snapshot and returns it in the response. On
    // every subsequent request, set query_options.paging_token to the
    // paging_token from the most recent response to advance within the same
    // snapshot. The token is opaque and server-generated; do not construct it.
    //
    // Group feed tokens are larger than DM feed tokens: the server carries
    // the snapshot's remaining order in the token so later pages do not
    // recompute it. Clients must treat the token as an opaque blob of up to
    // common.v1.PagingToken's maximum size.
    common.v1.QueryOptions query_options = 1;

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message GetGroupChatFeedResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1;
        NOT_FOUND = 2;
    }

    repeated Metadata chats = 2 [(validate.rules).repeated = {
        min_items: 0
        max_items: 100
    }];

    // PagingToken is the server-generated token for this paginated read. On the
    // first response it pins a new snapshot; on later responses it carries the
    // advanced cursor over (last_activity, chat_id). The client MUST send the
    // most recent value back in query_options.paging_token on the next
    // GetGroupChatFeedRequest. Set when result is OK.
    common.v1.PagingToken paging_token = 3;

    // HasMore indicates whether further pages remain in this snapshot. When
    // false, the paginated set has been fully read; the complete chat list is
    // this set reconciled with the event stream (see GetGroupChatFeed). When
    // true, the client should issue another GetGroupChatFeedRequest with the
    // returned paging_token.
    bool has_more = 4;
}

message GetRosterRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    // QueryOptions controls page_size, capped at 100. Ordering is fixed to
    // most recently joined first and is not client-selectable.
    //
    // Leave query_options.paging_token unset on the first request. On every
    // subsequent request, set it to the paging_token from the most recent
    // response. The token is opaque and server-generated; do not construct
    // it. It is bound to chat_id and refused with another chat.
    common.v1.QueryOptions query_options = 2;

    // Set to read the roster with an invite link (see GetRoster) rather than
    // as a member: the token derived from the link's secret (see Invite). It
    // must be a token for an invite to chat_id. Send it on every page.
    InviteToken invite_token = 3;

    // Optional when invite_token is set, and required otherwise (see
    // GetRoster). When set, it must be valid.
    common.v1.Auth auth = 10;
}

message GetRosterResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1;
        NOT_FOUND = 2;
    }

    // The page, most recently joined first, each with user_profile,
    // joined_at and version set, and pointers for a DM. Set when result is
    // OK.
    repeated Member members = 2 [(validate.rules).repeated = {
        min_items: 0
        max_items: 100
    }];

    // The chat's roster summary as of this page's read. Set when result is
    // OK. Applied by version as described on RosterSummary; see GetRoster
    // for how the page relates to it.
    RosterSummary roster_summary = 3;

    // PagingToken carries the cursor over (joined_at, user_id) after the last
    // member returned. The client MUST send it back in
    // query_options.paging_token on the next GetRosterRequest. Set when
    // result is OK and has_more is true.
    common.v1.PagingToken paging_token = 4;

    // HasMore indicates whether further pages remain. When false, the roster
    // has been fully read as of this page; the complete member list is this
    // set reconciled with the event stream (see GetRoster). When true, the
    // client should issue another GetRosterRequest with the returned
    // paging_token.
    bool has_more = 5;
}

message SampleChattersRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    // Optional. When set it must be valid, but the sample is the same with
    // or without it (see Chat.SampleChatters).
    common.v1.Auth auth = 10;
}

message SampleChattersResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1;
        NOT_FOUND = 2;
    }

    // The sample, every one a member as of the read: the creator first, when
    // they are a member, then the most recent senders, most recent first.
    // Set when result is OK.
    repeated SampledChatter chatters = 2 [(validate.rules).repeated = {
        min_items: 0
        max_items: 100
    }];

    // Whether the group may have more members who have sent recently than
    // the sample holds, for a client to show that there are others. It is
    // true when the server knows of more, and also when it stopped looking
    // before it could tell. Set when result is OK.
    bool has_more = 3;
}

message GetMentionSuggestionsRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message GetMentionSuggestionsResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1;
        NOT_FOUND = 2;
    }

    // The suggestions, most relevant first, as many as the server chooses.
    // Set when result is OK.
    repeated MentionSuggestion suggestions = 2 [(validate.rules).repeated = {
        min_items: 0
        max_items: 200
    }];
}

message StartChatRequest {
    // Parameters for the kind of chat being created. The variant selects the
    // kind of chat. Both create a chat of type GROUP: one public, one
    // private.
    oneof parameters {
        option (validate.required) = true;

        PublicGroupChatParameters  public_group  = 1;
        PrivateGroupChatParameters private_group = 2;
    }

    // Parameters for creating a public group chat: one that users join with
    // JoinChat, subject to its rules.
    message PublicGroupChatParameters {
        // Title for the chat.
        string title = 1 [(validate.rules).string = {
            min_len: 1
            max_len: 64
        }];

        // The blob holding the ORIGINAL profile picture the caller uploaded.
        // Optional. If set, it must be owned by the caller and READY.
        blob.v1.BlobId profile_picture = 2;

        // Rules governing participation in the chat. Caller must satisfy the
        // rules, speaker rules included, in order for the chat to be started
        // (RULES_NOT_SATISFIED otherwise).
        //
        // The server currently accepts only the following, and refuses
        // anything else as INVALID_RULES:
        //  - Listener rules: exactly one MinimumBalanceRequirement, which is
        //    required, and optionally one StaffRequirement.
        //  - Speaker rules: optionally one MinimumBalanceRequirement. If set,
        //    it must be in the same currency and the same mints as the
        //    listener MinimumBalanceRequirement, and its amount must be larger
        //    by at least the currency's minimum transfer value.
        // Every MinimumBalanceRequirement must be at least the currency's
        // minimum transfer value (one unit at its last decimal place, e.g.
        // 0.01 USD or 1 JPY), in a currency the server can value.
        Rules rules = 3;

        // Description for the chat. Optional; empty sets none. Moderated like
        // the title.
        string description = 4 [(validate.rules).string = {
            max_len: 160
        }];

        // The blob holding the ORIGINAL cover picture the caller uploaded.
        // Optional. If set, it must be owned by the caller and READY.
        blob.v1.BlobId cover_picture = 5;
    }

    // Parameters for creating a private group chat (see Metadata.is_private):
    // one whose members are admitted by its creator from its lobby or join
    // with an invite, and whose messages are end-to-end encrypted. Whether a
    // group is private is fixed for the life of the chat. A private group has
    // no rules.
    //
    // Creating a private group takes two steps. A key envelope is bound to
    // the chat's ID, which the caller learns only from the response, so the
    // caller generates the chat key once StartChat returns and stores its own
    // envelope with SetKeyEnvelope (see KeyEnvelope).
    //
    // Until the creator's envelope is stored, the group has no key. It
    // exists and is visible like any other private group: GetChat returns
    // it, and it appears in the creator's GetGroupChatFeed. But nothing can
    // happen in it, and the server refuses each of these as DENIED:
    //  - EnterLobby, by anyone
    //  - AdmitLobbyMember
    //  - CreateInvite
    //  - Messaging.SendMessage and Messaging.EditMessage
    //  - BlobStorage.InitiateExternalUpload of a blob encrypted for the chat
    // The creator's client must keep attempting SetKeyEnvelope until it
    // succeeds. Storing the envelope lifts every refusal above, and it is
    // never undone: the creator's envelope is kept even if they leave.
    message PrivateGroupChatParameters {
        // Title for the chat.
        string title = 1 [(validate.rules).string = {
            min_len: 1
            max_len: 64
        }];

        // The blob holding the ORIGINAL profile picture the caller uploaded.
        // Optional. If set, it must be owned by the caller and READY.
        blob.v1.BlobId profile_picture = 2;

        // Description for the chat. Optional; empty sets none. Moderated like
        // the title.
        string description = 3 [(validate.rules).string = {
            max_len: 160
        }];

        // The blob holding the ORIGINAL cover picture the caller uploaded.
        // Optional. If set, it must be owned by the caller and READY.
        blob.v1.BlobId cover_picture = 4;
    }

    // Key for retrying this request safely. A retry with the same key from the
    // same caller returns the chat the first attempt created, with result OK,
    // even if the parameters differ.
    IdempotencyKey idempotency_key = 9 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message StartChatResponse {
    Result result = 1;
    enum Result {
        OK                                = 0;
        DENIED                            = 1;
        TITLE_MODERATED                   = 2;
        PROFILE_PICTURE_BLOB_NOT_ACCEPTED = 3;
        INVALID_RULES                     = 4;
        RULES_NOT_SATISFIED               = 5;
        DESCRIPTION_MODERATED             = 6;
        COVER_PICTURE_BLOB_NOT_ACCEPTED   = 7;
    }

    // The metadata for the newly created chat, including the server-generated
    // chat_id and any profile picture or cover picture renditions the server
    // derived. Set only when result == OK.
    Metadata chat = 2;

    // The best-fit category that tripped moderation, mirroring the Moderation
    // service's vocabulary. Set only when result == TITLE_MODERATED or
    // DESCRIPTION_MODERATED; NONE otherwise.
    moderation.v1.FlaggedCategory flagged_category = 3;
}

message JoinChatRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    // Set to join a private group with an invite (see JoinChat).
    InviteParameters invite = 2;
    message InviteParameters {
        // The token derived from the invite link's secret (see Invite). It
        // must be a token for an invite to chat_id.
        InviteToken invite_token = 1 [(validate.rules).message.required = true];

        // The link's secret encrypted by the caller for themself (see
        // InviteSecretEnvelope). A join that stores the invite's copy of the
        // chat key for the caller stores this with it, so that any of the
        // caller's devices can open the copy until they replace it with an
        // envelope of their own. A caller who is already a member changes
        // nothing, so it is not stored. The server cannot open it or check
        // what it holds: one that does not hold the link's secret leaves the
        // copy openable only on a device that still has the link.
        InviteSecretEnvelope secret_envelope = 2 [(validate.rules).message.required = true];
    }

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message JoinChatResponse {
    Result result = 1;
    enum Result {
        OK                  = 0;
        DENIED              = 1;
        NOT_FOUND           = 2;
        RULES_NOT_SATISFIED = 3;
        BANNED              = 4; // The chat's creator banned the caller (see BanUser)
        INVITE_NOT_FOUND    = 5; // No invite to this chat matches the token, or the chat is not a private group
        INVITE_EXHAUSTED    = 6; // The invite has admitted max_uses joins
        INVITE_EXPIRED      = 7; // The invite's expires_at has passed
        INVITE_REVOKED      = 8; // The invite was revoked (see RevokeInvite)
    }

    // The metadata for the joined chat, as seen by the caller. Set only when
    // result == OK.
    Metadata chat = 2;
}

message LeaveChatRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message LeaveChatResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1;
        NOT_FOUND = 2;
    }
}

message EditChatRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    // The new title. Left unchanged when unset.
    Title title = 2;

    // The new profile picture. Left unchanged when unset.
    ProfilePicture profile_picture = 3;

    // The new description. Left unchanged when unset.
    Description description = 4;

    // The new cover picture. Left unchanged when unset.
    CoverPicture cover_picture = 5;

    message Title {
        string value = 1 [(validate.rules).string = {
            min_len: 1
            max_len: 64
        }];
    }

    message ProfilePicture {
        // The blob holding the ORIGINAL profile picture the caller uploaded. It
        // must be owned by the caller and READY; the server derives the
        // remaining renditions from it.
        blob.v1.BlobId blob_id = 1 [(validate.rules).message.required = true];
    }

    message Description {
        // The new description. Empty clears it.
        string value = 1 [(validate.rules).string = {
            max_len: 160
        }];
    }

    message CoverPicture {
        // The blob holding the ORIGINAL cover picture the caller uploaded. It
        // must be owned by the caller and READY; the server derives the
        // remaining renditions from it.
        blob.v1.BlobId blob_id = 1 [(validate.rules).message.required = true];
    }

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message EditChatResponse {
    Result result = 1;
    enum Result {
        OK                                = 0;
        DENIED                            = 1;
        NOT_FOUND                         = 2;
        TITLE_MODERATED                   = 3;
        PROFILE_PICTURE_BLOB_NOT_ACCEPTED = 4;
        COVER_PICTURE_BLOB_NOT_ACCEPTED   = 5;
        DESCRIPTION_MODERATED             = 6;
    }

    // The metadata for the chat after the edit, as seen by the caller,
    // including any profile picture or cover picture renditions the server
    // derived. Set only when result == OK.
    Metadata chat = 2;

    // The best-fit category that tripped moderation, mirroring the Moderation
    // service's vocabulary. Set only when result == TITLE_MODERATED or
    // DESCRIPTION_MODERATED; NONE otherwise.
    moderation.v1.FlaggedCategory flagged_category = 3;
}

message MuteChatRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    // How long to mute for. A timed mute must end in the future; the server
    // rejects one that does not.
    MuteState mute = 2 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message MuteChatResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1; // Caller is not a member
        NOT_FOUND = 2;
    }

    // The caller's state for the chat after the write, so the client can
    // apply it at its version. Set only when result == OK.
    ViewerState viewer_state = 2;
}

message UnmuteChatRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message UnmuteChatResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1;
        NOT_FOUND = 2;
    }

    // As for MuteChatResponse.viewer_state.
    ViewerState viewer_state = 2;
}

message EnterLobbyRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message EnterLobbyResponse {
    Result result = 1;
    enum Result {
        OK               = 0;
        DENIED           = 1; // The chat is not a private group, or has no key yet (see EnterLobby)
        NOT_FOUND        = 2;
        ALREADY_MEMBER   = 3; // Caller is already a member of the chat
        LOBBY_FULL       = 4; // The chat's lobby holds as many users as the server allows
        TOO_MANY_LOBBIES = 5; // Caller is waiting in as many lobbies as the server allows
        BANNED           = 6; // The chat's creator banned the caller (see BanUser)
    }

    // The caller's place in the lobby, so the client can record the chat it
    // is now waiting in without a refetch. Set only when result == OK.
    Lobby lobby = 2;
}

message LeaveLobbyRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message LeaveLobbyResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1; // The chat is not a private group
        NOT_FOUND = 2;
    }
}

message GetLobbyMembersRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    // QueryOptions controls page_size, capped at 100. Ordering is fixed to
    // earliest entered first and is not client-selectable.
    //
    // Leave query_options.paging_token unset on the first request. On every
    // subsequent request, set it to the paging_token from the most recent
    // response. The token is opaque and server-generated; do not construct
    // it. It is bound to chat_id and refused with another chat.
    common.v1.QueryOptions query_options = 2;

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message GetLobbyMembersResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1; // Caller is not the chat's creator, or the chat is not a private group
        NOT_FOUND = 2;
    }

    // The page, earliest entered first. Set when result is OK.
    repeated LobbyMember members = 2 [(validate.rules).repeated = {
        min_items: 0
        max_items: 100
    }];

    // PagingToken carries the cursor after the last member returned. The
    // client MUST send it back in query_options.paging_token on the next
    // GetLobbyMembersRequest. Set when result is OK and has_more is true.
    common.v1.PagingToken paging_token = 3;

    // HasMore indicates whether further pages remain. When true, the client
    // should issue another GetLobbyMembersRequest with the returned
    // paging_token.
    bool has_more = 4;
}

message AdmitLobbyMemberRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    // The user to admit, who must be waiting in the chat's lobby.
    common.v1.UserId user_id = 2 [(validate.rules).message.required = true];

    // The chat key wrapped by the caller for that user's public key, as
    // given by LobbyMember.public_key (see KeyEnvelope). The server cannot
    // check its contents: an envelope the user cannot open leaves them a
    // member who cannot read the chat.
    KeyEnvelope key_envelope = 3 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message AdmitLobbyMemberResponse {
    Result result = 1;
    enum Result {
        OK           = 0;
        DENIED       = 1; // Caller may not admit users to this chat (see AdmitLobbyMember)
        NOT_FOUND    = 2;
        NOT_IN_LOBBY = 3; // The user is neither waiting in the lobby nor a member
    }
}

message DenyLobbyMemberRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    // The user to remove from the chat's lobby.
    common.v1.UserId user_id = 2 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message DenyLobbyMemberResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1; // Caller is not the chat's creator, or the chat is not a private group
        NOT_FOUND = 2;
    }
}

message SetKeyEnvelopeRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    // The chat key wrapped by the caller for themself (see KeyEnvelope).
    KeyEnvelope key_envelope = 2 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message SetKeyEnvelopeResponse {
    Result result = 1;
    enum Result {
        OK          = 0;
        DENIED      = 1; // Caller is not a member, or the chat is not a private group
        NOT_FOUND   = 2;
        ALREADY_SET = 3; // Caller already stored a different envelope of their own, which stands
    }
}

message GetKeyEnvelopeRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message GetKeyEnvelopeResponse {
    Result result = 1;
    enum Result {
        OK          = 0;
        DENIED      = 1; // Caller is not a member, or the chat is not a private group
        NOT_FOUND   = 2;
        NO_ENVELOPE = 3; // Caller is a member with no envelope stored
    }

    // The envelope stored for the caller. Set only when result == OK.
    oneof envelope {
        // The caller's key envelope, wrapped by themself or by the chat's
        // creator.
        KeyEnvelope key_envelope = 2;

        // An invite's copy of the chat key, stored for the caller when they
        // joined with an invite (see JoinChat) and kept until they replace it
        // with an envelope of their own (SetKeyEnvelope). It holds everything
        // the client needs to open the copy (see InviteKeyEnvelope).
        InviteKeyBundle invite_key_bundle = 5;
    }
    message InviteKeyBundle {
        // The invite whose copy this is.
        InviteId invite_id = 1 [(validate.rules).message.required = true];

        // The invite's copy of the chat key. The client checks its
        // signature, opens it with the link's secret from secret_envelope,
        // and wraps the chat key for the caller.
        InviteKeyEnvelope key_envelope = 2 [(validate.rules).message.required = true];

        // The link's secret, encrypted by the caller for themself when they
        // joined (JoinChatRequest.InviteParameters.secret_envelope). It opens
        // with the caller's account key on any of their devices.
        InviteSecretEnvelope secret_envelope = 3 [(validate.rules).message.required = true];
    }

    // The user who stored the envelope, as the server authenticated them:
    // the caller, or the chat's creator. For an invite's copy
    // (invite_key_bundle) it is the user who created the invite and signed
    // the copy (Invite.created_by), which must be the chat's creator (see
    // InviteKeyEnvelope). It tells the client whose public key to open or
    // verify the envelope against, and is only a hint: an envelope that does
    // not open or verify against that key is rejected. Set only when result
    // == OK.
    common.v1.UserId wrapped_by = 3;

    // The public key of the user named by wrapped_by, as the server reports
    // it: the key the client opens the envelope against, or verifies an
    // invite's copy against, when it has learned none for that user outside
    // this service (see KeyEnvelope). For a self-wrapped envelope it is the
    // caller's own key, which the client already holds. Set only when result
    // == OK.
    common.v1.PublicKey wrapped_by_public_key = 4;
}

message CreateInviteRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    // The token derived from the invite link's secret (see Invite), from
    // which the server computes the invite's ID. A retry with the same token
    // returns the invite the first attempt created.
    InviteToken invite_token = 2 [(validate.rules).message.required = true];

    // The chat key encrypted under the invite's wrap key and signed by the
    // caller.
    InviteKeyEnvelope key_envelope = 3 [(validate.rules).message.required = true];

    // The link's secret encrypted by the caller for themself.
    InviteSecretEnvelope secret_envelope = 4 [(validate.rules).message.required = true];

    // How many joins the invite allows (see Invite). 0 means unlimited.
    uint32 max_uses = 5;

    // When the invite stops admitting anyone. Optional; unset never expires.
    // If set, it must be in the future and no further away than the server
    // allows (INVALID_EXPIRES_AT otherwise).
    google.protobuf.Timestamp expires_at = 6;

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message CreateInviteResponse {
    Result result = 1;
    enum Result {
        OK                 = 0;
        DENIED             = 1; // Caller may not invite to this chat (see CreateInvite)
        NOT_FOUND          = 2;
        INVALID_EXPIRES_AT = 3; // expires_at is not in the future, or further away than the server allows
        TOO_MANY_INVITES   = 4; // The chat holds as many ACTIVE invites as the server allows
        INVALID_SIGNATURE  = 5; // key_envelope's signature does not verify against the caller's public key
    }

    // The created invite, or the one a retry with the same ID created. Set
    // only when result == OK.
    Invite invite = 2;
}

message GetInviteRequest {
    // The token derived from the invite link's secret (see Invite).
    InviteToken invite_token = 1 [(validate.rules).message.required = true];

    // Optional (see GetInvite). When set, it must be valid.
    common.v1.Auth auth = 10;
}

message GetInviteResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        NOT_FOUND = 1; // No invite matches the token
        BANNED    = 2; // The chat's creator banned the caller (see BanUser); authenticated callers only
    }

    // The chat the invite admits users to, as the caller sees it (see
    // GetInvite). Set only when result == OK.
    Metadata chat = 2;

    // Whether the invite still admits anyone. Set only when result == OK.
    Invite.Status status = 3;
}

message GetChatInvitesRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    // QueryOptions controls page_size, capped at 100. Ordering is fixed to
    // most recently created first and is not client-selectable.
    //
    // Leave query_options.paging_token unset on the first request. On every
    // subsequent request, set it to the paging_token from the most recent
    // response. The token is opaque and server-generated; do not construct
    // it. It is bound to chat_id and refused with another chat.
    common.v1.QueryOptions query_options = 2;

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message GetChatInvitesResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1; // Caller may not invite to this chat (see GetChatInvites)
        NOT_FOUND = 2;
    }

    // The page, most recently created first. Set when result is OK.
    repeated Invite invites = 2 [(validate.rules).repeated = {
        min_items: 0
        max_items: 100
    }];

    // PagingToken carries the cursor after the last invite returned. The
    // client MUST send it back in query_options.paging_token on the next
    // GetChatInvitesRequest. Set when result is OK and has_more is true.
    common.v1.PagingToken paging_token = 3;

    // HasMore indicates whether further pages remain. When true, the client
    // should issue another GetChatInvitesRequest with the returned
    // paging_token.
    bool has_more = 4;
}

message RevokeInviteRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    // The invite to revoke, which must be an invite to chat_id.
    InviteId invite_id = 2 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message RevokeInviteResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1; // Caller may not invite to this chat (see RevokeInvite)
        NOT_FOUND = 2; // No such chat, or no invite to it with this ID
    }
}

message SetFeaturedGroupsRequest {
    // The groups to feature, in the order to show them. Every ID must name a
    // public group chat, and none may repeat. Empty clears the featured
    // groups.
    repeated common.v1.ChatId chat_ids = 1 [(validate.rules).repeated = {
        min_items: 0
        max_items: 10
    }];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message SetFeaturedGroupsResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1; // A group in the request is private; nothing was written
        NOT_FOUND = 2; // A group in the request does not exist; nothing was written
    }

    // The caller's featured groups after the write, as GetFeaturedGroups
    // returns them. Set only when result == OK.
    repeated Metadata featured_groups = 2 [(validate.rules).repeated = {
        min_items: 0
        max_items: 10
    }];
}

message GetFeaturedGroupsRequest {
    // The user whose featured groups are being fetched. Only a username is
    // supported for now; the oneof leaves room for other identifiers.
    oneof identifier {
        option (validate.required) = true;

        common.v1.Username username = 1;
    }

    // Optional. When set it must be valid, but the list is the same with or
    // without it (see Chat.GetFeaturedGroups).
    common.v1.Auth auth = 10;
}

message GetFeaturedGroupsResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        NOT_FOUND = 1; // No user holds the username
    }

    // The user's featured groups, in their order. Empty when they feature
    // none. Set only when result == OK.
    repeated Metadata featured_groups = 2 [(validate.rules).repeated = {
        min_items: 0
        max_items: 10
    }];
}

message SilenceUserRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    // The user to silence.
    common.v1.UserId user_id = 2 [(validate.rules).message.required = true];

    // How long to silence them for. A timed silence must end in the future;
    // the server rejects one that does not.
    SilenceState silence = 3 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message SilenceUserResponse {
    Result result = 1;
    enum Result {
        OK                      = 0;
        DENIED                  = 1; // Caller may not silence users in this chat (see SilenceUser)
        NOT_FOUND               = 2;
        CANNOT_RESTRICT_CREATOR = 3; // The user is the chat's creator
    }
}

message UnsilenceUserRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    // The user to unsilence.
    common.v1.UserId user_id = 2 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message UnsilenceUserResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1; // Caller may not silence users in this chat (see SilenceUser)
        NOT_FOUND = 2;
    }
}

message BanUserRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    // The user to ban.
    common.v1.UserId user_id = 2 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message BanUserResponse {
    Result result = 1;
    enum Result {
        OK                      = 0;
        DENIED                  = 1; // Caller may not ban users in this chat (see BanUser)
        NOT_FOUND               = 2;
        CANNOT_RESTRICT_CREATOR = 3; // The user is the chat's creator
    }
}

message UnbanUserRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    // The user to unban.
    common.v1.UserId user_id = 2 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message UnbanUserResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1; // Caller may not ban users in this chat (see BanUser)
        NOT_FOUND = 2;
    }
}

message GetRestrictedUsersRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    // QueryOptions controls page_size, capped at 100. Ordering is fixed to
    // most recently restricted first and is not client-selectable.
    //
    // Leave query_options.paging_token unset on the first request. On every
    // subsequent request, set it to the paging_token from the most recent
    // response. The token is opaque and server-generated; do not construct
    // it. It is bound to chat_id and refused with another chat.
    common.v1.QueryOptions query_options = 2;

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message GetRestrictedUsersResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1; // Caller may neither silence nor ban users in this chat (see GetRestrictedUsers)
        NOT_FOUND = 2;
    }

    // The page, most recently restricted first. Set when result is OK.
    repeated RestrictedUser users = 2 [(validate.rules).repeated = {
        min_items: 0
        max_items: 100
    }];

    // PagingToken carries the cursor after the last user returned. The
    // client MUST send it back in query_options.paging_token on the next
    // GetRestrictedUsersRequest. Set when result is OK and has_more is true.
    common.v1.PagingToken paging_token = 3;

    // HasMore indicates whether further pages remain. When true, the client
    // should issue another GetRestrictedUsersRequest with the returned
    // paging_token.
    bool has_more = 4;
}

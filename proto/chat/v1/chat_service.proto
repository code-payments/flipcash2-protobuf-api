syntax = "proto3";

package flipcash.chat.v1;

option go_package = "github.com/code-payments/flipcash2-protobuf-api/generated/go/chat/v1;chatpb";
option java_package = "com.codeinc.flipcash.gen.chat.v1";
option objc_class_prefix = "FPBChatV1";

import "blob/v1/model.proto";
import "chat/v1/model.proto";
import "common/v1/common.proto";
import "messaging/v1/model.proto";
import "moderation/v1/model.proto";
import "validate/validate.proto";

service Chat {
    // GetChat returns the metadata for a specific chat
    //
    // Auth is optional. An unauthenticated caller gets the chat's public view:
    // the same group record a registered non-member previewing it receives,
    // with view_mode REDACTED and none of the per-viewer fields (is_hidden,
    // viewer_state). An unauthenticated read under any other view_mode, or of
    // a DM, is DENIED.
    //
    // A private group (see Metadata.is_private) returns its record to any
    // registered user, so that one who is not a member can see what they are
    // asking to join, but its messaging state only to a member, whatever the
    // view_mode. It has no public view: an unauthenticated read of one is
    // DENIED. A private group whose creator has not stored its key yet (see
    // StartChatRequest.PrivateGroupChatParameters) is returned like any
    // other: it is visible, though nothing can happen in it.
    rpc GetChat(GetChatRequest) returns (GetChatResponse);

    // GetDmChatFeed gets the set of DM chats for an owner account using
    // a paged API, ordered by last activity with the most recent first.
    //
    // Chats are ordered by a mutable key (last_activity), so pagination alone
    // cannot guarantee a complete read: a chat can receive new activity and
    // move into a region the client has already paged past. To get the full
    // list, the client MUST combine this RPC with the event stream:
    //
    //   1. Open the event stream to receive ChatUpdate and begin buffering updates
    //      BEFORE the first GetDmChatFeed call. This ordering is the contract that
    //      closes the gap; subscribing after pagination starts can drop chats.
    //   2. Page through GetDmChatFeed to exhaustion (until has_more is false),
    //      always echoing back the paging token returned by the prior response.
    //      All pages are served against a single snapshot pinned by that token,
    //      so the set is read consistently.
    //   3. Merge the buffered and ongoing stream updates onto the paginated
    //      set. Any chat whose activity changed after the snapshot watermark
    //      is delivered via the stream rather than via pagination.
    //
    // Read together, pagination guarantees the set (every chat exactly once)
    // and the stream guarantees freshness and ordering. The local last_activity
    // sort is maintained by the client from the stream after the initial read.
    rpc GetDmChatFeed(GetDmChatFeedRequest) returns (GetDmChatFeedResponse);

    // GetGroupChatFeed gets the set of group chats for an owner account using
    // a paged API, ordered by last activity with the most recent first.
    //
    // It has the same read contract as GetDmChatFeed. Chats are ordered by a
    // mutable key (last_activity), so pagination alone cannot guarantee a
    // complete read. To get the full list, the client MUST combine this RPC
    // with the event stream:
    //
    //   1. Open the event stream to receive ChatUpdate and begin buffering
    //      updates BEFORE the first GetGroupChatFeed call.
    //   2. Page through GetGroupChatFeed to exhaustion (until has_more is
    //      false), always echoing back the paging token returned by the prior
    //      response. All pages are served against a single snapshot pinned by
    //      that token.
    //   3. Merge the buffered and ongoing stream updates onto the paginated
    //      set. Any chat whose activity changed after the snapshot watermark
    //      is delivered via the stream rather than via pagination.
    //
    // Unlike the DM feed, a group's membership can change while the feed is
    // being read. Every page is served only for groups the caller is still a
    // member of at the time of that page; a group the caller left between
    // pages is dropped, and its removal arrives on the stream.
    rpc GetGroupChatFeed(GetGroupChatFeedRequest) returns (GetGroupChatFeedResponse);

    // GetRoster pages a chat's roster, most recently joined first. Every
    // page carries the chat's RosterSummary, and every member carries the
    // roster version that placed them (see Member.version).
    //
    // A DM's roster is its participants, and a small group's is read whole:
    // for these a page is the roster at exactly roster_summary.version — a
    // roster that fits one page is member_count members, and a later page
    // is a fresh snapshot at its own summary. A large group's roster is
    // paged from an index that trails membership writes briefly, so a page
    // may lag roster_summary — a member
    // who just joined may be absent, one who just left may be present.
    // Clients do not see which case they are in and must follow the weaker
    // contract: treat roster_summary.version as the staleness watermark
    // described on RosterSummary, and merge each page against what the
    // event stream has told them per member by Member.version, the greater
    // winning. A cached member absent from a fully read roster is gone
    // unless the client holds their join at a version above the page's
    // roster_summary.version. A join during the walk lands ahead of the
    // cursor and arrives only as a RosterUpdate.
    //
    // Pointers are hydrated for a DM's participants only. A group's members
    // carry none: group pointer advances are never broadcast, so a page of
    // them would be stale as soon as it was served.
    //
    // Requires that the caller may read the chat: a member, or a non-member
    // a group's listener rules admit. A viewer who may only preview the chat
    // is DENIED.
    rpc GetRoster(GetRosterRequest) returns (GetRosterResponse);

    // GetMentionSuggestions returns people the caller may want to @mention in
    // a group chat, ranked by the server, most relevant first. Today that is
    // the group's most recent senders, most recent first, including people
    // who have since left the group.
    //
    // The response is a ranked pool of suggestions, not the set of people who
    // may be mentioned, and it is neither complete nor paged. The server
    // decides how many to return, up to 200; the client filters the whole
    // pool locally as the user types, however few rows it displays, and keeps
    // it fresh from the event stream by moving the sender of each new message
    // to the front. It fetches the pool once per composing session. The
    // ranking and the pool's size may change without notice; clients must
    // not depend on either beyond the order given.
    //
    // The caller, users the caller has blocked, and users without a username
    // are never suggested. A user who has blocked the caller may still be.
    //
    // Requires that the caller may speak in the chat. A DM is DENIED.
    rpc GetMentionSuggestions(GetMentionSuggestionsRequest) returns (GetMentionSuggestionsResponse);

    // StartChat starts a new chat.
    rpc StartChat(StartChatRequest) returns (StartChatResponse);

    // JoinChat adds the caller to a chat's roster.
    //
    // A private group (see Metadata.is_private) cannot be joined this way and
    // is DENIED: a user enters its lobby with EnterLobby and is admitted by
    // its creator. The one exception is the group's creator, who needs no
    // approval and rejoins a private group they left with this RPC.
    rpc JoinChat(JoinChatRequest) returns (JoinChatResponse);

    // LeaveChat removes the caller from a chat's roster.
    //
    // Leaving a private group discards the caller's key envelope (see
    // KeyEnvelope), so returning means entering the lobby and being admitted
    // again. The creator's envelope is kept, since no one else could give
    // them another.
    rpc LeaveChat(LeaveChatRequest) returns (LeaveChatResponse);

    // EditChat edits a group chat's record. Every editable field is optional;
    // only the ones set in the request are changed, and the edit is atomic:
    // if any part is refused, nothing is applied.
    //
    // Only a group chat may be edited, and only by a member the server permits
    // to edit it, as reported by ViewerState.Permissions.can_edit; anyone else
    // is DENIED. A new title is moderated like
    // StartChat's. A new picture is a blob the caller has already uploaded via
    // BlobStorage: the client uploads only the ORIGINAL and passes the
    // resulting BlobId once the blob is READY, and the server derives the
    // remaining renditions. Setting a field to the value the chat already has
    // is a no-op for that field, and a request that sets nothing is a no-op
    // that returns OK.
    //
    // Every real change reaches the chat's members, including the caller's
    // other devices, on the event stream as one MetadataUpdate per field
    // changed: TitleChanged for the title, PictureChanged for the picture.
    rpc EditChat(EditChatRequest) returns (EditChatResponse);

    // MuteChat mutes a chat for the caller, until a time or indefinitely.
    //
    // Only a member may mute. Muting does not affect the event stream or
    // message delivery: pushes for a muted chat are still sent, flagged with
    // push.v1.ChatMetadata.muted, and the client suppresses the notification.
    // Calling it again with a different duration replaces the mute. An
    // identical request is a no-op. A mute is cleared when the caller leaves
    // the chat. Every real change reaches the caller's other devices as a
    // MetadataUpdate.ViewerStateChanged on the event stream.
    rpc MuteChat(MuteChatRequest) returns (MuteChatResponse);

    // UnmuteChat clears the caller's mute on a chat. Unmuting a chat that is
    // not muted is a no-op. Every real change reaches the caller's other devices
    // as a MetadataUpdate.ViewerStateChanged on the event stream.
    rpc UnmuteChat(UnmuteChatRequest) returns (UnmuteChatResponse);

    // EnterLobby places the caller in a private group's lobby, where they
    // wait for the group's creator to admit them. It is how a user asks to
    // join a private group (see Metadata.is_private); JoinChat is DENIED for
    // one.
    //
    // Entering a lobby the caller is already in is a no-op that returns OK.
    // The server caps both how many users may wait in one lobby and how many
    // lobbies one user may wait in. A group whose creator has not stored its
    // key yet (see StartChatRequest.PrivateGroupChatParameters) has no lobby
    // to enter, and is DENIED until they have.
    //
    // A lobby is visible only to the group's creator, through
    // GetLobbyMembers: the users waiting in it are not shown to each other or
    // to the group's members. The creator's devices learn of the entry as a
    // LobbyUpdate on the event stream.
    //
    // While the caller waits, the chat's Metadata carries in_lobby. The
    // caller leaves the lobby when they withdraw (LeaveLobby), when the
    // creator denies them (DenyLobbyMember), or when the creator admits them
    // (ApproveLobbyMember). An admission reaches the caller's devices as a
    // RosterUpdate.MemberJoined naming them; a denial is not announced to
    // them.
    //
    // There is no RPC that lists the lobbies a caller is waiting in. A client
    // keeps the chats it entered itself, and reads in_lobby from GetChat to
    // learn whether it is still waiting in one. A paged listing may be added
    // later.
    rpc EnterLobby(EnterLobbyRequest) returns (EnterLobbyResponse);

    // LeaveLobby withdraws the caller from a private group's lobby. Leaving a
    // lobby the caller is not in is a no-op that returns OK.
    rpc LeaveLobby(LeaveLobbyRequest) returns (LeaveLobbyResponse);

    // GetLobbyMembers pages the users waiting in a private group's lobby,
    // earliest entered first.
    //
    // Only the group's creator may call it, and only while a member of the
    // group; anyone else is DENIED. The page is read from an index that
    // trails writes briefly, so a user who just entered may be absent and one
    // who just left may be present.
    rpc GetLobbyMembers(GetLobbyMembersRequest) returns (GetLobbyMembersResponse);

    // ApproveLobbyMember admits a user waiting in a private group's lobby:
    // it stores the chat key wrapped for them (see KeyEnvelope) and adds them
    // to the chat's roster. The envelope is stored first, so an admitted
    // member always has one.
    //
    // Only the group's creator may call it, and only while a member of the
    // group; anyone else is DENIED. So is a creator who has not stored their
    // own key envelope yet (see StartChatRequest.PrivateGroupChatParameters):
    // nobody is admitted to a group before its creator holds its key. This is
    // the only way to give another user a key envelope. Approving a user who
    // is already a member is a no-op that returns OK and leaves their stored
    // envelope as it is.
    //
    // The admission is announced like any other join: a
    // RosterUpdate.MemberJoined to the chat's members and to the admitted
    // user, who then fetches their envelope with GetKeyEnvelope.
    rpc ApproveLobbyMember(ApproveLobbyMemberRequest) returns (ApproveLobbyMemberResponse);

    // DenyLobbyMember removes a user from a private group's lobby without
    // admitting them. Only the group's creator may call it, and only while a
    // member of the group; anyone else is DENIED. Denying a user who is not
    // in the lobby is a no-op that returns OK.
    //
    // The denied user is not notified. The chat's Metadata stops carrying
    // in_lobby for them, and they may enter the lobby again.
    rpc DenyLobbyMember(DenyLobbyMemberRequest) returns (DenyLobbyMemberResponse);

    // SetKeyEnvelope stores the caller's own key envelope for a private
    // group. Only a member may call it, and only for themself: an envelope
    // for another user is stored by admitting them (ApproveLobbyMember).
    //
    // It is called in two situations (see KeyEnvelope):
    //  - By the group's creator, right after StartChat returns the chat's
    //    ID, to store the chat key they have just generated. This is the
    //    second step of creating a private group, and nothing can happen in
    //    the group until it succeeds (see
    //    StartChatRequest.PrivateGroupChatParameters). The creator's client
    //    keeps attempting it until it returns OK or ALREADY_SET: on a failed
    //    call, on its next launch, and on any device that finds the group
    //    with NO_ENVELOPE.
    //  - By an admitted member, after first opening the envelope the creator
    //    wrapped for them, to replace it with one wrapped by themself.
    //
    // The first envelope a caller stores for themself stands. Once the
    // stored envelope is one the caller wrapped, a call with a different
    // envelope changes nothing and returns ALREADY_SET, and the caller uses
    // the stored one from GetKeyEnvelope. This keeps two of a creator's
    // devices, each setting up the same new group, from holding different
    // keys. Storing an envelope identical to the one stored is a no-op that
    // returns OK.
    //
    // Nothing is published: the caller's other devices fetch the envelope
    // when they need it.
    rpc SetKeyEnvelope(SetKeyEnvelopeRequest) returns (SetKeyEnvelopeResponse);

    // GetKeyEnvelope returns the caller's own key envelope for a private
    // group. Only a member may call it. The chat key never changes, so a
    // client calls this once per chat per install and keeps the key it
    // unwraps.
    //
    // NO_ENVELOPE is expected only for the creator of a group whose creation
    // stopped between StartChat and SetKeyEnvelope. A creator's client that
    // receives it generates a chat key and stores its envelope with
    // SetKeyEnvelope, as described on KeyEnvelope, and keeps attempting that
    // until it succeeds.
    rpc GetKeyEnvelope(GetKeyEnvelopeRequest) returns (GetKeyEnvelopeResponse);
}

message GetChatRequest {
    common.v1.ChatId chat_id = 1;

    // What the client intends to render of the chat's messaging state — its
    // last_message and latest_event_sequence — and so whether they may be
    // returned redacted (see messaging.v1.ViewMode). A group's record (title,
    // picture, rules, roster summary) is returned to every registered user
    // whatever the mode; the mode decides only the messaging state, which is
    // withheld from a viewer who may not read the chat under it. Unset (FULL)
    // is the pre-redaction contract: messaging state for a viewer who may
    // read the chat in full, the bare record for anyone else.
    //
    // Must be REDACTED when auth is unset; any other mode is DENIED.
    messaging.v1.ViewMode view_mode = 2 [(validate.rules).enum = {
        in: [0, 1, 2] // FULL, FULL_OR_REDACTED, REDACTED
    }];

    // Optional. Unset requests the chat's public view (see Chat.GetChat),
    // which requires view_mode REDACTED.
    common.v1.Auth auth = 10;
}

message GetChatResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1;
        NOT_FOUND = 2;
    }

    Metadata metadata = 2;
}

message GetDmChatFeedRequest {
    // QueryOptions controls page_size. Ordering is fixed to most-recent
    // activity first and is not client-selectable.
    //
    // Leave query_options.paging_token unset on the first request: the server
    // mints a token that pins a new snapshot and returns it in the response. On
    // every subsequent request, set query_options.paging_token to the
    // paging_token from the most recent response to advance within the same
    // snapshot. The token is opaque and server-generated; do not construct it.
    common.v1.QueryOptions query_options = 1;

    // The type of DM chat to filter for
    //
    // For backwards compatiblity, UNKNOWN maps to CONTACT_DM for legacy clients
    ChatType dm_chat_type = 2 [(validate.rules).enum = {
        in: [0, 1, 2] // UNKNOWN, CONTACT_DM, DM
    }];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message GetDmChatFeedResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1;
        NOT_FOUND = 2;
    }

    repeated Metadata chats = 2 [(validate.rules).repeated = {
        min_items: 0
        max_items: 100
    }];

    // PagingToken is the server-generated token for this paginated read. On the
    // first response it pins a new snapshot; on later responses it carries the
    // advanced cursor over (last_activity, chat_id). The client MUST send the
    // most recent value back in query_options.paging_token on the next
    // GetDmChatFeedRequest. Set when result is OK.
    common.v1.PagingToken paging_token = 3;

    // HasMore indicates whether further pages remain in this snapshot. When
    // false, the paginated set has been fully read; the complete chat list is
    // this set reconciled with the event stream (see GetDmChatFeed). When true, the
    // client should issue another GetDmChatFeedRequest with the returned
    // paging_token.
    bool has_more = 4;
}

message GetGroupChatFeedRequest {
    // QueryOptions controls page_size. Ordering is fixed to most-recent
    // activity first and is not client-selectable.
    //
    // Leave query_options.paging_token unset on the first request: the server
    // mints a token that pins a new snapshot and returns it in the response. On
    // every subsequent request, set query_options.paging_token to the
    // paging_token from the most recent response to advance within the same
    // snapshot. The token is opaque and server-generated; do not construct it.
    //
    // Group feed tokens are larger than DM feed tokens: the server carries
    // the snapshot's remaining order in the token so later pages do not
    // recompute it. Clients must treat the token as an opaque blob of up to
    // common.v1.PagingToken's maximum size.
    common.v1.QueryOptions query_options = 1;

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message GetGroupChatFeedResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1;
        NOT_FOUND = 2;
    }

    repeated Metadata chats = 2 [(validate.rules).repeated = {
        min_items: 0
        max_items: 100
    }];

    // PagingToken is the server-generated token for this paginated read. On the
    // first response it pins a new snapshot; on later responses it carries the
    // advanced cursor over (last_activity, chat_id). The client MUST send the
    // most recent value back in query_options.paging_token on the next
    // GetGroupChatFeedRequest. Set when result is OK.
    common.v1.PagingToken paging_token = 3;

    // HasMore indicates whether further pages remain in this snapshot. When
    // false, the paginated set has been fully read; the complete chat list is
    // this set reconciled with the event stream (see GetGroupChatFeed). When
    // true, the client should issue another GetGroupChatFeedRequest with the
    // returned paging_token.
    bool has_more = 4;
}

message GetRosterRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    // QueryOptions controls page_size, capped at 100. Ordering is fixed to
    // most recently joined first and is not client-selectable.
    //
    // Leave query_options.paging_token unset on the first request. On every
    // subsequent request, set it to the paging_token from the most recent
    // response. The token is opaque and server-generated; do not construct
    // it. It is bound to chat_id and refused with another chat.
    common.v1.QueryOptions query_options = 2;

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message GetRosterResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1;
        NOT_FOUND = 2;
    }

    // The page, most recently joined first, each with user_profile,
    // joined_at and version set, and pointers for a DM. Set when result is
    // OK.
    repeated Member members = 2 [(validate.rules).repeated = {
        min_items: 0
        max_items: 100
    }];

    // The chat's roster summary as of this page's read. Set when result is
    // OK. Applied by version as described on RosterSummary; see GetRoster
    // for how the page relates to it.
    RosterSummary roster_summary = 3;

    // PagingToken carries the cursor over (joined_at, user_id) after the last
    // member returned. The client MUST send it back in
    // query_options.paging_token on the next GetRosterRequest. Set when
    // result is OK and has_more is true.
    common.v1.PagingToken paging_token = 4;

    // HasMore indicates whether further pages remain. When false, the roster
    // has been fully read as of this page; the complete member list is this
    // set reconciled with the event stream (see GetRoster). When true, the
    // client should issue another GetRosterRequest with the returned
    // paging_token.
    bool has_more = 5;
}

message GetMentionSuggestionsRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message GetMentionSuggestionsResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1;
        NOT_FOUND = 2;
    }

    // The suggestions, most relevant first, as many as the server chooses.
    // Set when result is OK.
    repeated MentionSuggestion suggestions = 2 [(validate.rules).repeated = {
        min_items: 0
        max_items: 200
    }];
}

message StartChatRequest {
    // Parameters for the kind of chat being created. The variant selects the
    // kind of chat. Both create a chat of type GROUP: one public, one
    // private.
    oneof parameters {
        option (validate.required) = true;

        PublicGroupChatParameters  group         = 1;
        PrivateGroupChatParameters private_group = 2;
    }

    // Parameters for creating a public group chat: one that users join with
    // JoinChat, subject to its rules.
    message PublicGroupChatParameters {
        // Title for the chat.
        string title = 1 [(validate.rules).string = {
            min_len: 1
            max_len: 64
        }];

        // The blob holding the ORIGINAL picture the caller uploaded. Optional.
        // If set, it must be owned by the caller and READY.
        blob.v1.BlobId picture = 2;

        // Rules governing participation in the chat. Optional; if not set, the
        // chat has no participation requirements. Caller must satisfy the rules
        // in order for the chat to be started.
        Rules rules = 3;
    }

    // Parameters for creating a private group chat (see Metadata.is_private):
    // one whose creator admits each member from its lobby, and whose messages
    // are end-to-end encrypted. Whether a group is private is fixed for the
    // life of the chat. A private group has no rules.
    //
    // Creating a private group takes two steps. A key envelope is bound to
    // the chat's ID, which the caller learns only from the response, so the
    // caller generates the chat key once StartChat returns and stores its own
    // envelope with SetKeyEnvelope (see KeyEnvelope).
    //
    // Until the creator's envelope is stored, the group has no key. It
    // exists and is visible like any other private group: GetChat returns
    // it, and it appears in the creator's GetGroupChatFeed. But nothing can
    // happen in it, and the server refuses each of these as DENIED:
    //  - EnterLobby, by anyone
    //  - ApproveLobbyMember
    //  - Messaging.SendMessage and Messaging.EditMessage
    //  - BlobStorage.InitiateExternalUpload of a blob encrypted for the chat
    // The creator's client must keep attempting SetKeyEnvelope until it
    // succeeds. Storing the envelope lifts every refusal above, and it is
    // never undone: the creator's envelope is kept even if they leave.
    message PrivateGroupChatParameters {
        // Title for the chat.
        string title = 1 [(validate.rules).string = {
            min_len: 1
            max_len: 64
        }];

        // The blob holding the ORIGINAL picture the caller uploaded. Optional.
        // If set, it must be owned by the caller and READY.
        blob.v1.BlobId picture = 2;
    }

    // Key for retrying this request safely. A retry with the same key from the
    // same caller returns the chat the first attempt created, with result OK,
    // even if the parameters differ.
    IdempotencyKey idempotency_key = 9 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message StartChatResponse {
    Result result = 1;
    enum Result {
        OK                        = 0;
        DENIED                    = 1;
        TITLE_MODERATED           = 2;
        PICTURE_BLOB_NOT_ACCEPTED = 3;
        INVALID_RULES             = 4;
        RULES_NOT_SATISFIED       = 5;
    }

    // The metadata for the newly created chat, including the server-generated
    // chat_id and any picture renditions the server derived. Set only when
    // result == OK.
    Metadata chat = 2;

    // The best-fit category that tripped moderation, mirroring the Moderation
    // service's vocabulary. Set only when result == TITLE_MODERATED; NONE
    // otherwise.
    moderation.v1.FlaggedCategory flagged_category = 3;
}

message JoinChatRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message JoinChatResponse {
    Result result = 1;
    enum Result {
        OK                  = 0;
        DENIED              = 1;
        NOT_FOUND           = 2;
        RULES_NOT_SATISFIED = 3;
    }

    // The metadata for the joined chat, as seen by the caller. Set only when
    // result == OK.
    Metadata chat = 2;
}

message LeaveChatRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message LeaveChatResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1;
        NOT_FOUND = 2;
    }
}

message EditChatRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    // The new title. Left unchanged when unset.
    Title title = 2;

    // The new picture. Left unchanged when unset.
    Picture picture = 3;

    message Title {
        string value = 1 [(validate.rules).string = {
            min_len: 1
            max_len: 64
        }];
    }

    message Picture {
        // The blob holding the ORIGINAL picture the caller uploaded. It must be
        // owned by the caller and READY; the server derives the remaining
        // renditions from it.
        blob.v1.BlobId blob_id = 1 [(validate.rules).message.required = true];
    }

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message EditChatResponse {
    Result result = 1;
    enum Result {
        OK                        = 0;
        DENIED                    = 1;
        NOT_FOUND                 = 2;
        TITLE_MODERATED           = 3;
        PICTURE_BLOB_NOT_ACCEPTED = 4;
    }

    // The metadata for the chat after the edit, as seen by the caller,
    // including any picture renditions the server derived. Set only when
    // result == OK.
    Metadata chat = 2;

    // The best-fit category that tripped moderation, mirroring the Moderation
    // service's vocabulary. Set only when result == TITLE_MODERATED; NONE
    // otherwise.
    moderation.v1.FlaggedCategory flagged_category = 3;
}

message MuteChatRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    // How long to mute for. A timed mute must end in the future; the server
    // rejects one that does not.
    MuteState mute = 2 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message MuteChatResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1; // Caller is not a member
        NOT_FOUND = 2;
    }

    // The caller's state for the chat after the write, so the client can
    // apply it at its version. Set only when result == OK.
    ViewerState viewer_state = 2;
}

message UnmuteChatRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message UnmuteChatResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1;
        NOT_FOUND = 2;
    }

    // As for MuteChatResponse.viewer_state.
    ViewerState viewer_state = 2;
}

message EnterLobbyRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message EnterLobbyResponse {
    Result result = 1;
    enum Result {
        OK               = 0;
        DENIED           = 1; // The chat is not a private group, or has no key yet (see EnterLobby)
        NOT_FOUND        = 2;
        ALREADY_MEMBER   = 3; // Caller is already a member of the chat
        LOBBY_FULL       = 4; // The chat's lobby holds as many users as the server allows
        TOO_MANY_LOBBIES = 5; // Caller is waiting in as many lobbies as the server allows
    }

    // The caller's place in the lobby, so the client can record the chat it
    // is now waiting in without a refetch. Set only when result == OK.
    Lobby lobby = 2;
}

message LeaveLobbyRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message LeaveLobbyResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1; // The chat is not a private group
        NOT_FOUND = 2;
    }
}

message GetLobbyMembersRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    // QueryOptions controls page_size, capped at 100. Ordering is fixed to
    // earliest entered first and is not client-selectable.
    //
    // Leave query_options.paging_token unset on the first request. On every
    // subsequent request, set it to the paging_token from the most recent
    // response. The token is opaque and server-generated; do not construct
    // it. It is bound to chat_id and refused with another chat.
    common.v1.QueryOptions query_options = 2;

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message GetLobbyMembersResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1; // Caller is not the chat's creator, or the chat is not a private group
        NOT_FOUND = 2;
    }

    // The page, earliest entered first. Set when result is OK.
    repeated LobbyMember members = 2 [(validate.rules).repeated = {
        min_items: 0
        max_items: 100
    }];

    // PagingToken carries the cursor after the last member returned. The
    // client MUST send it back in query_options.paging_token on the next
    // GetLobbyMembersRequest. Set when result is OK and has_more is true.
    common.v1.PagingToken paging_token = 3;

    // HasMore indicates whether further pages remain. When true, the client
    // should issue another GetLobbyMembersRequest with the returned
    // paging_token.
    bool has_more = 4;
}

message ApproveLobbyMemberRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    // The user to admit, who must be waiting in the chat's lobby.
    common.v1.UserId user_id = 2 [(validate.rules).message.required = true];

    // The chat key wrapped by the caller for that user's public key, as
    // given by LobbyMember.public_key (see KeyEnvelope). The server cannot
    // check its contents: an envelope the user cannot open leaves them a
    // member who cannot read the chat.
    KeyEnvelope key_envelope = 3 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message ApproveLobbyMemberResponse {
    Result result = 1;
    enum Result {
        OK           = 0;
        DENIED       = 1; // Caller may not admit users to this chat (see ApproveLobbyMember)
        NOT_FOUND    = 2;
        NOT_IN_LOBBY = 3; // The user is neither waiting in the lobby nor a member
    }
}

message DenyLobbyMemberRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    // The user to remove from the chat's lobby.
    common.v1.UserId user_id = 2 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message DenyLobbyMemberResponse {
    Result result = 1;
    enum Result {
        OK        = 0;
        DENIED    = 1; // Caller is not the chat's creator, or the chat is not a private group
        NOT_FOUND = 2;
    }
}

message SetKeyEnvelopeRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    // The chat key wrapped by the caller for themself (see KeyEnvelope).
    KeyEnvelope key_envelope = 2 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message SetKeyEnvelopeResponse {
    Result result = 1;
    enum Result {
        OK          = 0;
        DENIED      = 1; // Caller is not a member, or the chat is not a private group
        NOT_FOUND   = 2;
        ALREADY_SET = 3; // Caller already stored a different envelope of their own, which stands
    }
}

message GetKeyEnvelopeRequest {
    common.v1.ChatId chat_id = 1 [(validate.rules).message.required = true];

    common.v1.Auth auth = 10 [(validate.rules).message.required = true];
}

message GetKeyEnvelopeResponse {
    Result result = 1;
    enum Result {
        OK          = 0;
        DENIED      = 1; // Caller is not a member, or the chat is not a private group
        NOT_FOUND   = 2;
        NO_ENVELOPE = 3; // Caller is a member with no envelope stored
    }

    // The caller's key envelope. Set only when result == OK.
    KeyEnvelope key_envelope = 2;

    // The user who stored the envelope, as the server authenticated them:
    // the caller, or the chat's creator. It tells the client whose public
    // key to open the envelope against (see KeyEnvelope), and is only a
    // hint: an envelope that does not open against that key is rejected. Set
    // only when result == OK.
    common.v1.UserId wrapped_by = 3;
}

syntax = "proto3";

package flipcash.storage.v1;

option go_package = "github.com/code-payments/flipcash2-protobuf-api/generated/go/storage/v1;storagepb";
option java_package = "com.codeinc.flipcash.gen.storage.v1";
option objc_class_prefix = "FPBStorageV1";

import "common/v1/common.proto";
import "phone/v1/model.proto";
import "validate/validate.proto";

// X25519PublicKey is a Curve25519 (X25519) public key. Kept distinct from
// common.v1.PublicKey so the curve is visible at the type level.
message X25519PublicKey {
    bytes value = 1 [(validate.rules).bytes = {
        min_len: 32
        max_len: 32
    }];
}

// X25519Blob is the wire and at-rest envelope for a proto message that a user
// has encrypted to themselves. EncryptedStorage uses it so the user can store
// data the server cannot read: the user encrypts under their own long-term
// X25519 public key, the server stores the envelope opaquely, and any of the
// user's own devices holding the matching X25519 private key can later
// decrypt.
//
// The envelope itself is not encrypted: ephemeral_pub_key travels in the
// clear so that the user's decrypting device can derive the shared secret.
// Only encrypted_blob is confidential.
//
// Cryptographic construction — version 1 (selected on the wire by
// `version = 1`). All parties below are the same user, possibly on
// different devices. Future migrations (different curve, KDF, or AEAD)
// will allocate new wire versions; decrypters MUST inspect `version`
// first and reject any value they do not implement, rather than
// attempting to apply the wrong construction.
//   1. The encrypting device generates an ephemeral X25519 keypair; the
//      public half goes in ephemeral_pub_key. The ephemeral private key is
//      used once and discarded.
//   2. The device computes its own 32-byte static X25519 public key by
//      applying the Curve25519 birational map to the account's Ed25519
//      identity public key (the same key carried in common.v1.Auth;
//      libsodium's crypto_sign_ed25519_pk_to_curve25519). Call this
//      `owner_x25519_pub`. The matching private key, used in the next
//      step, is the birational map of the Ed25519 private key
//      (crypto_sign_ed25519_sk_to_curve25519); both keys are recoverable
//      on any device that holds the user's 12-word access key.
//   3. The device performs X25519 ECDH(ephemeral_priv, owner_x25519_pub)
//      to obtain a 32-byte shared secret.
//   4. The device derives a 32-byte AEAD key with HKDF-SHA256:
//          salt = empty
//          info = "flipcash.storage.v1/x25519-aes256gcm/v1"   (label)
//                 || ephemeral_pub_key.value                  (32 bytes)
//                 || owner_x25519_pub                         (32 bytes)
//          IKM  = the ECDH shared secret from step 3
//      The two public keys are appended at fixed 32-byte offsets so the
//      derived key is bound to this specific exchange (key separation
//      across ephemerals and across owners, per HPKE/RFC 9180).
//      `owner_x25519_pub` is the value computed in step 2 — the
//      account's Ed25519 identity key mapped to X25519. Decryption MUST
//      reconstruct `info` byte-for-byte (same label, same ephemeral,
//      same `owner_x25519_pub` re-derived from the account's Ed25519
//      public key) or the AEAD tag will fail.
//   5. The device encrypts the marshalled plaintext proto with AES-256-GCM:
//          key   = the HKDF output from step 4
//          nonce = 12 random bytes, freshly generated per encryption
//          AAD   = the deterministic protobuf serialization of the
//                  StorageKey that addresses this blob (see StorageKey)
//          tag   = 16 bytes
//      and writes  nonce(12) || ciphertext || tag(16)  into encrypted_blob.
//   6. To decrypt, any of the user's devices holding the 12-word access
//      key re-derives the Ed25519 identity keypair, maps it to X25519 to
//      recover (owner_x25519_priv, owner_x25519_pub), performs
//      ECDH(owner_x25519_priv, ephemeral_pub_key) to obtain the shared
//      secret, reconstructs `info` byte-for-byte from the label, the
//      envelope's `ephemeral_pub_key`, and the locally derived
//      `owner_x25519_pub`, runs HKDF to recover the AEAD key, splits
//      encrypted_blob into (nonce, ciphertext, tag), and decrypts with
//      AAD = the deterministic protobuf serialization of the StorageKey
//      used to fetch. A slot-swap attack by the server fails the AEAD
//      tag check before any plaintext reaches the proto parser; a
//      substituted `ephemeral_pub_key` fails for the same reason
//      because it changes the HKDF info.
//
// Key-reuse note: the Ed25519 signing key and the X25519 ECDH key share
// underlying scalar material. This reuse is intentional (it lets a user
// recover encrypted storage from the 12-word access key alone, with no
// separate registration step) and follows the same pattern as Signal's
// X3DH. The construction is safe because (a) AEAD uses a per-encryption
// random nonce, (b) the HKDF info binds each derivation to a fresh
// ephemeral public key, and (c) signing and ECDH operate over disjoint
// message spaces with domain separation provided by HKDF.
//
// When used with EncryptedStorage, encrypted_blob decrypts to a marshalled
// EncryptedPayload.
message X25519Blob {
    // Ephemeral X25519 public key generated by the encrypting device,
    // freshly generated per encryption.
    X25519PublicKey ephemeral_pub_key = 1 [(validate.rules).message.required = true];

    // AES-256-GCM ciphertext framed as nonce(12) || ciphertext || tag(16),
    // keyed by HKDF-SHA256 over the X25519 ECDH shared secret (see message
    // comment). AAD is the deterministic protobuf serialization of the
    // owning StorageKey. Minimum length is 28 bytes (nonce + tag, empty
    // plaintext).
    bytes encrypted_blob = 2 [(validate.rules).bytes = {
        min_len: 28
        max_len: 4096
    }];

    // Cryptographic construction version. MUST be 1 for the construction
    // described in the message comment above (X25519 ECDH against the
    // owner's birationally-mapped Ed25519 identity key, HKDF-SHA256 with
    // the label "flipcash.storage.v1/x25519-aes256gcm/v1" and both public
    // keys bound into `info`, AES-256-GCM with the StorageKey as AAD).
    //
    // Future revisions of the construction (different curve, KDF, or
    // AEAD) MUST allocate a new version number and ship as a distinct
    // value here. Decrypters MUST reject any version they do not
    // implement rather than attempting to apply the wrong construction.
    // Servers MAY enforce a minimum/maximum accepted version range.
    uint32 version = 3 [(validate.rules).uint32.gte = 1];
}

// StorageKey identifies a single blob slot. The variant selects which kind
// of secret the slot holds; the inner message carries any per-purpose
// discriminator needed to disambiguate among multiple slots of the same
// kind (e.g., one ContactListVerificationKey slot per contact phone number).
//
// Encoding contract: the deterministic protobuf serialization of StorageKey
// is bound as AEAD AAD on each X25519Blob (see X25519Blob). The encrypting
// and decrypting devices MUST use a protobuf encoder configured for
// deterministic output so both sides produce byte-identical AAD.
message StorageKey {
    oneof key {
        option (validate.required) = true;

        ContactListVerificationKey contact_list_verification_key = 1;
    }

    message ContactListVerificationKey {
        phone.v1.PhoneNumber phone_number = 1 [(validate.rules).message.required = true];

        common.v1.PublicKey public_key = 2 [(validate.rules).message.required = true];
    }
}

// EncryptedPayload is the plaintext schema produced by decrypting an
// X25519Blob's encrypted_blob field.
//
// The slot binding (which StorageKey this payload was written under) is
// authenticated by the AEAD AAD on the envelope, not by a field inside the
// payload, so a slot-swap attack by the server fails the AEAD tag check
// before this message is ever parsed.
//
// Invariant: each `value` oneof variant corresponds 1:1 with a StorageKey
// variant of the same field name; the variant on the payload and the variant
// on the addressing StorageKey must agree.
message EncryptedPayload {
    oneof value {
        option (validate.required) = true;

        ContactListVerificationKey contact_list_verification_key = 1;
    }

    message ContactListVerificationKey {
        common.v1.PrivateKey private_key = 1 [(validate.rules).message.required = true];
    }
}
